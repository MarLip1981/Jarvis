# JARVIS 2.0 — lokalny plik główny ESPHome
# Sekrety pozostają lokalnie w Home Assistant; nie trafiają do zdalnych packages.
esphome:
  name: room-switcher
  friendly_name: "Przelacznik pomieszczen"
  on_boot:
    priority: -100
    then:
      # Diagnostyka przyczyny poprzedniego resetu i pamięci — tylko log, bez zmiany działania UI.
      - lambda: |-
          const esp_reset_reason_t reason = esp_reset_reason();
          const char *reason_name = "inne/nieznane";
          switch (reason) {
            case ESP_RST_UNKNOWN: reason_name = "nieznana"; break;
            case ESP_RST_POWERON: reason_name = "zasilanie"; break;
            case ESP_RST_SW: reason_name = "programowy"; break;
            case ESP_RST_PANIC: reason_name = "PANIC/crash"; break;
            case ESP_RST_INT_WDT: reason_name = "interrupt watchdog"; break;
            case ESP_RST_TASK_WDT: reason_name = "task watchdog"; break;
            case ESP_RST_WDT: reason_name = "watchdog"; break;
            case ESP_RST_DEEPSLEEP: reason_name = "wybudzenie"; break;
            case ESP_RST_BROWNOUT: reason_name = "BROWNOUT/spadek zasilania"; break;
            case ESP_RST_SDIO: reason_name = "SDIO"; break;
            default: break;
          }
          ESP_LOGI("JARVIS BOOT", "Przyczyna poprzedniego resetu: %s (kod=%d)",
                   reason_name, static_cast<int>(reason));
          ESP_LOGI("JARVIS BOOT", "Pamiec po starcie: wolny heap=%u B, minimum heap od startu=%u B, najwiekszy blok=%u B, uptime=%u ms",
                   static_cast<unsigned>(ESP.getFreeHeap()),
                   static_cast<unsigned>(ESP.getMinFreeHeap()),
                   static_cast<unsigned>(ESP.getMaxAllocHeap()),
                   static_cast<unsigned>(millis()));
      - light.turn_on:
          id: tft_backlight
          brightness: 100%
      # Ekran tytulowy sam sie pokazuje (jest pierwsza strona),
      # po chwili przechodzimy do pelnoekranowego testu R/G/B
      - delay: 2000ms
      - lvgl.page.show:
          id: page_flash
          animation: NONE

wifi:
  id: wifi_comp
  output_power: 20dB
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_backup_ssid
      password: !secret wifi_backup_pass
  ap:
    ssid: "RoomSwitcher"

api:
  encryption:
    key: !secret room_switcher__encryption_key

# Moduły pobierane z repozytorium podczas kompilacji.
packages:
  jarvis_remote:
    url: https://github.com/MarLip1981/Jarvis
    ref: test-sd-card
    # Krótki interwał odświeżania zapobiega kompilacji ze starej kopii
    # z cache ESPHome po zmianach w repozytorium.
    refresh: 1min
    files:
      - packages/hardware.yaml
      - packages/entities.yaml
      - packages/logic.yaml
      - packages/ui/base.yaml
      - packages/ui/pages/system.yaml
      - packages/ui/pages/dashboard.yaml
      - packages/ui/pages/living-room.yaml
      - packages/ui/pages/bedrooms.yaml
      - packages/ui/pages/heating.yaml
      - packages/ui/pages/gate.yaml
      - packages/runtime.yaml
