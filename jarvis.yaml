# JARVIS 2.0 — lokalny plik główny ESPHome
# Sekrety pozostają lokalnie w Home Assistant; nie trafiają do zdalnych packages.
esphome:
  name: room-switcher
  friendly_name: "Przelacznik pomieszczen"
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: tft_backlight
          brightness: 100%
      # Ekran tytulowy sam sie pokazuje (jest pierwsza strona),
      # po chwili przechodzimy do pelnoekranowego testu R/G/B
      - delay: 2000ms
      - lvgl.page.show:
          id: page_flash
          animation: NONE

wifi:
  id: wifi_comp
  output_power: 20dB
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_backup_ssid
      password: !secret wifi_backup_pass
  ap:
    ssid: "RoomSwitcher"

api:
  encryption:
    key: !secret room_switcher__encryption_key

# Moduły pobierane z repozytorium podczas kompilacji.
packages:
  jarvis_remote:
    url: https://github.com/MarLip1981/Jarvis
    ref: main
    # Krótki interwał odświeżania zapobiega kompilacji ze starej kopii
    # z cache ESPHome po zmianach w repozytorium.
    refresh: 1min
    files:
      - packages/hardware.yaml
      - packages/entities.yaml
      - packages/logic.yaml
      - packages/ui/base.yaml
      - packages/ui/pages/system.yaml
      - packages/ui/pages/dashboard.yaml
      - packages/ui/pages/living-room.yaml
      - packages/ui/pages/bedrooms.yaml
      - packages/ui/pages/heating.yaml
      - packages/ui/pages/gate.yaml
      - packages/runtime.yaml
