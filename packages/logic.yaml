# JARVIS 2.0 — STAN WEWNĘTRZNY I SKRYPTY
# Moduł wydzielony mechanicznie z room-switcher-cyd (3).yaml.
# Na tym etapie zachowujemy istniejącą logikę i identyfikatory.

globals:
  - id: last_activity_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: screen_dimmed
    type: bool
    restore_value: false
    initial_value: "false"
  - id: screen_off
    type: bool
    restore_value: false
    initial_value: "false"
  - id: screen_was_asleep
    type: bool
    restore_value: false
    initial_value: "false"
  # Blokada akcji dla przeciągnięć i pierwszego dotyku wybudzającego.
  # Resetowana wyłącznie na początku kolejnego fizycznego gestu.
  - id: touch_gesture_blocked
    type: bool
    restore_value: false
    initial_value: "false"
  - id: door_open_since_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: door_state_initialized
    type: bool
    restore_value: false
    initial_value: "false"
  - id: brama_page_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: brama_waiting_for_motion
    type: bool
    restore_value: false
    initial_value: "false"
  - id: brama_closed_since_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: brama_backlight_override
    type: bool
    restore_value: false
    initial_value: "false"
  - id: brama_backlight_original_on
    type: bool
    restore_value: false
    initial_value: "true"
  - id: brama_backlight_original_brightness
    type: float
    restore_value: false
    initial_value: "1.0"
  - id: brama_closed_flash_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: brama_position_start
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: brama_position_target
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: brama_position_visual
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: brama_position_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: identify_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cache_indoor_temp
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: cache_humidity
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: cache_outdoor_temp
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: cache_piec_target
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: btn_press_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: easter_tap_count
    type: int
    restore_value: false
    initial_value: "0"
  - id: easter_tap_last_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: easter_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: radio_is_playing
    type: bool
    restore_value: false
    initial_value: "false"
  - id: lamp_state_mask
    type: uint16_t
    restore_value: false
    initial_value: "0"
  - id: lamp_selected
    type: std::string
    restore_value: false
    initial_value: '"salon"'

# ---------------------------------------------------------
# Wspolny skrypt potwierdzenia kliknięcia - LED na zielono +
# blysk strzalki w gore. Wolany z KAZDEGO przycisku jedna
# linijka (script.execute: confirm_click), zamiast kopiowania
# tej samej sekwencji za kazdym razem.
# ---------------------------------------------------------
script:
  - id: sync_dashboard_door_state
    then:
      - if:
          condition:
            lambda: 'return id(state_drzwi).has_state();'
          then:
            - if:
                condition:
                  lambda: 'return id(state_drzwi).state;'
                then:
                  - globals.set:
                      id: door_open_since_ms
                      value: !lambda 'return (esphome::millis)();'
                  - lvgl.label.update:
                      id: lbl_pulpit_drzwi
                      text: "Drzwi:   #FF0000 OTWARTE 0s#"
                  - lvgl.label.update:
                      id: lbl_drzwi_icon
                      text: "\U000F081C"
                      text_color: 0xFF0000
                else:
                  - lvgl.label.update:
                      id: lbl_pulpit_drzwi
                      text: "Drzwi:   #00FF00 zamknięte#"
                  - lvgl.label.update:
                      id: lbl_drzwi_icon
                      text: "\U000F081B"
                      text_color: 0x888888
            - globals.set:
                id: door_state_initialized
                value: "true"

  - id: update_pulpit_climate_line
    then:
      - lambda: |-
          // Statyczny bufor: zmiany temperatury/wilgotnosci nie alokują tekstu w heap.
          static char climate_buf[64];
          char t_in[8], hum[8], t_out[8];
          if (!std::isnan(id(cache_indoor_temp))) snprintf(t_in, sizeof(t_in), "%.1f", id(cache_indoor_temp));
          else snprintf(t_in, sizeof(t_in), "--.-");
          if (!std::isnan(id(cache_humidity))) snprintf(hum, sizeof(hum), "%.0f", id(cache_humidity));
          else snprintf(hum, sizeof(hum), "--");
          if (!std::isnan(id(cache_outdoor_temp))) snprintf(t_out, sizeof(t_out), "%.1f", id(cache_outdoor_temp));
          else snprintf(t_out, sizeof(t_out), "--.-");
          snprintf(climate_buf, sizeof(climate_buf), "%s°C  %s%%  Zewnątrz %s°C", t_in, hum, t_out);
          lv_label_set_text_static(id(lbl_pulpit_climate), climate_buf);

  - id: update_calendar_labels
    then:
      # Dzien i data zmieniaja sie tylko po synchronizacji czasu lub o polnocy.
      # Statyczne bufory unikaja dynamicznej alokacji LVGL dla tych etykiet.
      - lambda: |-
          static char day_buf[32];
          static char date_buf[32];
          auto t = id(sntp_time).now();
          if (!t.is_valid()) {
            snprintf(day_buf, sizeof(day_buf), "---");
            snprintf(date_buf, sizeof(date_buf), "--.--.----");
          } else {
            static const char* dni[] = {"Niedziela","Poniedziałek","Wtorek","Środa",
                                         "Czwartek","Piątek","Sobota"};
            static const char* miesiace[] = {"stycznia","lutego","marca","kwietnia","maja",
                                              "czerwca","lipca","sierpnia","września",
                                              "października","listopada","grudnia"};
            snprintf(day_buf, sizeof(day_buf), "%s", dni[t.day_of_week - 1]);
            snprintf(date_buf, sizeof(date_buf), "%d %s %d", t.day_of_month, miesiace[t.month - 1], t.year);
          }
          lv_label_set_text_static(id(lbl_pulpit_day), day_buf);
          lv_label_set_text_static(id(lbl_pulpit_date), date_buf);

  # Przygotowuje wspolna strone lampy wedlug wybranego pomieszczenia.
  # Odświeża widok lamp na pulpicie wyłącznie po zmianie stanu HA.
  # Wcześniej ten sam blok wykonywał się co sekundę, niezależnie od zmian.
  - id: update_radio_labels
    mode: restart
    then:
      - lambda: |-
          static char station_buf[64];
          static char title_buf[128];
          static char dashboard_buf[192];
          const char *station = id(radio_stacja).has_state() ? id(radio_stacja).state.c_str() : "--";
          const char *track = id(radio_tytul).has_state() ? id(radio_tytul).state.c_str() : "--";
          snprintf(station_buf, sizeof(station_buf), "%s", station && *station ? station : "--");
          snprintf(title_buf, sizeof(title_buf), "%s", track && *track ? track : "--");
          if (!id(radio_is_playing)) {
            snprintf(dashboard_buf, sizeof(dashboard_buf), "Radio:   nie gra");
          } else {
            snprintf(dashboard_buf, sizeof(dashboard_buf), "Radio:   %.48s  * %.112s", station_buf, title_buf);
          }
          lv_label_set_text_static(id(lbl_radio_stacja), station_buf);
          lv_label_set_text_static(id(lbl_radio_tytul), title_buf);
          lv_label_set_text_static(id(lbl_pulpit_radio), dashboard_buf);
  - id: update_dashboard_lamps
    mode: restart
    then:
      - lambda: |-
          const uint16_t states = id(lamp_state_mask);
          const uint16_t states = id(lamp_state_mask);
          const bool salon_on = ((states >> 0) & 3u) == 2u;
          const bool studio_on = ((states >> 2) & 3u) == 2u;
          const bool erni_on = ((states >> 4) & 3u) == 2u;
          const bool wejscie_on = ((states >> 6) & 3u) == 2u;
          const bool wjazd_on = ((states >> 8) & 3u) == 2u;
          const bool podworko_on = ((states >> 10) & 3u) == 2u;
          const bool adresowka_on = ((states >> 12) & 3u) == 2u;
          const int on_count = (salon_on ? 1 : 0) + (studio_on ? 1 : 0) + (erni_on ? 1 : 0) +
                               (wejscie_on ? 1 : 0) + (wjazd_on ? 1 : 0) +
                               (podworko_on ? 1 : 0) + (adresowka_on ? 1 : 0);

          int row = 0;
          if (salon_on) {
            lv_obj_set_pos(id(btn_lampy_salon), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_salon), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_salon), LV_OBJ_FLAG_HIDDEN);
          if (studio_on) {
            lv_obj_set_pos(id(btn_lampy_sypialnia), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_sypialnia), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_sypialnia), LV_OBJ_FLAG_HIDDEN);
          if (erni_on) {
            lv_obj_set_pos(id(btn_lampy_erni), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_erni), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_erni), LV_OBJ_FLAG_HIDDEN);
          if (wejscie_on) {
            lv_obj_set_pos(id(btn_lampy_wejscie), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_wejscie), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_wejscie), LV_OBJ_FLAG_HIDDEN);
          if (wjazd_on) {
            lv_obj_set_pos(id(btn_lampy_wjazd), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_wjazd), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_wjazd), LV_OBJ_FLAG_HIDDEN);
          if (podworko_on) {
            lv_obj_set_pos(id(btn_lampy_podworko), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_podworko), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_podworko), LV_OBJ_FLAG_HIDDEN);
          if (adresowka_on) {
            lv_obj_set_pos(id(btn_lampy_adresowka), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_adresowka), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_adresowka), LV_OBJ_FLAG_HIDDEN);

          // Bufor statyczny: tekst licznika zmienia sie tylko po zdarzeniu HA.
          static char lamp_count_buf[40];
          if (on_count == 0) {
            snprintf(lamp_count_buf, sizeof(lamp_count_buf), "#888888 0#");
          } else {
            const char *form = on_count == 1 ? "włączona" :
                               (on_count >= 2 && on_count <= 4 ? "włączone" : "włączonych");
            snprintf(lamp_count_buf, sizeof(lamp_count_buf), "#00FF00 %d %s#", on_count, form);
          }
          lv_label_set_text_static(id(lbl_pulpit_lamps), lamp_count_buf);
          lv_obj_set_style_text_color(id(lbl_pulpit_lamps_icon),
            lv_color_hex(on_count > 0 ? 0x00FF00 : 0x888888), 0);
          lv_label_set_text_static(id(lbl_pulpit_lamps_icon),
            on_count > 0 ? "\U000F0335" : "\U000F0336");
          if (on_count > 0) lv_obj_add_flag(id(lbl_lampy_empty), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(lbl_lampy_empty), LV_OBJ_FLAG_HIDDEN);

          const bool salon_valid = ((states >> 0) & 3u) != 0u;
          const bool studio_valid = ((states >> 2) & 3u) != 0u;
          const bool erni_valid = ((states >> 4) & 3u) != 0u;

          lv_label_set_text_static(id(lbl_salon_glowna_text),
            !salon_valid ? "Lampa: niedostępna" : (salon_on ? "Lampa: WŁĄCZONA" : "Lampa: wyłączona"));
          lv_obj_set_style_text_color(id(lbl_salon_glowna_text),
            lv_color_hex(!salon_valid ? 0xFF3333 : (salon_on ? 0x00FF00 : 0xFFFFFF)), 0);
          lv_label_set_text_static(id(lbl_salon_glowna_icon),
            !salon_valid ? "\U000F0E4F" : (salon_on ? "\U000F06E8" : "\U000F0336"));
          lv_obj_set_style_text_color(id(lbl_salon_glowna_icon),
            lv_color_hex(!salon_valid ? 0xFF3333 : (salon_on ? 0x00FF00 : 0x888888)), 0);

          lv_label_set_text_static(id(lbl_sypialnia_lampa),
            !studio_valid ? "Lampa: niedostępna" : (studio_on ? "Lampa: WŁĄCZONA" : "Lampa: wyłączona"));
          lv_obj_set_style_text_color(id(lbl_sypialnia_lampa),
            lv_color_hex(!studio_valid ? 0xFF3333 : (studio_on ? 0x00FF00 : 0xFFFFFF)), 0);
          lv_label_set_text_static(id(lbl_sypialnia_lampa_icon),
            !studio_valid ? "\U000F0E4F" : (studio_on ? "\U000F06E8" : "\U000F0336"));
          lv_obj_set_style_text_color(id(lbl_sypialnia_lampa_icon),
            lv_color_hex(!studio_valid ? 0xFF3333 : (studio_on ? 0x00FF00 : 0x888888)), 0);

          lv_label_set_text_static(id(lbl_erni_lampa),
            !erni_valid ? "Lampa: niedostępna" : (erni_on ? "Lampa: WŁĄCZONA" : "Lampa: wyłączona"));
          lv_obj_set_style_text_color(id(lbl_erni_lampa),
            lv_color_hex(!erni_valid ? 0xFF3333 : (erni_on ? 0x00FF00 : 0xFFFFFF)), 0);
          lv_label_set_text_static(id(lbl_erni_lampa_icon),
            !erni_valid ? "\U000F0E4F" : (erni_on ? "\U000F06E8" : "\U000F0336"));
          lv_obj_set_style_text_color(id(lbl_erni_lampa_icon),
            lv_color_hex(!erni_valid ? 0xFF3333 : (erni_on ? 0x00FF00 : 0x888888)), 0);
  - id: prepare_lamp_page
    mode: restart
    then:
      - lambda: |-
          const uint16_t states = id(lamp_state_mask);
          uint8_t state = 0;
          const char *title = "ERNI";
          if (id(lamp_selected) == "salon") { title = "SALON"; state = (states >> 0) & 3u; }
          else if (id(lamp_selected) == "studio") { title = "SYPIALNIA"; state = (states >> 2) & 3u; }
          else if (id(lamp_selected) == "adresowka") { title = "ADRESÓWKA"; state = (states >> 12) & 3u; }
          else if (id(lamp_selected) == "wejscie_schodki") { title = "WEJŚCIE / SCHODKI"; state = (states >> 6) & 3u; }
          else if (id(lamp_selected) == "outdoor_wjazd") { title = "WJAZD"; state = (states >> 8) & 3u; }
          else if (id(lamp_selected) == "outdoor_podworko") { title = "PODWÓRKO"; state = (states >> 10) & 3u; }
          else if (id(lamp_selected) == "erni") { title = "ERNI"; state = (states >> 4) & 3u; }

          const char *status = state == 2 ? "Lampa: WŁĄCZONA" : state == 1 ? "Lampa: wyłączona" : "Lampa: niedostępna";
          const char *icon = state == 2 ? "\U000F06E8" : state == 1 ? "\U000F0336" : "\U000F0E4F";
          const char *toggle = state == 2 ? "WYŁĄCZ LAMPĘ" : state == 1 ? "WŁĄCZ LAMPĘ" : "BRAK POŁĄCZENIA";
          const lv_color_t status_color = state == 2 ? lv_color_hex(0x00FF00) : state == 1 ? lv_color_hex(0xFFFFFF) : lv_color_hex(0xFF3333);
          const lv_color_t icon_color = state == 2 ? lv_color_hex(0x00FF00) : state == 1 ? lv_color_hex(0x888888) : lv_color_hex(0xFF3333);
          lv_label_set_text_static(id(lbl_lampa_title), title);
          lv_label_set_text_static(id(lbl_lampa_status), status);
          lv_obj_set_style_text_color(id(lbl_lampa_status), status_color, 0);
          lv_label_set_text_static(id(lbl_lampa_icon), icon);
          lv_obj_set_style_text_color(id(lbl_lampa_icon), icon_color, 0);
          lv_label_set_text_static(id(lbl_lampa_toggle), toggle);
          lv_obj_set_style_text_color(id(lbl_lampa_toggle), status_color, 0);

          const bool selected_studio = id(lamp_selected) == "studio";
          const bool selected_outdoor = id(lamp_selected) == "outdoor_wjazd" || id(lamp_selected) == "outdoor_podworko";
          const bool selected_salon = id(lamp_selected) == "salon";
          const bool selected_adresowka = id(lamp_selected) == "adresowka";
          if (selected_studio || selected_outdoor) lv_obj_add_flag(id(obj_lampa_adjustments), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(obj_lampa_adjustments), LV_OBJ_FLAG_HIDDEN);
          if (!selected_salon) lv_obj_add_flag(id(obj_lampa_colors), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(obj_lampa_colors), LV_OBJ_FLAG_HIDDEN);
          if (!selected_studio) lv_obj_add_flag(id(obj_lampa_scenes), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(obj_lampa_scenes), LV_OBJ_FLAG_HIDDEN);
          if (!selected_adresowka) lv_obj_add_flag(id(obj_lampa_sos), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(obj_lampa_sos), LV_OBJ_FLAG_HIDDEN);

          if (!id(state_adresowka_sos_raw).has_state()) lv_label_set_text_static(id(lbl_adresowka_sos), "SOS: BRAK STANU");
          else if (id(state_adresowka_sos_raw).state == "on") lv_label_set_text_static(id(lbl_adresowka_sos), "WYŁĄCZ SOS");
          else if (id(state_adresowka_sos_raw).state == "off") lv_label_set_text_static(id(lbl_adresowka_sos), "WŁĄCZ SOS");
          else lv_label_set_text_static(id(lbl_adresowka_sos), "SOS: BRAK STANU");
      - if:
          condition:
            lambda: 'return id(lamp_selected) == "salon" && std::isfinite(id(salon_brightness_attr).state);'
          then:
            - lvgl.slider.update:
                id: slider_lampa_brightness
                value: !lambda 'return (int)(id(salon_brightness_attr).state / 255.0 * 100.0);'
            - lvgl.label.update:
                id: lbl_lampa_brightness_val
                text: !lambda |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%d%%", (int)(id(salon_brightness_attr).state / 255.0 * 100.0));
                  return std::string(buf);
      - if:
          condition:
            lambda: 'return id(lamp_selected) == "erni" && std::isfinite(id(erni_brightness_attr).state);'
          then:
            - lvgl.slider.update:
                id: slider_lampa_brightness
                value: !lambda 'return (int)(id(erni_brightness_attr).state / 255.0 * 100.0);'
            - lvgl.label.update:
                id: lbl_lampa_brightness_val
                text: !lambda |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%d%%", (int)(id(erni_brightness_attr).state / 255.0 * 100.0));
                  return std::string(buf);
      # TEST 046: ustaw suwak z aktualnej jasności lampy Wejście / schodki.
      - if:
          condition:
            lambda: 'return id(lamp_selected) == "wejscie_schodki" && std::isfinite(id(wejscie_schodki_brightness_attr).state);'
          then:
            - lvgl.slider.update:
                id: slider_lampa_brightness
                value: !lambda 'return (int)(id(wejscie_schodki_brightness_attr).state / 255.0 * 100.0);'
            - lvgl.label.update:
                id: lbl_lampa_brightness_val
                text: !lambda |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%d%%", (int)(id(wejscie_schodki_brightness_attr).state / 255.0 * 100.0));
                  return std::string(buf);
      - if:
          condition:
            lambda: 'return id(lamp_selected) == "adresowka" && std::isfinite(id(adresowka_brightness_attr).state);'
          then:
            - lvgl.slider.update:
                id: slider_lampa_brightness
                value: !lambda 'return (int)(id(adresowka_brightness_attr).state / 255.0 * 100.0);'
            - lvgl.label.update:
                id: lbl_lampa_brightness_val
                text: !lambda |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%d%%", (int)(id(adresowka_brightness_attr).state / 255.0 * 100.0));
                  return std::string(buf);

  - id: confirm_click
    mode: restart
    then:
      - light.turn_on:
          id: status_led
          red: 0.0
          green: 1.0
          blue: 0.0
          brightness: 100%
      - lvgl.obj.update:
          id: lbl_arrow_up
          hidden: false
      - delay: 750ms
      - light.turn_off: status_led
      - lvgl.obj.update:
          id: lbl_arrow_up
          hidden: true

  # Wskaźnik odbioru: miga po aktualizacji dowolnej encji HA używanej przez Jarvisa.
  # Tryb restart utrzymuje strzałkę widoczną przez 750 ms od ostatniej aktualizacji.
  - id: ha_rx_flash
    mode: restart
    then:
      - lvgl.obj.update:
          id: lbl_arrow_down
          hidden: false
      - delay: 750ms
      - lvgl.obj.update:
          id: lbl_arrow_down
          hidden: true

  # --- Easter egg: 5x szybkie dotkniecie ikonki HA. Ekran mruga
  # czerwono-zlotem w rytm LED, potem pokazuje "reaktor" i napis. ---
  - id: easter_egg_ironman
    then:
      - globals.set:
          id: easter_active
          value: "true"
      - lvgl.obj.update:
          id: top_bar
          hidden: true
      - lvgl.page.show:
          id: page_ironman
          animation: NONE
      - repeat:
          count: 4
          then:
            - lvgl.page.update:
                id: page_ironman
                bg_color: 0xB22222
            - light.turn_on:
                id: status_led
                red: 1.0
                green: 0.15
                blue: 0.0
                transition_length: 0s
            - delay: 200ms
            - lvgl.page.update:
                id: page_ironman
                bg_color: 0x000000
            - light.turn_on:
                id: status_led
                red: 1.0
                green: 0.7
                blue: 0.0
                transition_length: 0s
            - delay: 200ms
      - lvgl.page.update:
          id: page_ironman
          bg_color: 0x000000
      - lvgl.obj.update:
          id: ironman_img
          hidden: false
      - lvgl.obj.update:
          id: lbl_ironman_text
          hidden: false
      - light.turn_off: status_led

  - id: exit_ironman
    then:
      - globals.set:
          id: easter_active
          value: "false"
      - lvgl.obj.update:
          id: ironman_img
          hidden: true
      - lvgl.obj.update:
          id: lbl_ironman_text
          hidden: true
      - lvgl.obj.update:
          id: top_bar
          hidden: false
      - component.update: ambient_light_raw
      - lvgl.page.show:
          id: page_pulpit
          animation: NONE
          time: 400ms

  # --- "Znajdz JARVIS" - wywolywane przyciskiem z Home Assistant.
  # Miga LED na losowe kolory i pokazuje bialy ekran, dopoki ktos nie
  # dotknie "ZNALEZIONE" na urzadzeniu. UWAGA: ta plytka nie ma
  # fizycznego buzzera, wiec dzwiek celowo pominiety. ---
  - id: identify_device
    then:
      - globals.set:
          id: identify_active
          value: "true"
      - light.turn_on:
          id: tft_backlight
          brightness: 100%
      - lvgl.obj.update:
          id: top_bar
          hidden: true
      - lvgl.page.show:
          id: page_identify
          animation: NONE
      - while:
          condition:
            lambda: 'return id(identify_active);'
          then:
            - light.turn_on:
                id: status_led
                red: !lambda 'return (random_uint32() % 256) / 255.0;'
                green: !lambda 'return (random_uint32() % 256) / 255.0;'
                blue: !lambda 'return (random_uint32() % 256) / 255.0;'
                brightness: 100%
                transition_length: 0s
            - delay: 200ms
      - light.turn_off:
          id: status_led
          transition_length: 0s
      - lvgl.obj.update:
          id: top_bar
          hidden: false
      - component.update: ambient_light_raw
      - lvgl.page.show:
          id: page_pulpit
          animation: NONE

# ---------------------------------------------------------
# Encje z Home Assistanta, ktorymi sterujemy
# ---------------------------------------------------------
# Przycisk widoczny w Home Assistant - "Znajdz to urzadzenie"
