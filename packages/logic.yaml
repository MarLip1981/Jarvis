    type: bool
    restore_value: false
    initial_value: "false"
  - id: door_open_since_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: brama_page_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: brama_waiting_for_motion
    type: bool
    restore_value: false
    initial_value: "false"
  - id: brama_closed_since_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: brama_backlight_override
    type: bool
    restore_value: false
    initial_value: "false"
  - id: brama_backlight_original_on
    type: bool
    restore_value: false
    initial_value: "true"
  - id: brama_backlight_original_brightness
    type: float
    restore_value: false
    initial_value: "1.0"
  - id: brama_closed_flash_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: brama_position_start
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: brama_position_target
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: brama_position_visual
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: brama_position_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: identify_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: cache_indoor_temp
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: cache_humidity
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: cache_outdoor_temp
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: cache_piec_target
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: btn_press_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: easter_tap_count
    type: int
    restore_value: false
    initial_value: "0"
  - id: easter_tap_last_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: easter_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: radio_is_playing
    type: bool
    restore_value: false
    initial_value: "false"
  - id: lamp_selected
    type: std::string
    restore_value: false
    initial_value: '"salon"'

# ---------------------------------------------------------
# Wspolny skrypt potwierdzenia kliknięcia - LED na zielono +
# blysk strzalki w gore. Wolany z KAZDEGO przycisku jedna
# linijka (script.execute: confirm_click), zamiast kopiowania
# tej samej sekwencji za kazdym razem.
# ---------------------------------------------------------
script:
  - id: update_pulpit_climate_line
    then:
      - lvgl.label.update:
          id: lbl_pulpit_climate
          text: !lambda |-
            char buf[64];
            char t_in[8], hum[8], t_out[8];
            if (!std::isnan(id(cache_indoor_temp))) snprintf(t_in, sizeof(t_in), "%.1f", id(cache_indoor_temp));
            else snprintf(t_in, sizeof(t_in), "--.-");
            if (!std::isnan(id(cache_humidity))) snprintf(hum, sizeof(hum), "%.0f", id(cache_humidity));
            else snprintf(hum, sizeof(hum), "--");
            if (!std::isnan(id(cache_outdoor_temp))) snprintf(t_out, sizeof(t_out), "%.1f", id(cache_outdoor_temp));
            else snprintf(t_out, sizeof(t_out), "--.-");
            snprintf(buf, sizeof(buf), "%s°C  %s%%  Zewnątrz %s°C", t_in, hum, t_out);
            return std::string(buf);

  # Przygotowuje wspolna strone lampy wedlug wybranego pomieszczenia.
  # Odświeża widok lamp na pulpicie wyłącznie po zmianie stanu HA.
  # Wcześniej ten sam blok wykonywał się co sekundę, niezależnie od zmian.
  - id: update_dashboard_lamps
    mode: restart
    then:
      - lambda: |-
          const bool salon_on = id(state_salon_lampka_raw).has_state() && id(state_salon_lampka_raw).state == "on";
          const bool studio_on = id(state_sypialnia_lampa_raw).has_state() && id(state_sypialnia_lampa_raw).state == "on";
          const bool erni_on = id(state_erni_lampa_raw).has_state() && id(state_erni_lampa_raw).state == "on";
          const bool wejscie_on = id(state_wejscie_schodki_lampa_raw).has_state() && id(state_wejscie_schodki_lampa_raw).state == "on";
          const bool wjazd_on = id(state_outdoor_wjazd_raw).has_state() && id(state_outdoor_wjazd_raw).state == "on";
          const bool podworko_on = id(state_outdoor_podworko_raw).has_state() && id(state_outdoor_podworko_raw).state == "on";
          const bool adresowka_on = id(state_adresowka_lampa_raw).has_state() && id(state_adresowka_lampa_raw).state == "on";
          const int on_count = (salon_on ? 1 : 0) + (studio_on ? 1 : 0) + (erni_on ? 1 : 0) +
                               (wejscie_on ? 1 : 0) + (wjazd_on ? 1 : 0) +
                               (podworko_on ? 1 : 0) + (adresowka_on ? 1 : 0);

          int row = 0;
          if (salon_on) {
            lv_obj_set_pos(id(btn_lampy_salon), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_salon), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_salon), LV_OBJ_FLAG_HIDDEN);
          if (studio_on) {
            lv_obj_set_pos(id(btn_lampy_sypialnia), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_sypialnia), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_sypialnia), LV_OBJ_FLAG_HIDDEN);
          if (erni_on) {
            lv_obj_set_pos(id(btn_lampy_erni), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_erni), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_erni), LV_OBJ_FLAG_HIDDEN);
          if (wejscie_on) {
            lv_obj_set_pos(id(btn_lampy_wejscie), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_wejscie), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_wejscie), LV_OBJ_FLAG_HIDDEN);
          if (wjazd_on) {
            lv_obj_set_pos(id(btn_lampy_wjazd), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_wjazd), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_wjazd), LV_OBJ_FLAG_HIDDEN);
          if (podworko_on) {
            lv_obj_set_pos(id(btn_lampy_podworko), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_podworko), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_podworko), LV_OBJ_FLAG_HIDDEN);
          if (adresowka_on) {
            lv_obj_set_pos(id(btn_lampy_adresowka), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_adresowka), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_adresowka), LV_OBJ_FLAG_HIDDEN);

          if (on_count == 0) {
            lv_label_set_text(id(lbl_pulpit_lamps), "#888888 0#");
          } else {
            char count_text[40];
            const char *form = on_count == 1 ? "włączona" :
                               (on_count >= 2 && on_count <= 4 ? "włączone" : "włączonych");
            snprintf(count_text, sizeof(count_text), "#00FF00 %d %s#", on_count, form);
            lv_label_set_text(id(lbl_pulpit_lamps), count_text);
          }
          lv_obj_set_style_text_color(id(lbl_pulpit_lamps_icon),
            lv_color_hex(on_count > 0 ? 0x00FF00 : 0x888888), 0);
          lv_label_set_text(id(lbl_pulpit_lamps_icon),
            on_count > 0 ? "\U000F0335" : "\U000F0336");
          if (on_count > 0) lv_obj_add_flag(id(lbl_lampy_empty), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(lbl_lampy_empty), LV_OBJ_FLAG_HIDDEN);
      - lvgl.label.update:
          id: lbl_salon_glowna_text
          text: !lambda |-
            if (!id(state_salon_lampka_raw).has_state() || (id(state_salon_lampka_raw).state != "on" && id(state_salon_lampka_raw).state != "off")) return std::string("Lampa: niedostępna");
            return id(state_salon_lampka_raw).state == "on" ? std::string("Lampa: WŁĄCZONA") : std::string("Lampa: wyłączona");
          text_color: !lambda |-
            if (!id(state_salon_lampka_raw).has_state() || (id(state_salon_lampka_raw).state != "on" && id(state_salon_lampka_raw).state != "off")) return lv_color_hex(0xFF3333);
            return id(state_salon_lampka_raw).state == "on" ? lv_color_hex(0x00FF00) : lv_color_hex(0xFFFFFF);
      - lvgl.label.update:
          id: lbl_salon_glowna_icon
          text: !lambda |-
            if (!id(state_salon_lampka_raw).has_state() || (id(state_salon_lampka_raw).state != "on" && id(state_salon_lampka_raw).state != "off")) return std::string("\U000F0E4F");
            return id(state_salon_lampka_raw).state == "on" ? std::string("\U000F06E8") : std::string("\U000F0336");
          text_color: !lambda |-
            if (!id(state_salon_lampka_raw).has_state() || (id(state_salon_lampka_raw).state != "on" && id(state_salon_lampka_raw).state != "off")) return lv_color_hex(0xFF3333);
            return id(state_salon_lampka_raw).state == "on" ? lv_color_hex(0x00FF00) : lv_color_hex(0x888888);
      - lvgl.label.update:
          id: lbl_sypialnia_lampa
          text: !lambda |-
            if (!id(state_sypialnia_lampa_raw).has_state() || (id(state_sypialnia_lampa_raw).state != "on" && id(state_sypialnia_lampa_raw).state != "off")) return std::string("Lampa: niedostępna");
            return id(state_sypialnia_lampa_raw).state == "on" ? std::string("Lampa: WŁĄCZONA") : std::string("Lampa: wyłączona");
          text_color: !lambda |-
            if (!id(state_sypialnia_lampa_raw).has_state() || (id(state_sypialnia_lampa_raw).state != "on" && id(state_sypialnia_lampa_raw).state != "off")) return lv_color_hex(0xFF3333);
            return id(state_sypialnia_lampa_raw).state == "on" ? lv_color_hex(0x00FF00) : lv_color_hex(0xFFFFFF);
      - lvgl.label.update:
          id: lbl_sypialnia_lampa_icon
          text: !lambda |-
            if (!id(state_sypialnia_lampa_raw).has_state() || (id(state_sypialnia_lampa_raw).state != "on" && id(state_sypialnia_lampa_raw).state != "off")) return std::string("\U000F0E4F");
            return id(state_sypialnia_lampa_raw).state == "on" ? std::string("\U000F06E8") : std::string("\U000F0336");
          text_color: !lambda |-
            if (!id(state_sypialnia_lampa_raw).has_state() || (id(state_sypialnia_lampa_raw).state != "on" && id(state_sypialnia_lampa_raw).state != "off")) return lv_color_hex(0xFF3333);
            return id(state_sypialnia_lampa_raw).state == "on" ? lv_color_hex(0x00FF00) : lv_color_hex(0x888888);
      - lvgl.label.update:
          id: lbl_erni_lampa
          text: !lambda |-
            if (!id(state_erni_lampa_raw).has_state() || (id(state_erni_lampa_raw).state != "on" && id(state_erni_lampa_raw).state != "off")) return std::string("Lampa: niedostępna");
            return id(state_erni_lampa_raw).state == "on" ? std::string("Lampa: WŁĄCZONA") : std::string("Lampa: wyłączona");
          text_color: !lambda |-
            if (!id(state_erni_lampa_raw).has_state() || (id(state_erni_lampa_raw).state != "on" && id(state_erni_lampa_raw).state != "off")) return lv_color_hex(0xFF3333);
            return id(state_erni_lampa_raw).state == "on" ? lv_color_hex(0x00FF00) : lv_color_hex(0xFFFFFF);
      - lvgl.label.update:
          id: lbl_erni_lampa_icon
          text: !lambda |-
            if (!id(state_erni_lampa_raw).has_state() || (id(state_erni_lampa_raw).state != "on" && id(state_erni_lampa_raw).state != "off")) return std::string("\U000F0E4F");
            return id(state_erni_lampa_raw).state == "on" ? std::string("\U000F06E8") : std::string("\U000F0336");
          text_color: !lambda |-
            if (!id(state_erni_lampa_raw).has_state() || (id(state_erni_lampa_raw).state != "on" && id(state_erni_lampa_raw).state != "off")) return lv_color_hex(0xFF3333);
            return id(state_erni_lampa_raw).state == "on" ? lv_color_hex(0x00FF00) : lv_color_hex(0x888888);
  - id: prepare_lamp_page
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_lampa_title
          text: !lambda |-
            if (id(lamp_selected) == "salon") return std::string("SALON");
            if (id(lamp_selected) == "studio") return std::string("SYPIALNIA");
            if (id(lamp_selected) == "adresowka") return std::string("ADRESÓWKA");
            if (id(lamp_selected) == "wejscie_schodki") return std::string("WEJŚCIE / SCHODKI");
            if (id(lamp_selected) == "outdoor_wjazd") return std::string("WJAZD");
            if (id(lamp_selected) == "outdoor_podworko") return std::string("PODWÓRKO");
            return std::string("ERNI");
      - lvgl.label.update:
          id: lbl_lampa_status
          text: !lambda |-
            std::string raw;
            if (id(lamp_selected) == "salon" && id(state_salon_lampka_raw).has_state()) raw = id(state_salon_lampka_raw).state;
            else if (id(lamp_selected) == "studio" && id(state_sypialnia_lampa_raw).has_state()) raw = id(state_sypialnia_lampa_raw).state;
            else if (id(lamp_selected) == "adresowka" && id(state_adresowka_lampa_raw).has_state()) raw = id(state_adresowka_lampa_raw).state;
            else if (id(lamp_selected) == "wejscie_schodki" && id(state_wejscie_schodki_lampa_raw).has_state()) raw = id(state_wejscie_schodki_lampa_raw).state;
            else if (id(lamp_selected) == "outdoor_wjazd" && id(state_outdoor_wjazd_raw).has_state()) raw = id(state_outdoor_wjazd_raw).state;
            else if (id(lamp_selected) == "outdoor_podworko" && id(state_outdoor_podworko_raw).has_state()) raw = id(state_outdoor_podworko_raw).state;
            else if (id(lamp_selected) == "erni" && id(state_erni_lampa_raw).has_state()) raw = id(state_erni_lampa_raw).state;
            if (raw == "on") return std::string("Lampa: WŁĄCZONA");
            if (raw == "off") return std::string("Lampa: wyłączona");
            return std::string("Lampa: niedostępna");
          text_color: !lambda |-
            std::string raw;
            if (id(lamp_selected) == "salon" && id(state_salon_lampka_raw).has_state()) raw = id(state_salon_lampka_raw).state;
            else if (id(lamp_selected) == "studio" && id(state_sypialnia_lampa_raw).has_state()) raw = id(state_sypialnia_lampa_raw).state;
            else if (id(lamp_selected) == "adresowka" && id(state_adresowka_lampa_raw).has_state()) raw = id(state_adresowka_lampa_raw).state;
            else if (id(lamp_selected) == "wejscie_schodki" && id(state_wejscie_schodki_lampa_raw).has_state()) raw = id(state_wejscie_schodki_lampa_raw).state;
            else if (id(lamp_selected) == "outdoor_wjazd" && id(state_outdoor_wjazd_raw).has_state()) raw = id(state_outdoor_wjazd_raw).state;
            else if (id(lamp_selected) == "outdoor_podworko" && id(state_outdoor_podworko_raw).has_state()) raw = id(state_outdoor_podworko_raw).state;
            else if (id(lamp_selected) == "erni" && id(state_erni_lampa_raw).has_state()) raw = id(state_erni_lampa_raw).state;
            if (raw == "on") return lv_color_hex(0x00FF00);
            if (raw == "off") return lv_color_hex(0xFFFFFF);
            return lv_color_hex(0xFF3333);
      - lvgl.label.update:
          id: lbl_lampa_icon
          text: !lambda |-
            std::string raw;
            if (id(lamp_selected) == "salon" && id(state_salon_lampka_raw).has_state()) raw = id(state_salon_lampka_raw).state;
            else if (id(lamp_selected) == "studio" && id(state_sypialnia_lampa_raw).has_state()) raw = id(state_sypialnia_lampa_raw).state;
            else if (id(lamp_selected) == "adresowka" && id(state_adresowka_lampa_raw).has_state()) raw = id(state_adresowka_lampa_raw).state;
            else if (id(lamp_selected) == "wejscie_schodki" && id(state_wejscie_schodki_lampa_raw).has_state()) raw = id(state_wejscie_schodki_lampa_raw).state;
            else if (id(lamp_selected) == "outdoor_wjazd" && id(state_outdoor_wjazd_raw).has_state()) raw = id(state_outdoor_wjazd_raw).state;
            else if (id(lamp_selected) == "outdoor_podworko" && id(state_outdoor_podworko_raw).has_state()) raw = id(state_outdoor_podworko_raw).state;
            else if (id(lamp_selected) == "erni" && id(state_erni_lampa_raw).has_state()) raw = id(state_erni_lampa_raw).state;
            if (raw == "on") return std::string("\U000F06E8");
            if (raw == "off") return std::string("\U000F0336");
            return std::string("\U000F0E4F");
          text_color: !lambda |-
            std::string raw;
            if (id(lamp_selected) == "salon" && id(state_salon_lampka_raw).has_state()) raw = id(state_salon_lampka_raw).state;
            else if (id(lamp_selected) == "studio" && id(state_sypialnia_lampa_raw).has_state()) raw = id(state_sypialnia_lampa_raw).state;
            else if (id(lamp_selected) == "adresowka" && id(state_adresowka_lampa_raw).has_state()) raw = id(state_adresowka_lampa_raw).state;
            else if (id(lamp_selected) == "wejscie_schodki" && id(state_wejscie_schodki_lampa_raw).has_state()) raw = id(state_wejscie_schodki_lampa_raw).state;
            else if (id(lamp_selected) == "outdoor_wjazd" && id(state_outdoor_wjazd_raw).has_state()) raw = id(state_outdoor_wjazd_raw).state;
            else if (id(lamp_selected) == "outdoor_podworko" && id(state_outdoor_podworko_raw).has_state()) raw = id(state_outdoor_podworko_raw).state;
            else if (id(lamp_selected) == "erni" && id(state_erni_lampa_raw).has_state()) raw = id(state_erni_lampa_raw).state;
            if (raw == "on") return lv_color_hex(0x00FF00);
            if (raw == "off") return lv_color_hex(0x888888);
            return lv_color_hex(0xFF3333);
      - lvgl.label.update:
          id: lbl_lampa_toggle
          text: !lambda |-
            std::string raw;
            if (id(lamp_selected) == "salon" && id(state_salon_lampka_raw).has_state()) raw = id(state_salon_lampka_raw).state;
            else if (id(lamp_selected) == "studio" && id(state_sypialnia_lampa_raw).has_state()) raw = id(state_sypialnia_lampa_raw).state;
            else if (id(lamp_selected) == "adresowka" && id(state_adresowka_lampa_raw).has_state()) raw = id(state_adresowka_lampa_raw).state;
            else if (id(lamp_selected) == "wejscie_schodki" && id(state_wejscie_schodki_lampa_raw).has_state()) raw = id(state_wejscie_schodki_lampa_raw).state;
            else if (id(lamp_selected) == "outdoor_wjazd" && id(state_outdoor_wjazd_raw).has_state()) raw = id(state_outdoor_wjazd_raw).state;
            else if (id(lamp_selected) == "outdoor_podworko" && id(state_outdoor_podworko_raw).has_state()) raw = id(state_outdoor_podworko_raw).state;
            else if (id(lamp_selected) == "erni" && id(state_erni_lampa_raw).has_state()) raw = id(state_erni_lampa_raw).state;
            if (raw == "on") return std::string("WYŁĄCZ LAMPĘ");
            if (raw == "off") return std::string("WŁĄCZ LAMPĘ");
            return std::string("BRAK POŁĄCZENIA");
      - lvgl.obj.update:
          id: obj_lampa_adjustments
          hidden: !lambda 'return id(lamp_selected) == "studio" || id(lamp_selected) == "outdoor_wjazd" || id(lamp_selected) == "outdoor_podworko";'
      - lvgl.obj.update:
          id: obj_lampa_colors
          hidden: !lambda 'return id(lamp_selected) != "salon";'
      - lvgl.obj.update:
          id: obj_lampa_scenes
          hidden: !lambda 'return id(lamp_selected) != "studio";'
      - lvgl.obj.update:
          id: obj_lampa_sos
          hidden: !lambda 'return id(lamp_selected) != "adresowka";'
      - lvgl.label.update:
          id: lbl_adresowka_sos
          text: !lambda |-
            if (!id(state_adresowka_sos_raw).has_state()) return std::string("SOS: BRAK STANU");
            if (id(state_adresowka_sos_raw).state == "on") return std::string("WYŁĄCZ SOS");
            if (id(state_adresowka_sos_raw).state == "off") return std::string("WŁĄCZ SOS");
            return std::string("SOS: BRAK STANU");
      - if:
          condition:
            lambda: 'return id(lamp_selected) == "salon" && std::isfinite(id(salon_brightness_attr).state);'
          then:
            - lvgl.slider.update:
                id: slider_lampa_brightness
                value: !lambda 'return (int)(id(salon_brightness_attr).state / 255.0 * 100.0);'
            - lvgl.label.update:
                id: lbl_lampa_brightness_val
                text: !lambda |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%d%%", (int)(id(salon_brightness_attr).state / 255.0 * 100.0));
                  return std::string(buf);
      - if:
          condition:
            lambda: 'return id(lamp_selected) == "erni" && std::isfinite(id(erni_brightness_attr).state);'
          then:
            - lvgl.slider.update:
                id: slider_lampa_brightness
                value: !lambda 'return (int)(id(erni_brightness_attr).state / 255.0 * 100.0);'
            - lvgl.label.update:
                id: lbl_lampa_brightness_val
                text: !lambda |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%d%%", (int)(id(erni_brightness_attr).state / 255.0 * 100.0));
                  return std::string(buf);
      # TEST 046: ustaw suwak z aktualnej jasności lampy Wejście / schodki.
      - if:
          condition:
            lambda: 'return id(lamp_selected) == "wejscie_schodki" && std::isfinite(id(wejscie_schodki_brightness_attr).state);'
          then:
            - lvgl.slider.update:
                id: slider_lampa_brightness
                value: !lambda 'return (int)(id(wejscie_schodki_brightness_attr).state / 255.0 * 100.0);'
            - lvgl.label.update:
                id: lbl_lampa_brightness_val
                text: !lambda |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%d%%", (int)(id(wejscie_schodki_brightness_attr).state / 255.0 * 100.0));
                  return std::string(buf);
      - if:
          condition:
            lambda: 'return id(lamp_selected) == "adresowka" && std::isfinite(id(adresowka_brightness_attr).state);'
          then:
            - lvgl.slider.update:
                id: slider_lampa_brightness
                value: !lambda 'return (int)(id(adresowka_brightness_attr).state / 255.0 * 100.0);'
            - lvgl.label.update:
                id: lbl_lampa_brightness_val
                text: !lambda |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%d%%", (int)(id(adresowka_brightness_attr).state / 255.0 * 100.0));
                  return std::string(buf);

  - id: confirm_click
    mode: restart
    then:
      - light.turn_on:
          id: status_led
          red: 0.0
          green: 1.0
          blue: 0.0
          brightness: 100%
      - lvgl.obj.update:
          id: lbl_arrow_up
          hidden: false
      - delay: 750ms
      - light.turn_off: status_led
      - lvgl.obj.update:
          id: lbl_arrow_up
          hidden: true

  # Wskaźnik odbioru: miga po aktualizacji dowolnej encji HA używanej przez Jarvisa.
  # Tryb restart utrzymuje strzałkę widoczną przez 750 ms od ostatniej aktualizacji.
  - id: ha_rx_flash
    mode: restart
    then:
      - lvgl.obj.update:
          id: lbl_arrow_down
          hidden: false
      - delay: 750ms
      - lvgl.obj.update:
          id: lbl_arrow_down
          hidden: true

  # --- Easter egg: 5x szybkie dotkniecie ikonki HA. Ekran mruga
  # czerwono-zlotem w rytm LED, potem pokazuje "reaktor" i napis. ---
  - id: easter_egg_ironman
    then:
      - globals.set:
          id: easter_active
          value: "true"
      - lvgl.obj.update:
          id: top_bar
          hidden: true
      - lvgl.page.show:
          id: page_ironman
          animation: NONE
      - repeat:
          count: 4
          then:
            - lvgl.page.update:
                id: page_ironman
                bg_color: 0xB22222
            - light.turn_on:
                id: status_led
                red: 1.0
                green: 0.15
                blue: 0.0
                transition_length: 0s
            - delay: 200ms
            - lvgl.page.update:
                id: page_ironman
                bg_color: 0x000000
            - light.turn_on:
                id: status_led
                red: 1.0
                green: 0.7
                blue: 0.0
                transition_length: 0s
            - delay: 200ms
      - lvgl.page.update:
          id: page_ironman
          bg_color: 0x000000
      - lvgl.obj.update:
          id: ironman_img
          hidden: false
      - lvgl.obj.update:
          id: lbl_ironman_text
          hidden: false
      - light.turn_off: status_led

  - id: exit_ironman
    then:
      - globals.set:
          id: easter_active
          value: "false"
      - lvgl.obj.update:
          id: ironman_img
          hidden: true
      - lvgl.obj.update:
          id: lbl_ironman_text
          hidden: true
      - lvgl.obj.update:
          id: top_bar
          hidden: false
      - component.update: ambient_light_raw
      - lvgl.page.show:
          id: page_pulpit
          animation: NONE
          time: 400ms

  # --- "Znajdz JARVIS" - wywolywane przyciskiem z Home Assistant.
  # Miga LED na losowe kolory i pokazuje bialy ekran, dopoki ktos nie
  # dotknie "ZNALEZIONE" na urzadzeniu. UWAGA: ta plytka nie ma
  # fizycznego buzzera, wiec dzwiek celowo pominiety. ---
  - id: identify_device
    then:
      - globals.set:
          id: identify_active
          value: "true"
      - light.turn_on:
          id: tft_backlight
          brightness: 100%
      - lvgl.obj.update:
          id: top_bar
          hidden: true
      - lvgl.page.show:
          id: page_identify
          animation: NONE
      - while:
          condition:
            lambda: 'return id(identify_active);'
          then:
            - light.turn_on:
                id: status_led
                red: !lambda 'return (random_uint32() % 256) / 255.0;'
                green: !lambda 'return (random_uint32() % 256) / 255.0;'
                blue: !lambda 'return (random_uint32() % 256) / 255.0;'
                brightness: 100%
                transition_length: 0s
            - delay: 200ms
      - light.turn_off:
          id: status_led
          transition_length: 0s
      - lvgl.obj.update:
          id: top_bar
          hidden: false
      - component.update: ambient_light_raw
      - lvgl.page.show:
          id: page_pulpit
          animation: NONE

