    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: screen_dimmed
    type: bool
    restore_value: false
    initial_value: "false"
  - id: screen_off
    type: bool
    restore_value: false
    initial_value: "false"
  - id: screen_was_asleep
    type: bool
    restore_value: false
    initial_value: "false"
  # Blokada akcji dla przeciągnięć i pierwszego dotyku wybudzającego.
  # Resetowana wyłącznie na początku kolejnego fizycznego gestu.
