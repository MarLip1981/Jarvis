# JARVIS 2.0 — SPRZĘT I PODSTAWOWE KOMPONENTY
# Moduł wydzielony mechanicznie z room-switcher-cyd (3).yaml.
# Na tym etapie zachowujemy istniejącą logikę i identyfikatory.

esp32:
  board: esp32dev
  framework:
    type: arduino

captive_portal:

logger:

ota:
  platform: esphome

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Warsaw
    on_time_sync:
      - lvgl.obj.update:
          id: lbl_arrow_down
          hidden: false
      - delay: 400ms
      - lvgl.obj.update:
          id: lbl_arrow_down
          hidden: true

# Lokalny odbiór okładek z cache Home Assistant.
http_request:
  timeout: 8s
  follow_redirects: true

# Obrazek Iron Man do easter egga - ESPHome pobiera go z GitHuba
# PRZY KOMPILACJI (nie trzeba trzymac zadnych danych lokalnie w YAML)
image:
  - platform: file
    file: "https://raw.githubusercontent.com/MarLip1981/Jarvis/main/Iron%20man%20Phone%20Wallpapers.jpeg"
    id: img_ironman
    type: RGB565
    resize: 240x360
  # Okładka radia pobierana dopiero po otrzymaniu lokalnego URL z HA.
  - platform: online_image
    id: img_radio_cover
    url: "http://192.168.1.100/local/atlascube-radio-covers-test/none.jpg"
    format: JPEG
    type: RGB565
    resize: 120x120
    update_interval: never
    buffer_size: 8192
    on_download_finished:
      then:
        - logger.log:
            level: INFO
            format: "JARVIS RADIO: okladka pobrana i zdekodowana poprawnie"
        - lvgl.widget.hide: obj_radio_cover_placeholder
        - lvgl.widget.show: img_radio_cover_widget
    on_error:
      then:
        - logger.log:
            level: ERROR
            format: "JARVIS RADIO: blad pobierania lub dekodowania okladki"
        - lvgl.widget.show: obj_radio_cover_placeholder
        - lvgl.widget.hide: img_radio_cover_widget
