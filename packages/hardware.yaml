# JARVIS 2.0 — SPRZĘT I PODSTAWOWE KOMPONENTY
# Moduł wydzielony mechanicznie z room-switcher-cyd (3).yaml.
# Na tym etapie zachowujemy istniejącą logikę i identyfikatory.

esp32:
  board: esp32dev
  framework:
    type: arduino

captive_portal:

logger:

ota:
  platform: esphome

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Warsaw
    on_time_sync:
      - lvgl.obj.update:
          id: lbl_arrow_down
          hidden: false
      - delay: 400ms
      - lvgl.obj.update:
          id: lbl_arrow_down
          hidden: true

