# JARVIS 2.0 — SPRZĘT I PODSTAWOWE KOMPONENTY
# Moduł wydzielony mechanicznie z room-switcher-cyd (3).yaml.
# Na tym etapie zachowujemy istniejącą logikę i identyfikatory.

esp32:
  board: esp32dev
  framework:
    type: arduino

captive_portal:

logger:

ota:
  platform: esphome

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Warsaw
    on_time_sync:
      - lvgl.obj.update:
          id: lbl_arrow_down
          hidden: false
      - delay: 400ms
      - lvgl.obj.update:
          id: lbl_arrow_down
          hidden: true

# Obrazek Iron Man do easter egga - ESPHome pobiera go z GitHuba
# PRZY KOMPILACJI (nie trzeba trzymac zadnych danych lokalnie w YAML)
image:
  - platform: file
    file: "https://raw.githubusercontent.com/MarLip1981/Jarvis/main/Iron%20man%20Phone%20Wallpapers.jpeg"
    id: img_ironman
    type: RGB565
    resize: 240x360

font:
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: icon_font_ha
    size: 22
    glyphs:
      - "\U000F07D0" # home-assistant

  # Male ikonki strzalek gora/dol w gornym pasku (zamiast ASCII ^/v)
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: icon_font_bar
    size: 26
    glyphs:
      - "\U000F0360" # strzalka w gore
      - "\U000F035D" # strzalka w dol

  # Ikonki na przyciskach: zarowka on/off, drzwi zamkniete/otwarte, piec
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: icon_font_btn
    size: 20
    glyphs:
      - "\U000F0335" # zarowka on
      - "\U000F0E50" # zarowka off
      - "\U000F081B" # drzwi zamkniete
      - "\U000F081C" # drzwi otwarte
      - "\U000F0238" # piec ogien
      - "\U000F040C" # play
      - "\U000F0666" # stop
      - "\U000F0663" # poprzednia stacja
      - "\U000F0661" # nastepna stacja
      - "\U000F057E" # glosnosc
      - "\U000F0425" # zasilanie wlacz/wylacz
      - "\U000F0020" # minutnik
      - "\U000F0299" # brama zamknieta
      - "\U000F116A" # brama otwarta
      - "\U000F0A48" # furtka

  # Duzy alien na ekran tytulowy JARVIS
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: icon_font_title
    size: 64
    glyphs:
      - "\U000F10CB" # alien

# ---------------------------------------------------------
# SPI: dzielony przez ekran (ST7796) i dotyk (XPT2046)
# ---------------------------------------------------------
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

# Podswietlenie sterowane jako PWM, zeby dalo sie przygasac
output:
  - platform: ledc
    pin: GPIO27
    id: backlight_pwm
  - platform: ledc
    pin:
      number: GPIO4
      inverted: true
    id: led_red
  - platform: ledc
    pin:
      number: GPIO17
      inverted: true
    id: led_green
  - platform: ledc
    pin:
      number: GPIO16
      inverted: true
    id: led_blue

light:
  - platform: monochromatic
    output: backlight_pwm
    id: tft_backlight
    name: "Podswietlenie ekranu"
    restore_mode: ALWAYS_ON
  - platform: rgb
    id: status_led
    name: "Dioda statusu"
    red: led_red
    green: led_green
    blue: led_blue

# Czujnik swiatla LDR -> auto-jasnosc podswietlenia

  - platform: ili9xxx
    model: ST7796
    id: my_display
    cs_pin: GPIO15
    dc_pin: GPIO2
    dimensions: 240x320
    invert_colors: false
    color_order: RGB
    transform:
      mirror_x: false
      mirror_y: false
    update_interval: never   # LVGL rysuje samo, gdy trzeba

touchscreen:
  platform: xpt2046
  id: my_touch
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  update_interval: 50ms
  calibration:
    x_min: 230
    x_max: 3860
    y_min: 220
    y_max: 3860
  transform:
    mirror_x: true
    mirror_y: false
    swap_xy: true
  on_touch:
    then:
      - globals.set:
          id: last_activity_ms
          value: !lambda 'return (esphome::millis)();'
      - if:
          condition:
            lambda: 'return id(screen_dimmed) || id(screen_off);'
          then:
            - globals.set:
                id: screen_was_asleep
                value: "true"
            - globals.set:
                id: screen_dimmed
                value: "false"
            - globals.set:
                id: screen_off
                value: "false"
            - component.update: ambient_light_raw
          else:
            - globals.set:
                id: screen_was_asleep
                value: "false"
