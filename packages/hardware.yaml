# ---------------------------------------------------------
# SPI: dzielony przez ekran (ST7796) i dotyk (XPT2046)
# ---------------------------------------------------------
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  # GPIO12 jest pinem startowym ESP32. W tym urządzeniu jest wymagany jako MISO
  # wspólnej magistrali SPI; ostrzeżenie wyciszamy świadomie, bez zmiany połączenia.
  miso_pin:
    number: GPIO12
    ignore_strapping_warning: true

# microSD w CYD: osobny zestaw pinow SDMMC w trybie 1-bit.
# Nie koliduje z magistrala SPI ekranu/dotyku (GPIO14/13/12).
# Formatowanie po bledzie montowania jest celowo wylaczone.
sd_mmc_card:
  id: sd_mmc_card
  mode_1bit: true
  format_if_mount_failed: false
  clk_pin: GPIO18
  cmd_pin: GPIO23
  data0_pin: GPIO19

text_sensor:
  - platform: sd_mmc_card
    sd_card_type:
      id: sd_card_type
      name: "Jarvis - typ karty SD"
      entity_category: diagnostic

sensor:
  - platform: sd_mmc_card
    type: free_space
    id: sd_free_space
    name: "Jarvis - wolne miejsce SD"
    entity_category: diagnostic

# Podswietlenie sterowane jako PWM, zeby dalo sie przygasac
output:
  - platform: ledc
    pin: GPIO27
    id: backlight_pwm
  - platform: ledc
    pin:
      number: GPIO4
      inverted: true
    id: led_red
  - platform: ledc
    pin:
      number: GPIO17
      inverted: true
    id: led_green
  - platform: ledc
    pin:
      number: GPIO16
      inverted: true
    id: led_blue

light:
  - platform: monochromatic
    output: backlight_pwm
    id: tft_backlight
    name: "Podświetlenie ekranu"
    restore_mode: ALWAYS_ON
  - platform: rgb
    id: status_led
    name: "Dioda statusu"
    red: led_red
    green: led_green
    blue: led_blue

# Czujnik swiatla LDR -> auto-jasnosc podswietlenia

display:
  - platform: ili9xxx
    model: ST7796
    id: my_display
    # GPIO15 i GPIO2 są pinami startowymi, ale są na stałe użyte przez sterownik TFT.
    # Zachowujemy oryginalne przypisanie; wyciszamy wyłącznie ostrzeżenia ESPHome.
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    dimensions: 240x320
    invert_colors: false
    color_order: RGB
    transform:
      mirror_x: false
      mirror_y: false
    update_interval: never   # LVGL rysuje samo, gdy trzeba

touchscreen:
  platform: xpt2046
  id: my_touch
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  update_interval: 50ms
  # IRQ wykrywa pierwszy kontakt, a touch_timeout wymusza kolejne odczyty
  # podczas trzymania palca. Dzięki temu on_update widzi przeciągnięcia.
  touch_timeout: 25ms
  calibration:
    x_min: 230
    x_max: 3860
    y_min: 220
    y_max: 3860
  transform:
    mirror_x: true
    mirror_y: false
    swap_xy: true
  on_touch:
    then:
      # Każdy nowy kontakt rozpoczyna osobny gest. Jeśli ekran był uśpiony,
      # ten pierwszy kontakt zostanie odrzucony jako wyłącznie wybudzający.
      - globals.set:
          id: touch_gesture_blocked
          value: "false"
      - globals.set:
          id: last_activity_ms
          value: !lambda 'return (esphome::millis)();'
      - if:
          condition:
            lambda: 'return id(screen_dimmed) || id(screen_off);'
          then:
            - globals.set:
                id: screen_was_asleep
                value: "true"
            - globals.set:
                id: touch_gesture_blocked
                value: "true"
            - globals.set:
                id: screen_dimmed
                value: "false"
            - globals.set:
                id: screen_off
                value: "false"
            - component.update: ambient_light_raw
          else:
            - globals.set:
                id: screen_was_asleep
                value: "false"
  # Śledzenie ruchu palca: on_touch startuje gest, on_update wykrywa
  # przeciągnięcie. Blokada pozostaje aktywna do następnego on_touch,
  # aby kolejność on_release/LVGL on_click nie mogła jej przedwcześnie skasować.
  on_update:
    then:
      - lambda: |-
          for (auto touch : touches) {
            if (touch.state == 2) {
              int dx = touch.x - touch.x_org;
              int dy = touch.y - touch.y_org;
              if (dx < 0) dx = -dx;
              if (dy < 0) dy = -dy;
              // 16 px odróżnia przeciągnięcie od lekkiego przesunięcia palca
              // podczas spokojnego, dłuższego kliknięcia.
              if (dx >= 16 || dy >= 16) {
                id(touch_gesture_blocked) = true;
              }
            }
          }
