esphome:
  # Jednorazowy test montowania, zapisu i odczytu microSD po starcie.
  # Nie formatuje karty i nie dotyka zasobow obrazu/okladek radia.
  on_boot:
    - priority: -100
      then:
        - if:
            condition:
              lambda: 'return !id(sd_mmc_card)->is_failed();'
            then:
              - sd_mmc_card.write_file:
                  id: sd_mmc_card
                  path: "/JARVIS_SD_TEST.TXT"
                  data: "JARVIS SD TEST OK"
              - lambda: |-
                  const auto data = id(sd_mmc_card)->read_file("/JARVIS_SD_TEST.TXT");
                  const std::string actual(data.begin(), data.end());
                  if (actual == "JARVIS SD TEST OK") {
                    ESP_LOGI("JARVIS SD", "TEST OK: karta zamontowana, zapis i odczyt dzialaja (%u B)",
                             static_cast<unsigned>(data.size()));
                  } else {
                    ESP_LOGE("JARVIS SD", "TEST BLAD: zapis/odczyt nie zgadza sie (odczytano %u B)",
                             static_cast<unsigned>(data.size()));
                  }
            else:
              - logger.log:
                  level: ERROR
                  tag: "JARVIS SD"
                  format: "TEST BLAD: karta SD nie zostala zamontowana"

# Obsluga karty microSD CYD (test na osobnej galezi).
external_components:
  - source:
      type: git
      url: https://github.com/n-serrette/esphome_sd_card
      ref: 889073e052275aeb9e826b697efe3bbbe09f935d
    components: [sd_mmc_card]

# JARVIS 2.0 — SPRZĘT I PODSTAWOWE KOMPONENTY
# Moduł wydzielony mechanicznie z room-switcher-cyd (3).yaml.
# Na tym etapie zachowujemy istniejącą logikę i identyfikatory.

esp32:
  board: esp32dev
  framework:
    type: arduino

captive_portal:

logger:

ota:
  platform: esphome

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Warsaw
    on_time_sync:
      - lvgl.obj.update:
          id: lbl_arrow_down
          hidden: false
      - delay: 400ms
      - lvgl.obj.update:
          id: lbl_arrow_down
          hidden: true

# Lokalny odbiór okładek z cache Home Assistant.
http_request:
  timeout: 8s
  follow_redirects: true

# Obrazek Iron Man do easter egga - ESPHome pobiera go z GitHuba
# PRZY KOMPILACJI (nie trzeba trzymac zadnych danych lokalnie w YAML)
image:
  - platform: file
    file: "https://raw.githubusercontent.com/MarLip1981/Jarvis/main/Iron%20man%20Phone%20Wallpapers.jpeg"
    id: img_ironman
    type: RGB565
    resize: 240x360
  # Okładka radia pobierana dopiero po otrzymaniu lokalnego URL z HA.
  - platform: online_image
    id: img_radio_cover
    url: "http://192.168.1.100/local/atlascube-radio-covers-test/none.jpg"
    format: JPEG
    type: RGB565
    resize: 120x120
    update_interval: never
    buffer_size: 8192
    # ESPHome 2026.11: JPEG jest dekodowany w trakcie pobierania.
    # Nowe zdarzenia pozwalaja odroznic brak odpowiedzi serwera od bledu dekodera.
    on_download_started:
      then:
        - logger.log:
            level: INFO
            format: "JARVIS RADIO: serwer rozpoczal wysylanie okladki"
    on_download_progress:
      then:
        - lambda: |-
            static int last_reported = -1;
            if (std::isfinite(progress)) {
              const int bucket = static_cast<int>(progress / 25.0f) * 25;
              if (bucket != last_reported || progress >= 100.0f) {
                ESP_LOGI("JARVIS RADIO", "Pobieranie okladki: %.0f%% (%u B)",
                         progress, static_cast<unsigned>(bytes_read));
                last_reported = bucket;
              }
            } else {
              ESP_LOGI("JARVIS RADIO", "Pobieranie okladki: %u B (serwer nie podal rozmiaru)",
                       static_cast<unsigned>(bytes_read));
            }
    on_download_finished:
      then:
        - logger.log:
            level: INFO
            format: "JARVIS RADIO: okladka pobrana i zdekodowana poprawnie"
        - lvgl.widget.hide: obj_radio_cover_placeholder
        - lvgl.widget.show: img_radio_cover_widget
    on_error:
      then:
        - logger.log:
            level: ERROR
            format: "JARVIS RADIO: blad pobierania lub dekodowania okladki"
        - lvgl.widget.show: obj_radio_cover_placeholder
        - lvgl.widget.hide: img_radio_cover_widget
