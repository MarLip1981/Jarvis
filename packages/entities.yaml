  - platform: homeassistant
    id: brama_ha_status
    entity_id: sensor.brama_przesuwna_bft_jarvis
    attribute: gate_status
    on_value:
      then:
        - script.execute: ha_rx_flash
        # Ruch wykryty bezposrednio z HA: karta bramy ma sie otworzyc
        # niezaleznie od tego, skad przyszlo polecenie (pilot, HA lub Jarvis).
        - if:
            condition:
              lambda: |-
                return x.find("Otwieranie") != std::string::npos ||
                       x.find("Zamykanie") != std::string::npos ||
                       x.find("Furtka") != std::string::npos;
            then:
              - if:
                  condition:
                    lambda: 'return !id(brama_page_active);'
                  then:
                    - globals.set:
                        id: brama_page_active
                        value: "true"
                    - globals.set:
                        id: brama_waiting_for_motion
                        value: "false"
                    - globals.set:
                        id: brama_closed_since_ms
                        value: "0"
                    - lvgl.page.show:
                        id: page_brama
                        animation: MOVE_LEFT
                        time: 300ms
        - lvgl.label.update:
            id: lbl_brama_status
            text: !lambda 'return std::string("Stan: ") + x;'
            text_color: !lambda |-
              if (x == "Otwarta" || x == "Zatrzymanie Awaryjne!") return lv_color_hex(0xFF3333);
              if (x.find("Otwieranie") != std::string::npos ||
                  x.find("Zamykanie") != std::string::npos ||
                  x.find("Furtka") != std::string::npos) return lv_color_hex(0xFFAA00);
              if (x.rfind("Zamknięta", 0) == 0 || x.rfind("Zamknieta", 0) == 0) return lv_color_hex(0x00FF00);
              return lv_color_hex(0x888888);
        - lvgl.label.update:
            id: lbl_brama_main_button
            text: !lambda |-
              if (x.find("Otwieranie") != std::string::npos || x.find("Zamykanie") != std::string::npos)
                return std::string("STOP");
              if (x == "Otwarta") return std::string("ZAMKNIJ");
              if (x.rfind("Zamknięta", 0) == 0 || x.rfind("Zamknieta", 0) == 0)
                return std::string("OTWÓRZ");
              return std::string("STERUJ");
        - lvgl.label.update:
            id: lbl_brama_aux_button
            text: !lambda |-
              if (!id(brama_pedestrian_enabled).state) {
                if (id(brama_entrance_lighting_state).has_state() && id(brama_entrance_lighting_state).state == "on")
                  return std::string("OŚWIETLENIE WŁ.");
                return std::string("OŚWIETLENIE WYŁ.");
              }
              return x == "Otwarta" ? std::string("FURTKA ZAMKNIJ") : std::string("FURTKA OTWÓRZ");
        - lvgl.label.update:
            id: lbl_pulpit_brama_status
            text: !lambda |-
              if (x == "Otwarta") return std::string("otwarta");
              if (x == "Zatrzymanie Awaryjne!") return std::string("awaria");
              if (x.find("Otwieranie") != std::string::npos ||
                  x.find("Zamykanie") != std::string::npos ||
                  x.find("Furtka") != std::string::npos) {
                if (id(brama_ha_position).has_state() && std::isfinite(id(brama_ha_position).state)) {
                  char buf[32];
                  snprintf(buf, sizeof(buf), "%s %.0f%%",
                    x.find("Zamykanie") != std::string::npos ? "zamykanie" : "otwieranie",
                    id(brama_ha_position).state);
                  return std::string(buf);
                }
                return std::string("w ruchu");
              }
              if (x.rfind("Zamknięta", 0) == 0 || x.rfind("Zamknieta", 0) == 0) return std::string("zamknięta");
              return std::string("--");
            text_color: !lambda |-
              if (x == "Otwarta" || x == "Zatrzymanie Awaryjne!") return lv_color_hex(0xFF3333);
              if (x.find("Otwieranie") != std::string::npos ||
                  x.find("Zamykanie") != std::string::npos ||
                  x.find("Furtka") != std::string::npos) return lv_color_hex(0xFFAA00);
              if (x.rfind("Zamknięta", 0) == 0 || x.rfind("Zamknieta", 0) == 0) return lv_color_hex(0x00FF00);
              return lv_color_hex(0x888888);
        - lvgl.label.update:
            id: lbl_pulpit_brama_icon
            text: !lambda |-
              const bool closed = x.rfind("Zamknięta", 0) == 0 || x.rfind("Zamknieta", 0) == 0;
              return closed ? std::string("\U000F0299") : std::string("\U000F116A");
            text_color: !lambda |-
              if (x.rfind("Zamknięta", 0) == 0 || x.rfind("Zamknieta", 0) == 0) return lv_color_hex(0x888888);
              if (x == "Otwarta" || x == "Zatrzymanie Awaryjne!") return lv_color_hex(0xFF3333);
              if (x.find("Otwieranie") != std::string::npos ||
                  x.find("Zamykanie") != std::string::npos ||
                  x.find("Furtka") != std::string::npos) return lv_color_hex(0xFFAA00);
              return lv_color_hex(0x888888);
        - globals.set:
            id: brama_closed_since_ms
            value: !lambda |-
              const bool closed = (x.rfind("Zamknięta", 0) == 0 || x.rfind("Zamknieta", 0) == 0);
              if (!closed) {
                if (x != "unknown" && x != "unavailable" && !x.empty()) id(brama_waiting_for_motion) = false;
                return 0;
              }
              if (id(brama_page_active) && !id(brama_waiting_for_motion) && id(brama_closed_since_ms) == 0)
                return (esphome::millis)();
              return id(brama_closed_since_ms);
