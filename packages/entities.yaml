        - lvgl.label.update:
            id: lbl_erni_lampa
            text: !lambda |-
              return x ? std::string("Lampa: WŁĄCZONA") : std::string("Lampa: wyłączona");
            text_color: !lambda 'return x ? lv_color_hex(0x00FF00) : lv_color_hex(0xFF0000);'
        - lvgl.label.update:
            id: lbl_erni_lampa_icon
            text: !lambda |-
              return x ? std::string("\U000F0335") : std::string("\U000F0E50");
            text_color: !lambda 'return x ? lv_color_hex(0x00FF00) : lv_color_hex(0x888888);'


  - platform: homeassistant
    id: state_sypialnia_lampa
    entity_id: light.studio
    on_state:
      then:
        - script.execute: ha_rx_flash
        - lvgl.obj.update:
            id: btn_lampy_sypialnia
            hidden: !lambda 'return !x;'
        - lvgl.label.update:
            id: lbl_sypialnia_lampa
            text: !lambda |-
              return x ? std::string("Lampa: WŁĄCZONA") : std::string("Lampa: wyłączona");
            text_color: !lambda 'return x ? lv_color_hex(0x00FF00) : lv_color_hex(0xFF0000);'
        - lvgl.label.update:
            id: lbl_sypialnia_lampa_icon
            text: !lambda |-
              return x ? std::string("\U000F0335") : std::string("\U000F0E50");
            text_color: !lambda 'return x ? lv_color_hex(0x00FF00) : lv_color_hex(0x888888);'


  - platform: homeassistant
    id: state_drzwi
    entity_id: binary_sensor.intelignty_czujnik_otwarcia_melink_drzwi
    on_state:
      then:
        - script.execute: ha_rx_flash

        - if:
            condition:
              lambda: 'return x;'
            then:
              # Drzwi wlasnie sie otworzyly - zapamietujemy moment
              - globals.set:
                  id: door_open_since_ms
                  value: !lambda 'return (esphome::millis)();'
        # Sam tekst na ekranie NIE jest ustawiany tutaj - w interval
        # 1s nizej jest jedno miejsce, ktore co sekunde odswieza tekst
        # na podstawie AKTUALNEGO stanu (dokladnie tak jak licznik lamp),
        # zamiast polegac wylacznie na zlapaniu tego zdarzenia.

text_sensor:
  - platform: homeassistant
    id: radio_stacja
    entity_id: sensor.atlascube_radio_stacja_radiowa
    on_value:
      then:
        - script.execute: ha_rx_flash
        - lvgl.label.update:
            id: lbl_radio_stacja
            text: !lambda 'return x;'
        - lvgl.label.update:
            id: lbl_pulpit_radio
            text: !lambda |-
              if (!id(radio_is_playing)) return std::string("Radio:   nie gra");
              std::string station = x;
              std::string track = id(radio_tytul).state;
              if (station.empty()) station = "--";
              if (track.empty()) track = "--";
              return std::string("Radio:   ") + station + "  * " + track;

  - platform: homeassistant
    id: radio_tytul
    entity_id: sensor.atlascube_radio_tytul_utworu
    on_value:
      then:
        - script.execute: ha_rx_flash
        - lvgl.label.update:
            id: lbl_radio_tytul
            text: !lambda 'return x;'
        - lvgl.label.update:
            id: lbl_pulpit_radio
            text: !lambda |-
              if (!id(radio_is_playing)) return std::string("Radio:   nie gra");
              std::string station = id(radio_stacja).state;
              std::string track = x;
              if (station.empty()) station = "--";
              if (track.empty()) track = "--";
              return std::string("Radio:   ") + station + "  * " + track;

  # Mały URL 200x200 z encji AtlasCube TEST 0.5.8 (stan encji; duży wariant pozostaje po stronie HA).
  - platform: homeassistant
    id: radio_cover_url
    entity_id: sensor.atlascube_radio_cover_url_test
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x.rfind("/local/atlascube-radio-covers-test/", 0) != 0;'
            then:
              - online_image.release: img_radio_cover
              - lvgl.widget.hide: img_radio_cover_widget
              - lvgl.widget.show: obj_radio_cover_placeholder
            else:
              - logger.log:
                  level: INFO
                  format: "JARVIS RADIO: otrzymano lokalny adres okladki z Home Assistant"
              - lvgl.widget.show: obj_radio_cover_placeholder
              - lvgl.widget.hide: img_radio_cover_widget
              - online_image.set_url:
                  id: img_radio_cover
                  update: true
                  url: !lambda |-
                    return std::string("http://192.168.1.100:8123") + x;

  - platform: homeassistant
    id: radio_stan
    entity_id: sensor.atlascube_9140_playback
    on_value:
      then:
        - script.execute: ha_rx_flash
        # Sensor Atlascube zwraca "playing" podczas odtwarzania; pozostale stany
        # traktujemy jako zatrzymane radio.
        - globals.set:
            id: radio_is_playing
            value: !lambda 'return (x == "playing");'
        - lvgl.label.update:
            id: lbl_radio_playstop_icon
            text: !lambda |-
              return (x == "playing") ? std::string("\U000F0666") : std::string("\U000F040C");
        - lvgl.label.update:
            id: lbl_pulpit_radio_icon
            text_color: !lambda |-
              return (x == "playing") ? lv_color_hex(0x00FF00) : lv_color_hex(0x888888);
        - lvgl.label.update:
            id: lbl_pulpit_radio
            text: !lambda |-
              if (x != "playing") return std::string("Radio:   nie gra");
              std::string station = id(radio_stacja).state;
              std::string track = id(radio_tytul).state;
              if (station.empty()) station = "--";
              if (track.empty()) track = "--";
              return std::string("Radio:   ") + station + "  * " + track;

