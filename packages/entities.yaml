  - platform: homeassistant
    id: state_drzwi
    entity_id: binary_sensor.intelignty_czujnik_otwarcia_melink_drzwi
    on_state:
      then:
        - script.execute: ha_rx_flash

        - if:
            condition:
              lambda: 'return x;'
            then:
              # Drzwi wlasnie sie otworzyly - zapamietujemy moment
              - globals.set:
                  id: door_open_since_ms
                  value: !lambda 'return (esphome::millis)();'
        # Sam tekst na ekranie NIE jest ustawiany tutaj - w interval
        # 1s nizej jest jedno miejsce, ktore co sekunde odswieza tekst
        # na podstawie AKTUALNEGO stanu (dokladnie tak jak licznik lamp),
        # zamiast polegac wylacznie na zlapaniu tego zdarzenia.

text_sensor:
  - platform: homeassistant
    id: radio_stacja
    entity_id: sensor.atlascube_radio_stacja_radiowa
    on_value:
      then:
        - script.execute: ha_rx_flash
        - lvgl.label.update:
            id: lbl_radio_stacja
            text: !lambda 'return std::string("Stacja: ") + x;'
        - lvgl.label.update:
            id: lbl_pulpit_radio
            text: !lambda |-
              auto ascii = [](std::string value) {
                const std::pair<const char*, const char*> repl[] = {
                  {"\xC4\x85","a"},{"\xC4\x84","A"},{"\xC4\x87","c"},{"\xC4\x86","C"},
                  {"\xC4\x99","e"},{"\xC4\x98","E"},{"\xC5\x82","l"},{"\xC5\x81","L"},
                  {"\xC5\x84","n"},{"\xC5\x83","N"},{"\xC3\xB3","o"},{"\xC3\x93","O"},
                  {"\xC5\x9B","s"},{"\xC5\x9A","S"},{"\xC5\xBA","z"},{"\xC5\xB9","Z"},
                  {"\xC5\xBC","z"},{"\xC5\xBB","Z"}
                };
                for (const auto &item : repl) {
                  size_t pos = 0;
                  while ((pos = value.find(item.first, pos)) != std::string::npos) {
                    value.replace(pos, std::string(item.first).size(), item.second);
                    pos += std::string(item.second).size();
                  }
                }
                return value;
              };
              std::string station = ascii(x);
              std::string track = ascii(id(radio_tytul).state);
              if (station.empty()) station = "--";
              if (track.empty()) track = "--";
              return std::string("RADIO > ") + station + "  * " + track;

  - platform: homeassistant
    id: radio_tytul
    entity_id: sensor.atlascube_radio_tytul_utworu
    on_value:
      then:
        - script.execute: ha_rx_flash
        - lvgl.label.update:
            id: lbl_radio_tytul
            text: !lambda 'return std::string("Utwor: ") + x;'
        - lvgl.label.update:
            id: lbl_pulpit_radio
            text: !lambda |-
              auto ascii = [](std::string value) {
                const std::pair<const char*, const char*> repl[] = {
                  {"\xC4\x85","a"},{"\xC4\x84","A"},{"\xC4\x87","c"},{"\xC4\x86","C"},
                  {"\xC4\x99","e"},{"\xC4\x98","E"},{"\xC5\x82","l"},{"\xC5\x81","L"},
                  {"\xC5\x84","n"},{"\xC5\x83","N"},{"\xC3\xB3","o"},{"\xC3\x93","O"},
                  {"\xC5\x9B","s"},{"\xC5\x9A","S"},{"\xC5\xBA","z"},{"\xC5\xB9","Z"},
                  {"\xC5\xBC","z"},{"\xC5\xBB","Z"}
                };
                for (const auto &item : repl) {
                  size_t pos = 0;
                  while ((pos = value.find(item.first, pos)) != std::string::npos) {
                    value.replace(pos, std::string(item.first).size(), item.second);
                    pos += std::string(item.second).size();
                  }
                }
                return value;
              };
              std::string station = ascii(id(radio_stacja).state);
              std::string track = ascii(x);
              if (station.empty()) station = "--";
              if (track.empty()) track = "--";
              return std::string("RADIO > ") + station + "  * " + track;

  - platform: homeassistant
    id: radio_stan
    entity_id: sensor.atlascube_9140_playback
    on_value:
      then:
        - script.execute: ha_rx_flash
        - lvgl.label.update:
            id: lbl_radio_stan
            text: !lambda |-
              return std::string("Stan: #00FF00 ") + x + std::string("#");
        # UWAGA: "playing" to zalozenie do zweryfikowania - podmien na
        # rzeczywista wartosc jaka realnie przyjmuje ten sensor w HA,
        # jesli ikonka play/stop nie przelacza sie poprawnie.
        - globals.set:
            id: radio_is_playing
            value: !lambda 'return (x == "playing");'
        - lvgl.label.update:
            id: lbl_radio_playstop_icon
            text: !lambda |-
              return (x == "playing") ? std::string("\U000F0666") : std::string("\U000F040C");

