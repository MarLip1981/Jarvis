                  ? std::string("#00FF00 CZUWA#")
                  : std::string("#888888 --");

  - platform: homeassistant
    id: piec_hvac_mode
    entity_id: climate.dom_zone_ogrzewanie_circuit_0_climate
    on_value:
      then:
        - script.execute: ha_rx_flash
