  - platform: homeassistant
    id: brama_ha_status
    entity_id: sensor.brama_przesuwna_bft_jarvis
    attribute: gate_status
    on_value:
      then:
        - script.execute: ha_rx_flash
        # Zapamiętaj ustawienia podświetlenia przed wymuszeniem 100% na cykl bramy.
        - if:
            condition:
              lambda: 'return x.rfind("Zamknięta", 0) != 0 && x.rfind("Zamknieta", 0) != 0 && x != "unknown" && x != "unavailable" && !x.empty();'
            then:
              - if:
                  condition:
                    lambda: 'return !id(brama_backlight_override);'
                  then:
                    - globals.set:
                        id: brama_backlight_original_on
                        value: !lambda 'return id(tft_backlight).current_values.is_on();'
                    - globals.set:
                        id: brama_backlight_original_brightness
                        value: !lambda 'return id(tft_backlight).current_values.get_brightness();'
                    - globals.set:
                        id: brama_backlight_override
                        value: "true"
              - globals.set:
                  id: brama_closed_flash_ms
                  value: "0"
              - light.turn_on:
                  id: tft_backlight
                  brightness: 100%
        - if:
            condition:
              lambda: 'return x.rfind("Zamknięta", 0) == 0 || x.rfind("Zamknieta", 0) == 0;'
            then:
              - globals.set:
                  id: brama_closed_flash_ms
                  value: !lambda 'return (esphome::millis)();'
        # Ruch wykryty bezposrednio z HA: karta bramy ma sie otworzyc
        # niezaleznie od tego, skad przyszlo polecenie (pilot, HA lub Jarvis).
        - if:
            condition:
              lambda: |-
                return x.find("Otwieranie") != std::string::npos ||
                       x.find("Zamykanie") != std::string::npos ||
                       x.find("Furtka") != std::string::npos;
            then:
              - if:
                  condition:
                    lambda: 'return !id(brama_page_active);'
                  then:
                    - globals.set:
                        id: brama_page_active
                        value: "true"
                    - globals.set:
                        id: brama_waiting_for_motion
                        value: "false"
                    - globals.set:
                        id: brama_closed_since_ms
                        value: "0"
                    - lvgl.page.show:
                        id: page_brama
                        animation: NONE
                        time: 300ms
        - lambda: |-
            const bool opened = x.find("Otwarta") != std::string::npos;
            const bool emergency = x == "Zatrzymanie Awaryjne!";
            const bool opening = x.find("Otwieranie") != std::string::npos;
            const bool closing = x.find("Zamykanie") != std::string::npos;
            const bool wicket = x.find("Furtka") != std::string::npos;
            const bool closed = x.rfind("Zamknięta", 0) == 0 || x.rfind("Zamknieta", 0) == 0;
            const bool moving = opening || closing || wicket;
            const lv_color_t status_color = opened || emergency ? lv_color_hex(0xFF3333) :
              moving ? lv_color_hex(0xFFAA00) : closed ? lv_color_hex(0x00FF00) : lv_color_hex(0x888888);
            static char gate_status_buf[160];
            snprintf(gate_status_buf, sizeof(gate_status_buf), "%s", x.c_str());
            lv_label_set_text_static(id(lbl_brama_status_value), gate_status_buf);
            lv_obj_set_style_text_color(id(lbl_brama_status_value), status_color, 0);

            const char *main_button = (opening || closing) ? "STOP" : opened ? "ZAMKNIJ" : "BRAMA";
            lv_label_set_text_static(id(lbl_brama_main_button), main_button);
            lv_obj_set_width(id(btn_brama_karta_main), opened ? 216 : 104);
            const bool lighting = id(brama_lighting_enabled).has_state() && id(brama_lighting_enabled).state == "true";
            if (opened || (!id(brama_pedestrian_enabled).state && !lighting)) lv_obj_add_flag(id(btn_brama_karta_pedestrian), LV_OBJ_FLAG_HIDDEN);
            else lv_obj_clear_flag(id(btn_brama_karta_pedestrian), LV_OBJ_FLAG_HIDDEN);

            static char gate_dashboard_buf[40];
            if (x == "Otwarta") snprintf(gate_dashboard_buf, sizeof(gate_dashboard_buf), "otwarta");
            else if (emergency) snprintf(gate_dashboard_buf, sizeof(gate_dashboard_buf), "awaria");
            else if (moving) {
              if (id(brama_ha_position).has_state() && std::isfinite(id(brama_ha_position).state)) {
                snprintf(gate_dashboard_buf, sizeof(gate_dashboard_buf), "%s %.0f%%",
                  closing ? "zamykanie" : "otwieranie", id(brama_ha_position).state);
              } else snprintf(gate_dashboard_buf, sizeof(gate_dashboard_buf), "w ruchu");
            } else if (closed) snprintf(gate_dashboard_buf, sizeof(gate_dashboard_buf), "zamknięta");
            else snprintf(gate_dashboard_buf, sizeof(gate_dashboard_buf), "--");
            lv_label_set_text_static(id(lbl_pulpit_brama_status), gate_dashboard_buf);
            lv_obj_set_style_text_color(id(lbl_pulpit_brama_status), status_color, 0);

            const char *gate_icon = closed ? "\U000F0299" : "\U000F116A";
            const lv_color_t icon_color = closed ? lv_color_hex(0x888888) : status_color;
            lv_label_set_text_static(id(lbl_pulpit_brama_icon), gate_icon);
            lv_obj_set_style_text_color(id(lbl_pulpit_brama_icon), icon_color, 0);
        - globals.set:
            id: brama_closed_since_ms
            value: !lambda |-
              const bool closed = (x.rfind("Zamknięta", 0) == 0 || x.rfind("Zamknieta", 0) == 0);
              if (!closed) {
                if (x != "unknown" && x != "unavailable" && !x.empty()) id(brama_waiting_for_motion) = false;
                return 0;
              }
              if (id(brama_page_active) && !id(brama_waiting_for_motion) && id(brama_closed_since_ms) == 0)
                return (esphome::millis)();
              return id(brama_closed_since_ms);
