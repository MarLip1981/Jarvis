  - platform: internal_temperature
    id: cpu_temp_sensor
    name: "Temperatura CPU"
  - platform: adc
    pin: GPIO34
    id: ambient_light_raw
    name: "Czujnik światła (surowy)"
    update_interval: 5s
    attenuation: 12db
    filters:
      - lambda: |-
          // odwracamy i skalujemy orientacyjnie do 0.1 - 1.0
          float v = 1.0 - x;
          if (v < 0.1) v = 0.1;
          if (v > 1.0) v = 1.0;
          return v;
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(screen_dimmed) && !id(screen_off);'
            then:
              - light.turn_on:
                  id: tft_backlight
                  brightness: !lambda "return x;"
                  transition_length: 500ms

  # Pomiar baterii 1S (jedno ogniwo lub dwa ogniwa 18650 rownolegle).
  # Dzielnik: BAT+ -- 100k -- GPIO35 -- 33k -- GND.
  # Przy 4.2 V na baterii ADC widzi ok. 1.04 V. GPIO35 nalezy do ADC1.
  - platform: adc
    pin: GPIO35
    id: battery_voltage
    name: "Napięcie baterii Jarvis"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    attenuation: 12db
    filters:
      - multiply: 4.0303
  # Procent jest orientacyjnym oszacowaniem dla ogniwa Li-Ion 1S.
  # Napiecie mocno zalezy od obciazenia i temperatury; nie zastapi BMS.
  - platform: template
    id: battery_percent
    name: "Poziom baterii Jarvis"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      const float v = id(battery_voltage).state;
      if (!std::isfinite(v) || v < 2.5f || v > 4.35f) return NAN;
      if (v >= 4.20f) return 100.0f;
      if (v >= 4.10f) return 90.0f + (v - 4.10f) * 100.0f;
      if (v >= 4.00f) return 80.0f + (v - 4.00f) * 100.0f;
      if (v >= 3.90f) return 60.0f + (v - 3.90f) * 200.0f;
      if (v >= 3.80f) return 40.0f + (v - 3.80f) * 200.0f;
      if (v >= 3.70f) return 20.0f + (v - 3.70f) * 200.0f;
      if (v >= 3.60f) return 10.0f + (v - 3.60f) * 100.0f;
      if (v >= 3.50f) return 5.0f + (v - 3.50f) * 50.0f;
      if (v >= 3.30f) return (v - 3.30f) * 25.0f;
      return 0.0f;
  - platform: homeassistant
    id: brama_ha_position
    entity_id: sensor.brama_przesuwna_bft_jarvis
    attribute: gate_position
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return std::isfinite(x);'
            then:
              - globals.set:
                  id: brama_position_start
                  value: !lambda 'return id(brama_position_visual);'
              - globals.set:
                  id: brama_position_target
                  value: !lambda |-
                    float position = x;
                    if (position < 0.0f) position = 0.0f;
                    if (position > 100.0f) position = 100.0f;
                    return position;
              - globals.set:
                  id: brama_position_started_ms
                  value: !lambda 'return (esphome::millis)();'
              - lvgl.label.update:
                  id: lbl_brama_position
                  text: !lambda |-
                    char buf[24];
                    snprintf(buf, sizeof(buf), "Pozycja: %.0f%%", x);
                    return std::string(buf);
              - if:
                  condition:
                    lambda: |-
                      return id(brama_ha_status).has_state() &&
                        (id(brama_ha_status).state.find("Otwieranie") != std::string::npos ||
                         id(brama_ha_status).state.find("Zamykanie") != std::string::npos ||
                         id(brama_ha_status).state.find("Furtka") != std::string::npos);
                  then:
                    - lvgl.label.update:
                        id: lbl_pulpit_brama_status
                        text: !lambda |-
                          char buf[32];
                          const std::string status = id(brama_ha_status).state;
                          snprintf(buf, sizeof(buf), "%s %.0f%%",
                            status.find("Zamykanie") != std::string::npos ? "zamykanie" : "otwieranie",
                            x);
                          return std::string(buf);
                        text_color: !lambda 'return lv_color_hex(0xFFAA00);'

  - platform: wifi_signal
    id: wifi_db
    name: "Sygnał Wi-Fi"
    update_interval: 15s
    on_value:
      then:
        - lvgl.obj.update:
            id: wifi_bar1
            bg_color: !lambda 'return x >= -85 ? lv_color_hex(0x00FF00) : lv_color_hex(0x555555);'
        - lvgl.obj.update:
            id: wifi_bar2
            bg_color: !lambda 'return x >= -75 ? lv_color_hex(0x00FF00) : lv_color_hex(0x555555);'
        - lvgl.obj.update:
            id: wifi_bar3
            bg_color: !lambda 'return x >= -65 ? lv_color_hex(0x00FF00) : lv_color_hex(0x555555);'
        - lvgl.obj.update:
            id: wifi_bar4
            bg_color: !lambda 'return x >= -55 ? lv_color_hex(0x00FF00) : lv_color_hex(0x555555);'

  # Pomiar baterii 1S jest realizowany przez dzielnik na GPIO35.

# Status polaczenia z HA (API) - do ikonki HA w gornym pasku
binary_sensor:
  - platform: homeassistant
    id: brama_pedestrian_enabled
    entity_id: binary_sensor.brama_przesuwna_bft_tryb_furtki
    on_state:
      then:
        - lvgl.obj.update:
            id: btn_pulpit_furtka
            hidden: !lambda 'return !x;'
        - lvgl.obj.update:
            id: btn_brama_karta_pedestrian
            hidden: !lambda 'return !x && (!id(brama_lighting_enabled).has_state() || id(brama_lighting_enabled).state != "true");'
        - lvgl.label.update:
            id: lbl_brama_aux_button
            text: !lambda |-
              if (x) return std::string("FURTKA");
              return std::string("OŚWIETLENIE");
  - platform: homeassistant
    id: brama_photocell
    entity_id: binary_sensor.wjazd_brama_wjazdowa_fotokomorka_przeszkoda
    on_state:
      then:
        - lvgl.obj.update:
            id: lbl_brama_warning
            hidden: !lambda 'return !x && (!id(brama_manual_lock_state).has_state() || id(brama_manual_lock_state).state != "on");'
        - lvgl.label.update:
            id: lbl_brama_warning
            text: !lambda |-
              const bool lock = id(brama_manual_lock_state).has_state() && id(brama_manual_lock_state).state == "on";
              return lock ? (x ? std::string("FOTOKOMÓRKA + BLOKADA") : std::string("BLOKADA ZAMKNIĘCIA")) : std::string("UWAGA: FOTOKOMÓRKA");
            text_color: !lambda |-
              return (id(brama_manual_lock_state).has_state() && id(brama_manual_lock_state).state == "on")
                ? lv_color_hex(0xFF3333) : lv_color_hex(0xFFCC00);
        - lvgl.obj.update:
            id: lbl_brama_warning_icon
            hidden: !lambda 'return !x && (!id(brama_manual_lock_state).has_state() || id(brama_manual_lock_state).state != "on");'
        - lvgl.label.update:
            id: lbl_brama_warning_icon
            text_color: !lambda |-
              return (id(brama_manual_lock_state).has_state() && id(brama_manual_lock_state).state == "on")
                ? lv_color_hex(0xFF3333) : lv_color_hex(0xFFCC00);
  - platform: homeassistant
    id: state_salon_lampka
    entity_id: light.salon_lampka
    on_state:
      then:
        - script.execute: ha_rx_flash
        - lvgl.obj.update:
            id: btn_lampy_salon
            hidden: !lambda 'return !x;'
        - lvgl.label.update:
            id: lbl_salon_lampka_status
            text: !lambda |-
              return x ? std::string("Stan: #00FF00 WŁĄCZONA#") : std::string("Stan: #FF0000 wyłączona#");
        - lvgl.label.update:
            id: lbl_salon_glowna_icon
            text: !lambda |-
              return x ? std::string("\U000F0335") : std::string("\U000F0E50");
            text_color: !lambda 'return x ? lv_color_hex(0x00FF00) : lv_color_hex(0xFF0000);'


  - platform: gpio
    # GPIO0 jest pinem BOOT ESP32. Przycisk działa jako zwykłe wejście po starcie,
    # ale jego przytrzymanie podczas resetu może uruchomić tryb bootloadera.
    # Wyciszamy ostrzeżenie, nie zmieniając działania przycisku.
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
      ignore_strapping_warning: true
    id: sw1_button
    name: "Przycisk SW1"
    internal: true
    filters:
      - delayed_on: 20ms
    on_press:
      - globals.set:
          id: last_activity_ms
          value: !lambda 'return (esphome::millis)();'
      - if:
          condition:
            lambda: 'return id(screen_dimmed) || id(screen_off);'
          then:
            - globals.set:
                id: screen_dimmed
                value: "false"
            - globals.set:
                id: screen_off
                value: "false"
            - component.update: ambient_light_raw

  - platform: status
    id: node_status
    name: "Status połączenia"
    on_state:
      then:
        - lvgl.label.update:
            id: lbl_ha
            text_color: !lambda 'return x ? lv_color_hex(0x00FF00) : lv_color_hex(0xFF0000);'

