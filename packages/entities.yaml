    on_value:
      then:
        - script.execute: ha_rx_flash
        - lvgl.label.update:
            id: lbl_scena_studio
            text: !lambda 'return x;'


  - platform: homeassistant
    id: state_piec
    entity_id: sensor.dom_circuit_0_state
    on_value:
      then:
        - script.execute: ha_rx_flash
        - lvgl.label.update:
            id: lbl_pulpit_piec
            text: !lambda |-
              return (x == "Heating")
                ? std::string("Piec: #FFAA00 grzeje#")
                : std::string("Piec: #00FF00 nie pracuje#");
        - lvgl.label.update:
            id: lbl_piec_icon
            text_color: !lambda |-
              return (x == "Heating") ? lv_color_hex(0xFFAA00) : lv_color_hex(0x666666);


  - platform: homeassistant
    id: state_brama
    entity_id: sensor.brama_wjazdowa_dokladny_stan_bramy
    # Stan bramy nadal jest odbierany z Home Assistant.
    # Pulpit ma obecnie tylko karte-placeholder, wiec nie aktualizujemy
    # tutaj elementow LVGL usunietych z tej strony.
    on_value:
      then:
        - script.execute: ha_rx_flash

button:
  - platform: template
    name: "Znajdz JARVIS"
    id: find_device_button
    on_press:
      - script.execute: identify_device

switch:
  - platform: homeassistant
    id: sypialnia_lampa
    entity_id: light.studio

  - platform: homeassistant
    id: erni_lampa
    entity_id: light.sypialnia

