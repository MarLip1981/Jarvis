# JARVIS 2.0 — ZADANIA OKRESOWE I ODSWIEŻANIE WSKAZAŃ
# Moduł wydzielony mechanicznie z room-switcher-cyd (3).yaml.
# Na tym etapie zachowujemy istniejącą logikę i identyfikatory.

interval:
  # Lokalna animacja: pozycja z HA jest celem, a ESP32 gladko przesuwa skrzydlo.
  # Sygnalizator: domyslnie swieci przy otwartej bramie i podczas otwierania,
  # miga podczas zamykania (tryb AUTO jak w karcie HA).
  - interval: 250ms
    then:
      # Lampka jak w karcie HA: AUTO miga przy zamykaniu,
      # ALWAYS_BLINK podczas kazdego ruchu, NO_BLINK swieci stale.
      - lvgl.obj.update:
          id: gate_beacon
          bg_color: 0xFFAA00
          bg_opa: !lambda |-
            if (!id(brama_ha_status).has_state()) return LV_OPA_TRANSP;
            const std::string &s = id(brama_ha_status).state;
            const bool opening = s.find("Otwieranie") != std::string::npos || s.find("Furtka") != std::string::npos;
            const bool open = s == "Otwarta";
            const bool closing = s.find("Zamykanie") != std::string::npos;
            if (opening || open) return LV_OPA_COVER;
            if (closing) return (((esphome::millis)() / 500) % 2) == 0 ? LV_OPA_COVER : LV_OPA_TRANSP;
            // Wirtualna lampka nie wykonuje błysku po zamknięciu.
            return LV_OPA_TRANSP;
      - lvgl.obj.update:
          id: gate_beacon
          shadow_opa: !lambda |-
            if (!id(brama_ha_status).has_state()) return 0;
            const std::string &s = id(brama_ha_status).state;
            const bool opening = s.find("Otwieranie") != std::string::npos || s.find("Furtka") != std::string::npos;
            const bool open = s == "Otwarta";
            const bool closing = s.find("Zamykanie") != std::string::npos;
            if (opening || open) return 230;
            if (closing) return (((esphome::millis)() / 500) % 2) == 0 ? 230 : 0;
            return 0;
      # Fizyczna dioda RGB: sygnalizacja cyklu bramy.
      - if:
          condition:
            lambda: 'return id(brama_ha_status).has_state() && (id(brama_ha_status).state.find("Otwieranie") != std::string::npos || id(brama_ha_status).state.find("Furtka") != std::string::npos);'
          then:
            - light.turn_on:
                id: status_led
                red: 1.0
                green: 0.55
                blue: 0.0
                brightness: 100%
                transition_length: 0s
          else:
            - if:
                condition:
                  lambda: 'return id(brama_ha_status).has_state() && id(brama_ha_status).state == "Otwarta";'
                then:
                  - light.turn_on:
                      id: status_led
                      red: 1.0
                      green: 0.0
                      blue: 0.0
                      brightness: 100%
                      transition_length: 0s
                else:
                  - if:
                      condition:
                        lambda: 'return id(brama_ha_status).has_state() && id(brama_ha_status).state.find("Zamykanie") != std::string::npos;'
                      then:
                        - if:
                            condition:
                              lambda: 'return (((esphome::millis)() / 500) % 2) == 0;'
                            then:
                              - light.turn_on:
                                  id: status_led
                                  red: 1.0
                                  green: 0.55
                                  blue: 0.0
                                  brightness: 100%
                                  transition_length: 0s
                            else:
                              - light.turn_off:
                                  id: status_led
                                  transition_length: 0s
                      else:
                        - if:
                            condition:
                              lambda: 'return id(brama_closed_flash_ms) > 0 && ((esphome::millis)() - id(brama_closed_flash_ms)) < 650;'
                            then:
                              - light.turn_on:
                                  id: status_led
                                  red: 0.0
                                  green: 1.0
                                  blue: 0.0
                                  brightness: 100%
                                  transition_length: 0s
                            else:
                              - light.turn_off:
                                  id: status_led
                                  transition_length: 0s
      # Aktywna blokada P3 pulsuje na czerwono.
      - lvgl.label.update:
          id: lbl_brama_warning
          text_color: !lambda |-
            const bool lock = id(brama_manual_lock_state).has_state() &&
                              id(brama_manual_lock_state).state == "on";
            if (!lock) return id(brama_photocell).state
              ? lv_color_hex(0xFFCC00) : lv_color_hex(0xFF3333);
            return (((esphome::millis)() / 350) % 2) == 0
              ? lv_color_hex(0xFF3333) : lv_color_hex(0x8B0000);
  - interval: 20ms
    then:
      - lambda: |-
          const uint32_t elapsed = (esphome::millis)() - id(brama_position_started_ms);
          float progress = (float)elapsed / 1000.0f;
          if (progress > 1.0f) progress = 1.0f;
          id(brama_position_visual) = id(brama_position_start) +
            (id(brama_position_target) - id(brama_position_start)) * progress;
      - lvgl.obj.update:
          id: gate_leaf
          x: !lambda |-
            const int direction = (id(brama_ha_direction).has_state() && id(brama_ha_direction).state == "left") ? -1 : 1;
            return 27 + direction * (int)(id(brama_position_visual) * 1.026f);
  # Automatyczny powrot dopiero po potwierdzonym zamknieciu i 2 s stabilnego stanu.
  - interval: 100ms
    then:
      - if:
          condition:
            lambda: 'return id(brama_backlight_override) && id(brama_ha_status).has_state() && (id(brama_ha_status).state.rfind("Zamknięta", 0) == 0 || id(brama_ha_status).state.rfind("Zamknieta", 0) == 0) && id(brama_closed_flash_ms) > 0 && ((esphome::millis)() - id(brama_closed_flash_ms)) >= 650;'
          then:
            - if:
                condition:
                  lambda: 'return id(brama_backlight_original_on);'
                then:
                  - light.turn_on:
                      id: tft_backlight
                      brightness: !lambda 'return id(brama_backlight_original_brightness);'
                else:
                  - light.turn_off: tft_backlight
            - globals.set:
                id: brama_backlight_override
                value: "false"
            - globals.set:
                id: brama_closed_flash_ms
                value: "0"
      - if:
          condition:
            lambda: 'return id(brama_page_active) && id(brama_closed_since_ms) > 0 && ((esphome::millis)() - id(brama_closed_since_ms)) >= 2000;'
          then:
            - globals.set:
                id: brama_page_active
                value: "false"
            - globals.set:
                id: brama_waiting_for_motion
                value: "false"
            - globals.set:
                id: brama_closed_since_ms
                value: "0"
            - lvgl.page.show:
                id: page_pulpit
                animation: NONE
                time: 300ms
  - interval: 1s
    then:
      # --- Chowanie licznika pozostalych kliknie easter egga, jesli
      # minelo okno 3s bez kolejnego dotkniecia ikonki HA ---
      - if:
          condition:
            lambda: 'return id(easter_tap_count) > 0 && ((esphome::millis)() - id(easter_tap_last_ms)) > 3000;'
          then:
            - globals.set:
                id: easter_tap_count
                value: "0"
            - lvgl.obj.update:
                id: lbl_easter_countdown
                hidden: true
      # --- Oszczedzanie baterii: 60s bezczynnosci = przygaszenie do 50%,
      # 120s = calkowite wygaszenie. Wybudzenie dotykiem (patrz on_touch
      # w touchscreen:) przywraca normalna jasnosc. ---
      - lambda: |-
          uint32_t idle_ms = (esphome::millis)() - id(last_activity_ms);
          if (!id(brama_backlight_override) && idle_ms > 120000 && !id(screen_off)) {
            id(screen_off) = true;
            id(screen_dimmed) = true;
            id(tft_backlight).turn_off().perform();
          } else if (!id(brama_backlight_override) && idle_ms > 60000 && idle_ms <= 120000 && !id(screen_dimmed)) {
            id(screen_dimmed) = true;
            auto call = id(tft_backlight).turn_on();
            call.set_brightness(0.5);
            call.perform();
          }
      # --- Statusy pulpitu: statyczne bufory tekstu LVGL.
      # Treść, kolory, częstotliwość odświeżania i pozycje pozostają bez zmian.
      # lv_label_set_text_static nie kopiuje tekstu do sterty LVGL, więc ogranicza
      # cykliczne alokacje i fragmentację pamięci.
      - lambda: |-
          // Drzwi: identyczne trzy stany i ten sam licznik czasu otwarcia.
          static char door_buf[64];
          if (!id(state_drzwi).has_state()) {
            snprintf(door_buf, sizeof(door_buf), "Drzwi:   #888888 --#");
            lv_label_set_text_static(id(lbl_pulpit_drzwi), door_buf);
            lv_label_set_text_static(id(lbl_drzwi_icon), "\U000F081B");
            lv_obj_set_style_text_color(id(lbl_drzwi_icon), lv_color_hex(0x888888), 0);
          } else if (id(state_drzwi).state) {
            const uint32_t sec = ((esphome::millis)() - id(door_open_since_ms)) / 1000;
            const uint32_t h = sec / 3600;
            const uint32_t m = (sec % 3600) / 60;
            const uint32_t s = sec % 60;
            if (h > 0) {
              snprintf(door_buf, sizeof(door_buf), "Drzwi:   #FF0000 OTWARTE %uh %umin#", (unsigned) h, (unsigned) m);
            } else if (m > 0) {
              snprintf(door_buf, sizeof(door_buf), "Drzwi:   #FF0000 OTWARTE %umin %us#", (unsigned) m, (unsigned) s);
            } else {
              snprintf(door_buf, sizeof(door_buf), "Drzwi:   #FF0000 OTWARTE %us#", (unsigned) s);
            }
            lv_label_set_text_static(id(lbl_pulpit_drzwi), door_buf);
            lv_label_set_text_static(id(lbl_drzwi_icon), "\U000F081C");
            lv_obj_set_style_text_color(id(lbl_drzwi_icon), lv_color_hex(0xFF0000), 0);
          } else {
            snprintf(door_buf, sizeof(door_buf), "Drzwi:   #00FF00 zamknięte#");
            lv_label_set_text_static(id(lbl_pulpit_drzwi), door_buf);
            lv_label_set_text_static(id(lbl_drzwi_icon), "\U000F081B");
            lv_obj_set_style_text_color(id(lbl_drzwi_icon), lv_color_hex(0x888888), 0);
          }

          // Zegar, dzień i data — te same wartości co przed optymalizacją.
          static char clock_buf[9];
          static char day_buf[32];
          static char date_buf[40];
          const auto t = id(sntp_time).now();
          if (t.is_valid()) {
            snprintf(clock_buf, sizeof(clock_buf), "%02d:%02d:%02d", t.hour, t.minute, t.second);
            static const char* dni[] = {"Niedziela","Poniedziałek","Wtorek","Środa",
                                         "Czwartek","Piątek","Sobota"};
            static const char* miesiace[] = {"stycznia","lutego","marca","kwietnia","maja",
                                              "czerwca","lipca","sierpnia","września",
                                              "października","listopada","grudnia"};
            snprintf(day_buf, sizeof(day_buf), "%s", dni[t.day_of_week - 1]);
            snprintf(date_buf, sizeof(date_buf), "%d %s %d", t.day_of_month, miesiace[t.month - 1], t.year);
          } else {
            snprintf(clock_buf, sizeof(clock_buf), "--:--:--");
            snprintf(day_buf, sizeof(day_buf), "---");
            snprintf(date_buf, sizeof(date_buf), "--.--.----");
          }
          lv_label_set_text_static(id(lbl_clock), clock_buf);
          lv_label_set_text_static(id(lbl_pulpit_day), day_buf);
          lv_label_set_text_static(id(lbl_pulpit_date), date_buf);

          // Licznik i układ widocznych lamp — logika i kolejność bez zmian.
          const bool salon_on = id(state_salon_lampka_raw).has_state() && id(state_salon_lampka_raw).state == "on";
          const bool studio_on = id(state_sypialnia_lampa_raw).has_state() && id(state_sypialnia_lampa_raw).state == "on";
          const bool erni_on = id(state_erni_lampa_raw).has_state() && id(state_erni_lampa_raw).state == "on";
          const bool wejscie_on = id(state_wejscie_schodki_lampa_raw).has_state() && id(state_wejscie_schodki_lampa_raw).state == "on";
          const bool wjazd_on = id(state_outdoor_wjazd_raw).has_state() && id(state_outdoor_wjazd_raw).state == "on";
          const bool podworko_on = id(state_outdoor_podworko_raw).has_state() && id(state_outdoor_podworko_raw).state == "on";
          const bool adresowka_on = id(state_adresowka_lampa_raw).has_state() && id(state_adresowka_lampa_raw).state == "on";
          const int on_count = (salon_on ? 1 : 0) + (studio_on ? 1 : 0) + (erni_on ? 1 : 0) +
                               (wejscie_on ? 1 : 0) + (wjazd_on ? 1 : 0) +
                               (podworko_on ? 1 : 0) + (adresowka_on ? 1 : 0);

          int row = 0;
          if (salon_on) {
            lv_obj_set_pos(id(btn_lampy_salon), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_salon), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_salon), LV_OBJ_FLAG_HIDDEN);
          if (studio_on) {
            lv_obj_set_pos(id(btn_lampy_sypialnia), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_sypialnia), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_sypialnia), LV_OBJ_FLAG_HIDDEN);
          if (erni_on) {
            lv_obj_set_pos(id(btn_lampy_erni), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_erni), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_erni), LV_OBJ_FLAG_HIDDEN);
          if (wejscie_on) {
            lv_obj_set_pos(id(btn_lampy_wejscie), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_wejscie), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_wejscie), LV_OBJ_FLAG_HIDDEN);
          if (wjazd_on) {
            lv_obj_set_pos(id(btn_lampy_wjazd), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_wjazd), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_wjazd), LV_OBJ_FLAG_HIDDEN);
          if (podworko_on) {
            lv_obj_set_pos(id(btn_lampy_podworko), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_podworko), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_podworko), LV_OBJ_FLAG_HIDDEN);
          if (adresowka_on) {
            lv_obj_set_pos(id(btn_lampy_adresowka), 10, 70 + row++ * 35);
            lv_obj_clear_flag(id(btn_lampy_adresowka), LV_OBJ_FLAG_HIDDEN);
          } else lv_obj_add_flag(id(btn_lampy_adresowka), LV_OBJ_FLAG_HIDDEN);

          static char lamp_count_buf[40];
          if (on_count == 0) {
            snprintf(lamp_count_buf, sizeof(lamp_count_buf), "#888888 0#");
          } else {
            const char *form = on_count == 1 ? "włączona" :
                               (on_count >= 2 && on_count <= 4 ? "włączone" : "włączonych");
            snprintf(lamp_count_buf, sizeof(lamp_count_buf), "#00FF00 %d %s#", on_count, form);
          }
          lv_label_set_text_static(id(lbl_pulpit_lamps), lamp_count_buf);
          lv_obj_set_style_text_color(id(lbl_pulpit_lamps_icon),
            lv_color_hex(on_count > 0 ? 0x00FF00 : 0x888888), 0);
          lv_label_set_text_static(id(lbl_pulpit_lamps_icon),
            on_count > 0 ? "\U000F0335" : "\U000F0336");
          if (on_count > 0) lv_obj_add_flag(id(lbl_lampy_empty), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(lbl_lampy_empty), LV_OBJ_FLAG_HIDDEN);

          // Statusy lamp na ekranach pomieszczeń — zachowane teksty i kolory.
          const bool salon_valid = id(state_salon_lampka_raw).has_state() &&
            (id(state_salon_lampka_raw).state == "on" || id(state_salon_lampka_raw).state == "off");
          const bool studio_valid = id(state_sypialnia_lampa_raw).has_state() &&
            (id(state_sypialnia_lampa_raw).state == "on" || id(state_sypialnia_lampa_raw).state == "off");
          const bool erni_valid = id(state_erni_lampa_raw).has_state() &&
            (id(state_erni_lampa_raw).state == "on" || id(state_erni_lampa_raw).state == "off");

          lv_label_set_text_static(id(lbl_salon_glowna_text),
            !salon_valid ? "Lampa: niedostępna" : (salon_on ? "Lampa: WŁĄCZONA" : "Lampa: wyłączona"));
          lv_obj_set_style_text_color(id(lbl_salon_glowna_text),
            lv_color_hex(!salon_valid ? 0xFF3333 : (salon_on ? 0x00FF00 : 0xFFFFFF)), 0);
          lv_label_set_text_static(id(lbl_salon_glowna_icon),
            !salon_valid ? "\U000F0E4F" : (salon_on ? "\U000F06E8" : "\U000F0336"));
          lv_obj_set_style_text_color(id(lbl_salon_glowna_icon),
            lv_color_hex(!salon_valid ? 0xFF3333 : (salon_on ? 0x00FF00 : 0x888888)), 0);

          lv_label_set_text_static(id(lbl_sypialnia_lampa),
            !studio_valid ? "Lampa: niedostępna" : (studio_on ? "Lampa: WŁĄCZONA" : "Lampa: wyłączona"));
          lv_obj_set_style_text_color(id(lbl_sypialnia_lampa),
            lv_color_hex(!studio_valid ? 0xFF3333 : (studio_on ? 0x00FF00 : 0xFFFFFF)), 0);
          lv_label_set_text_static(id(lbl_sypialnia_lampa_icon),
            !studio_valid ? "\U000F0E4F" : (studio_on ? "\U000F06E8" : "\U000F0336"));
          lv_obj_set_style_text_color(id(lbl_sypialnia_lampa_icon),
            lv_color_hex(!studio_valid ? 0xFF3333 : (studio_on ? 0x00FF00 : 0x888888)), 0);

          lv_label_set_text_static(id(lbl_erni_lampa),
            !erni_valid ? "Lampa: niedostępna" : (erni_on ? "Lampa: WŁĄCZONA" : "Lampa: wyłączona"));
          lv_obj_set_style_text_color(id(lbl_erni_lampa),
            lv_color_hex(!erni_valid ? 0xFF3333 : (erni_on ? 0x00FF00 : 0xFFFFFF)), 0);
          lv_label_set_text_static(id(lbl_erni_lampa_icon),
            !erni_valid ? "\U000F0E4F" : (erni_on ? "\U000F06E8" : "\U000F0336"));
          lv_obj_set_style_text_color(id(lbl_erni_lampa_icon),
            lv_color_hex(!erni_valid ? 0xFF3333 : (erni_on ? 0x00FF00 : 0x888888)), 0);
