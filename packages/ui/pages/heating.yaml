# JARVIS 2.0 — STRONA PIECA I CWU ORAZ PLACEHOLDER OŚWIETLENIA
# Moduł wydzielony mechanicznie z room-switcher-cyd (3).yaml.
# Na tym etapie zachowujemy istniejącą logikę i identyfikatory.

lvgl:
  pages:
    - id: page_piec
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_zewnetrzne
            animation: MOVE_LEFT
            time: 300ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_pulpit
            animation: MOVE_RIGHT
            time: 300ms
      widgets:
        - label:
            text: "PIEC"
            align: TOP_MID
            y: 25
            text_font: font_ui_18
            text_color: 0xFFFFFF
        - obj:
            x: 2
            y: 48
            width: 236
            height: 132
            bg_opa: TRANSP
            border_width: 2
            border_color: 0x333333
            radius: 8
            pad_all: 2
            scrollable: false
            widgets:
              - label:
                  text: "OGRZEWANIE"
                  x: 6
                  y: 3
                  text_font: font_ui_14
                  text_color: 0x888888
              - label:
                  id: lbl_piec_mode
                  text: "..."
                  align: TOP_RIGHT
                  x: -6
                  y: 3
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
                  recolor: true
              - label:
                  text: "Zadana"
                  x: 8
                  y: 25
                  text_font: font_ui_12
                  text_color: 0xAAAAAA
              - label:
                  text: "Temperatura"
                  x: 126
                  y: 25
                  text_font: font_ui_12
                  text_color: 0xAAAAAA
              - label:
                  id: lbl_piec_target
                  text: "--.- °C"
                  x: 12
                  y: 42
                  width: 90
                  height: 26
                  text_font: font_ui_18
                  text_color: 0xFFFFFF
                  text_align: CENTER
              - label:
                  id: lbl_piec_temp
                  text: "--.- °C"
                  x: 120
                  y: 40
                  width: 108
                  height: 34
                  text_font: font_ui_24
                  text_color: 0xFFFFFF
                  text_align: CENTER
              - button:
                  id: btn_piec_plus
                  x: 12
                  y: 68
                  width: 40
                  height: 26
                  pad_all: 0
                  bg_color: 0x18232B
                  border_width: 1
                  border_color: 0x45515C
                  radius: 5
                  shadow_width: 0
                  pressed:
                    bg_color: 0x3A6A84
                  widgets:
                    - label:
                        align: CENTER
                        text: "+"
                        text_font: font_ui_14
                        text_align: CENTER
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                          - homeassistant.action:
                              action: climate.set_temperature
                              data:
                                entity_id: climate.dom_zone_ogrzewanie_circuit_0_climate
                              data_template:
                                temperature: !lambda |-
                                  float t = id(cache_piec_target) + 0.5f;
                                  if (t > 30.0f) t = 30.0f;
                                  char buf[8];
                                  snprintf(buf, sizeof(buf), "%.1f", t);
                                  return std::string(buf);
                          - script.execute: confirm_click
              - button:
                  id: btn_piec_minus
                  x: 62
                  y: 68
                  width: 40
                  height: 26
                  pad_all: 0
                  bg_color: 0x18232B
                  border_width: 1
                  border_color: 0x45515C
                  radius: 5
                  shadow_width: 0
                  pressed:
                    bg_color: 0x3A6A84
                  widgets:
                    - label:
                        align: CENTER
                        text: "-"
                        text_font: font_ui_14
                        text_align: CENTER
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                          - homeassistant.action:
                              action: climate.set_temperature
                              data:
                                entity_id: climate.dom_zone_ogrzewanie_circuit_0_climate
                              data_template:
                                temperature: !lambda |-
                                  float t = id(cache_piec_target) - 0.5f;
                                  if (t < 5.0f) t = 5.0f;
                                  char buf[8];
                                  snprintf(buf, sizeof(buf), "%.1f", t);
                                  return std::string(buf);
                          - script.execute: confirm_click
              - button:
                  id: btn_piec_auto
                  x: 4
                  y: 101
                  width: 110
                  height: 24
                  pad_all: 0
                  bg_color: 0x18232B
                  border_width: 1
                  border_color: 0x45515C
                  radius: 5
                  shadow_width: 0
                  pressed:
                    bg_color: 0x3A6A84
                  widgets:
                    - label:
                        align: CENTER
                        text: "AUTO"
                        text_font: font_ui_14
                        text_align: CENTER
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                          - homeassistant.action:
                              action: climate.set_hvac_mode
                              data:
                                entity_id: climate.dom_zone_ogrzewanie_circuit_0_climate
                                hvac_mode: "auto"
                          - script.execute: confirm_click
              - button:
                  id: btn_piec_off
                  x: 120
                  y: 101
                  width: 110
                  height: 24
                  pad_all: 0
                  bg_color: 0x18232B
                  border_width: 1
                  border_color: 0x45515C
                  radius: 5
                  shadow_width: 0
                  pressed:
                    bg_color: 0x3A6A84
                  widgets:
                    - label:
                        align: CENTER
                        text: "OFF"
                        text_font: font_ui_14
                        text_align: CENTER
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                          - homeassistant.action:
                              action: climate.set_hvac_mode
                              data:
                                entity_id: climate.dom_zone_ogrzewanie_circuit_0_climate
                                hvac_mode: "off"
                          - script.execute: confirm_click

        - obj:
