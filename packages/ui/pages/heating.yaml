        - button:
            x: 8
            y: 52
            width: 224
            height: 26
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 5
            pad_all: 0
            widgets:
              - label:
                  id: lbl_adresowka_state
                  text: "ADRESÓWKA: ..."
                  align: CENTER
                  text_font: font_ui_12
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: light.adresowka
                    - script.execute: confirm_click
        - label:
            text: "Jasność"
            x: 8
            y: 82
            text_font: font_ui_12
            text_color: 0xCCCCCC
        - label:
            id: lbl_adresowka_brightness_val
            text: "--"
            x: 184
            y: 82
            text_font: font_ui_12
            text_color: 0xFFFFFF
        - slider:
            id: slider_adresowka_brightness
            x: 8
            y: 100
            width: 224
            height: 12
            min_value: 1
            max_value: 100
            value: 50
            on_release:
              then:
                - if:
                    condition:
                      lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                    then:
                      - homeassistant.action:
                          action: light.turn_on
                          data:
                            entity_id: light.adresowka
                          data_template:
                            brightness_pct: !lambda 'return std::to_string(lv_slider_get_value(id(slider_adresowka_brightness)));'
                      - script.execute: confirm_click
        - label:
            text: "Temperatura barwowa"
            x: 8
            y: 116
            text_font: font_ui_12
            text_color: 0xCCCCCC
        - label:
            id: lbl_adresowka_colortemp_val
            text: "--"
            x: 184
            y: 116
            text_font: font_ui_12
            text_color: 0xFFFFFF
        - slider:
            id: slider_adresowka_colortemp
            x: 8
            y: 134
            width: 224
            height: 12
            min_value: 2000
            max_value: 6500
            value: 4000
            on_release:
              then:
                - if:
                    condition:
                      lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                    then:
                      - homeassistant.action:
                          action: light.turn_on
                          data:
                            entity_id: light.adresowka
                          data_template:
                            color_temp_kelvin: !lambda 'return std::to_string(lv_slider_get_value(id(slider_adresowka_colortemp)));'
                      - script.execute: confirm_click

        - button:
            x: 8
            y: 152
            width: 108
            height: 25
            bg_color: 0x4A1B1B
            border_width: 1
            border_color: 0xAA4444
            radius: 4
