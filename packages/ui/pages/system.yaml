    # ------------------------------------------------------
    # Easter egg: Iron Man. Odslaniana dopiero po animacji migania
    # z easter_egg_ironman. Wyjscie: swipe w KAZDA strone wraca
    # na Pulpit i chowa reaktor/napis z powrotem.
    # ------------------------------------------------------
    - id: page_ironman
      bg_color: 0x000000
      on_swipe_left:
        - script.execute: exit_ironman
      on_swipe_right:
        - script.execute: exit_ironman
      widgets:
        - image:
            id: ironman_img
            x: 0
            y: -20
            src: img_ironman
            hidden: true
        - label:
            id: lbl_ironman_text
            text: "I AM IRON MAN"
            align: CENTER
            y: 130
            text_font: montserrat_24
            text_color: 0xFFD700
            bg_color: 0x000000
            bg_opa: 60%
            hidden: true

    # ------------------------------------------------------
    # Identyfikacja urzadzenia - wywolywana przyciskiem z HA.
    # Bialy ekran, dopoki ktos nie dotknie ZNALEZIONE.
    # ------------------------------------------------------
    - id: page_identify
      bg_color: 0xFFFFFF
      widgets:
        - label:
            text: "\U000F10CB"
            align: CENTER
            y: -70
            text_font: icon_font_title
            text_color: 0x000000
        - label:
            text: "JARVIS"
            align: CENTER
            y: 5
            text_font: montserrat_24
            text_color: 0x000000
        - label:
            text: "Tu jestem!"
            align: CENTER
            y: 40
            text_font: montserrat_14
            text_color: 0x333333
        - button:
            x: 20
            y: 240
            width: 200
            height: 55
            bg_color: 0x00AA00
            pressed:
              bg_color: 0x006600
            widgets:
              - label:
                  align: CENTER
                  text: "ZNALEZIONE"
                  text_font: montserrat_18
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                - globals.set:
                    id: identify_active
                    value: "false"
  
