# JARVIS 2.0 — STRONY SALONU, LAMPY, TV I RADIA
# Moduł wydzielony mechanicznie z room-switcher-cyd (3).yaml.
# Na tym etapie zachowujemy istniejącą logikę i identyfikatory.

lvgl:
  pages:
    - id: page_salon
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_sypialnia
            animation: MOVE_LEFT
            time: 300ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_pulpit
            animation: MOVE_RIGHT
            time: 300ms
      widgets:
        - label:
            text: "SALON"
            align: TOP_MID
            y: 30
            text_font: font_ui_24
            text_color: 0xFFFFFF
        - button:
            x: 10
            y: 70
            width: 220
            height: 50
            bg_color: 0x2196F3
            pressed:
              bg_color: 0x00FF00
            widgets:
              - label:
                  id: lbl_salon_glowna_icon
                  text: "\U000F0E50"
                  x: 8
                  y: 13
                  text_font: icon_font_btn
                  text_color: 0xFF0000
              - label:
                  text: "Lampa"
                  x: 36
                  y: 17
            on_press:
              - globals.set:
                  id: btn_press_ms
                  value: !lambda 'return (esphome::millis)();'
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - if:
                        condition:
                          lambda: 'return ((esphome::millis)() - id(btn_press_ms)) > 500;'
                        then:
                          - lvgl.page.show:
                              id: page_salon_lampa
                              animation: FADE_IN
                              time: 200ms
                          - script.execute: confirm_click
                        else:
                          - homeassistant.action:
                              action: light.toggle
                              data:
                                entity_id: light.salon_lampka
                          - script.execute: confirm_click
        - button:
            x: 10
            y: 130
            width: 220
            height: 50
            bg_color: 0x2196F3
            pressed:
              bg_color: 0x00FF00
            widgets:
              - label:
                  align: CENTER
                  text: "Telewizor"
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                  - lvgl.page.show:
                      id: page_tv
                      animation: FADE_IN
                      time: 200ms
                  - script.execute: confirm_click
        - button:
            x: 10
            y: 190
            width: 220
            height: 50
            bg_color: 0x2196F3
            pressed:
              bg_color: 0x00FF00
            widgets:
              - label:
                  align: CENTER
                  text: "Radio"
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - lvgl.page.show:
                        id: page_radio
                        animation: FADE_IN
                        time: 200ms
                    - script.execute: confirm_click

    # ------------------------------------------------------
    # Salon > Lampa - ekran sterowania (wlacz/wylacz + jasnosc).
    # PLACEHOLDER: aktualna zarowka Salonu jest zepsuta, encje
    # dopiszemy jak kupisz nowa. Wyjscie: swipe w KAZDA strone
    # wraca na Salon.
    # ------------------------------------------------------
    - id: page_salon_lampa
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_salon
            animation: FADE_IN
            time: 200ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_salon
            animation: FADE_IN
            time: 200ms
      widgets:
        - label:
            text: "SALON - LAMPA"
            align: TOP_MID
            y: 30
            text_font: font_ui_18
            text_color: 0xFFFFFF
        - obj:
            x: 2
            y: 62
            width: 236
            height: 248
            bg_opa: TRANSP
            border_width: 2
            border_color: 0x333333
            radius: 8
            pad_all: 2
            scrollable: false
            widgets:
              - button:
                  x: 0
                  y: 0
                  width: 232
                  height: 28
                  bg_color: 0x2196F3
                  pressed:
                    bg_color: 0x00FF00
                  widgets:
                    - label:
                        align: CENTER
                        text: "Włącz / Wyłącz"
                        text_font: font_ui_12
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                        - homeassistant.action:
                            action: light.toggle
                            data:
                              entity_id: light.salon_lampka
                        - script.execute: confirm_click
              - label:
                  id: lbl_salon_lampka_status
                  text: "Stan: ..."
                  x: 0
                  y: 34
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
                  recolor: true

              - label:
                  id: lbl_salon_brightness
                  text: "Jasność"
                  x: 5
                  y: 58
                  text_font: font_ui_14
                  text_color: 0xCCCCCC
              - slider:
                  id: slider_salon_brightness
                  x: 20
                  y: 80
                  width: 30
                  height: 100
                  min_value: 1
                  max_value: 100
                  value: 50
                  on_release:
                    then:
                      - if:
                          condition:
                            lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                          then:
                            - homeassistant.action:
                                action: light.turn_on
                                data:
                                  entity_id: light.salon_lampka
                                data_template:
                                  brightness_pct: !lambda 'return std::to_string(lv_slider_get_value(id(slider_salon_brightness)));'
                            - script.execute: confirm_click
              - label:
                  id: lbl_salon_brightness_val
                  text: "--"
                  x: 15
                  y: 184
                  text_font: font_ui_14
                  text_color: 0xFFFFFF

              - label:
                  id: lbl_salon_colortemp
                  text: "Barwa"
                  x: 125
                  y: 58
                  text_font: font_ui_14
                  text_color: 0xCCCCCC
              - slider:
                  id: slider_salon_colortemp
                  x: 160
                  y: 80
                  width: 30
                  height: 100
                  min_value: 2000
                  max_value: 6500
                  value: 4000
                  on_release:
                    then:
                      - if:
                          condition:
                            lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                          then:
                            - homeassistant.action:
                                action: light.turn_on
                                data:
                                  entity_id: light.salon_lampka
                                data_template:
                                  color_temp_kelvin: !lambda 'return std::to_string(lv_slider_get_value(id(slider_salon_colortemp)));'
                            - script.execute: confirm_click
              - label:
                  id: lbl_salon_colortemp_val
                  text: "--"
                  x: 148
                  y: 184
                  text_font: font_ui_14
                  text_color: 0xFFFFFF

              # --- Gotowe kolory (zamiast dotykowej palety - prostsze
              # i pewniejsze w LVGL) ---
              - label:
                  text: "Kolor"
                  x: 5
                  y: 208
                  text_font: font_ui_14
                  text_color: 0xCCCCCC
              - button:
                  x: 0
                  y: 226
                  width: 55
                  height: 28
                  bg_color: 0xFF0000
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                          - homeassistant.action:
                              action: light.turn_on
                              data:
                                entity_id: light.salon_lampka
                              data_template:
                                rgb_color: "[255, 0, 0]"
                          - script.execute: confirm_click
              - button:
                  x: 59
                  y: 226
                  width: 55
                  height: 28
                  bg_color: 0x00FF00
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                          - homeassistant.action:
                              action: light.turn_on
                              data:
                                entity_id: light.salon_lampka
                              data_template:
                                rgb_color: "[0, 255, 0]"
                          - script.execute: confirm_click
              - button:
                  x: 118
                  y: 226
                  width: 55
                  height: 28
                  bg_color: 0x0000FF
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                          - homeassistant.action:
                              action: light.turn_on
                              data:
                                entity_id: light.salon_lampka
                              data_template:
                                rgb_color: "[0, 0, 255]"
                          - script.execute: confirm_click
              - button:
                  x: 177
                  y: 226
                  width: 55
                  height: 28
                  bg_color: 0xFFFFFF
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                          - homeassistant.action:
                              action: light.turn_on
                              data:
                                entity_id: light.salon_lampka
                              data_template:
                                rgb_color: "[255, 255, 255]"
                          - script.execute: confirm_click

    # ------------------------------------------------------
    # Salon > Telewizor - PLACEHOLDER
    # ------------------------------------------------------
    - id: page_tv
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_salon
            animation: FADE_IN
            time: 200ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_salon
            animation: FADE_IN
            time: 200ms
      widgets:
        - label:
            text: "TELEWIZOR"
            align: TOP_MID
            y: 30
            text_font: font_ui_18
            text_color: 0xFFFFFF
        - label:
            id: lbl_tv_status
            text: "Stan: ..."
            align: TOP_MID
            y: 62
            text_font: font_ui_14
            text_color: 0xCCCCCC
        - button:
            x: 60
            y: 100
            width: 120
            height: 50
            bg_color: 0x2196F3
            pressed:
              bg_color: 0x00FF00
            widgets:
              - label:
                  text: "\U000F0425"
                  x: 10
                  y: 15
                  text_font: icon_font_btn
              - label:
                  text: "Zasilanie"
                  align: CENTER
                  text_font: font_ui_14
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                  - homeassistant.action:
                      action: media_player.toggle
                      data:
                        entity_id: media_player.tv_samsung_7_series_49_2
                  - script.execute: confirm_click
        - button:
            x: 20
            y: 170
            width: 95
            height: 50
            bg_color: 0x333333
            pressed:
              bg_color: 0x00FF00
            widgets:
              - label:
                  align: CENTER
                  text: "Vol -"
                  text_font: font_ui_18
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                  - homeassistant.action:
                      action: media_player.volume_down
                      data:
                        entity_id: media_player.tv_samsung_7_series_49_2
                  - script.execute: confirm_click
        - button:
            x: 125
            y: 170
            width: 95
            height: 50
            bg_color: 0x333333
            pressed:
              bg_color: 0x00FF00
            widgets:
              - label:
                  align: CENTER
                  text: "Vol +"
                  text_font: font_ui_18
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                  - homeassistant.action:
                      action: media_player.volume_up
                      data:
                        entity_id: media_player.tv_samsung_7_series_49_2
                  - script.execute: confirm_click

    # ------------------------------------------------------
    # Salon > Radio — ekran główny
    # ------------------------------------------------------
    - id: page_radio
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_salon
            animation: FADE_IN
            time: 200ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_salon
            animation: FADE_IN
            time: 200ms
      widgets:
        - label:
            text: "RADIO"
            x: 8
            y: 30
            text_font: font_ui_14
            text_color: 0xFFFFFF
        - label:
            id: lbl_radio_stacja
            text: "..."
            x: 78
            y: 30
            width: 154
            text_font: font_ui_14
            text_color: 0x42B6F5
            long_mode: DOT

        # Placeholder okładki na czas pierwszej próby układu.
        - obj:
            x: 60
            y: 58
            width: 120
            height: 120
            bg_color: 0x151B22
            border_width: 1
            border_color: 0x35414D
            radius: 8
            scrollable: false
            widgets:
              - label:
                  text: "\U000F0439"
                  align: CENTER
                  text_font: icon_font_radio
                  text_color: 0x526575
        - image:
            id: img_radio_cover_widget
            src: img_radio_cover
            x: 60
            y: 58
            width: 120
            height: 120
            radius: 8
            clip_corner: true
            hidden: true

        - label:
            id: lbl_radio_tytul
            text: "Oczekiwanie na utwór..."
            x: 8
            y: 185
            width: 224
            height: 22
            text_font: font_ui_14
            text_color: 0xFFFFFF
            long_mode: SCROLL_CIRCULAR

        - button:
            x: 14
            y: 218
            width: 58
            height: 42
            bg_color: 0x202A33
            border_width: 1
            border_color: 0x35414D
            radius: 8
            pressed:
              bg_color: 0x31546B
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F0663"
                  text_font: icon_font_radio
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - homeassistant.action:
                        action: button.press
                        data:
                          entity_id: button.atlascube_9140_previous
                    - script.execute: confirm_click

        - button:
            id: btn_radio_playstop
            x: 91
            y: 214
            width: 58
            height: 50
            bg_color: 0x176B9A
            border_width: 1
            border_color: 0x42B6F5
            radius: 10
            pressed:
              bg_color: 0x2389BD
            widgets:
              - label:
                  align: CENTER
                  id: lbl_radio_playstop_icon
                  text: "\U000F040C"
                  text_font: icon_font_radio
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - if:
                        condition:
                          lambda: 'return id(radio_is_playing);'
                        then:
                          - homeassistant.action:
                              action: button.press
                              data:
                                entity_id: button.atlascube_9140_stop
                        else:
                          - homeassistant.action:
                              action: button.press
                              data:
                                entity_id: button.atlascube_9140_play
                    - script.execute: confirm_click

        - button:
            x: 168
            y: 218
            width: 58
            height: 42
            bg_color: 0x202A33
            border_width: 1
            border_color: 0x35414D
            radius: 8
            pressed:
              bg_color: 0x31546B
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F0661"
                  text_font: icon_font_radio
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - homeassistant.action:
                        action: button.press
                        data:
                          entity_id: button.atlascube_9140_next
                    - script.execute: confirm_click

        - label:
            id: lbl_radio_glosnosc
            text: "Głośność --"
            x: 8
            y: 270
            width: 224
            text_align: LEFT
            text_font: font_ui_12
            text_color: 0xFFFFFF
        - slider:
            id: slider_radio_glosnosc
            x: 8
            y: 290
            width: 224
            height: 12
            min_value: 0
            max_value: 100
            value: 50
            on_release:
              then:
                - if:
                    condition:
                      lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                    then:
                      - homeassistant.action:
                          action: number.set_value
                          data:
                            entity_id: number.salon_atlascube_radio_glosnosc
                          data_template:
                            value: !lambda 'return std::to_string(lv_slider_get_value(id(slider_radio_glosnosc)));'
                      - script.execute: confirm_click

    # ------------------------------------------------------
    # Sypialnia
    # ------------------------------------------------------
