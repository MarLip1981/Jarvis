# JARVIS 2.0 — STRONY SALONU, LAMPY, TV I RADIA
# Moduł wydzielony mechanicznie z room-switcher-cyd (3).yaml.
# Na tym etapie zachowujemy istniejącą logikę i identyfikatory.

lvgl:
  pages:
    - id: page_salon
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_sypialnia
            animation: NONE
            time: 300ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_pulpit
            animation: NONE
            time: 300ms
      widgets:
        - label:
            text: "SALON"
            align: TOP_MID
            y: 30
            text_font: font_ui_24
            text_color: 0xFFFFFF
        - button:
            id: btn_salon_lampa
            x: 10
            y: 70
            width: 220
            height: 50
            pad_all: 0
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 5
            shadow_width: 0
            pressed:
              bg_color: 0x31546B
            widgets:
              - label:
                  x: 4
                  align: LEFT_MID
                  id: lbl_salon_glowna_icon
                  text: "\U000F0E4F"
                  text_font: icon_font_btn
                  text_color: 0xFF3333
              - label:
                  id: lbl_salon_glowna_text
                  text: "LAMPA: NIEDOSTĘPNA"
                  x: 32
                  y: 15
                  width: 180
                  height: 20
                  text_align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFF3333
            on_press:
              - globals.set:
                  id: btn_press_ms
                  value: !lambda 'return (esphome::millis)();'
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - if:
                        condition:
                          lambda: 'return ((esphome::millis)() - id(btn_press_ms)) > 500;'
                        then:
                          - lvgl.page.show:
                              id: page_salon_lampa
                              animation: NONE
                              time: 200ms
                          - script.execute: confirm_click
                        else:
                          - homeassistant.action:
                              action: light.toggle
                              data:
                                entity_id: light.salon_lampka
                          - script.execute: confirm_click
        - button:
            x: 10
            y: 130
            width: 220
            height: 50
            pad_all: 0
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 5
            shadow_width: 0
            pressed:
              bg_color: 0x31546B
            widgets:
              - label:
                  align: CENTER
                  text: "TELEWIZOR"
                  text_font: font_ui_14
                  text_align: CENTER
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                  - lvgl.page.show:
                      id: page_tv
                      animation: NONE
                      time: 200ms
                  - script.execute: confirm_click
        - button:
            x: 10
            y: 190
            width: 220
            height: 50
            pad_all: 0
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 5
            shadow_width: 0
            pressed:
              bg_color: 0x31546B
            widgets:
              - label:
                  align: CENTER
                  text: "RADIO"
                  text_font: font_ui_14
                  text_align: CENTER
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - lvgl.page.show:
                        id: page_radio
                        animation: NONE
                        time: 200ms
                    - script.execute: confirm_click

    # ------------------------------------------------------
    # Salon > Lampa - ekran sterowania (wlacz/wylacz + jasnosc).
    # PLACEHOLDER: aktualna zarowka Salonu jest zepsuta, encje
    # dopiszemy jak kupisz nowa. Wyjscie: swipe w KAZDA strone
    # wraca na Salon.
    # ------------------------------------------------------
    - id: page_salon_lampa
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_salon
            animation: NONE
            time: 200ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_salon
            animation: NONE
            time: 200ms
      widgets:
        - label:
            text: "SALON - LAMPA"
            align: TOP_MID
            y: 30
            text_font: font_ui_18
            text_color: 0xFFFFFF
        - label:
            id: lbl_salon_lamp_state_icon
            text: "\U000F0E4F"
            align: TOP_MID
            y: 54
            text_font: icon_font_lamp_state
            text_color: 0xFF3333
        - label:
            id: lbl_salon_lamp_state
            text: "Lampa: niedostępna"
            align: TOP_MID
            y: 98
            text_font: font_ui_14
            text_color: 0xFF3333
        - obj:
            x: 2
            y: 120
            width: 236
            height: 196
            bg_opa: TRANSP
            border_width: 2
            border_color: 0x333333
            radius: 8
            pad_all: 2
            scrollable: false
            widgets:
              - button:
                  x: 0
                  y: 0
                  width: 232
                  height: 28
                  pad_all: 0
                  bg_color: 0x18232B
                  border_width: 1
                  border_color: 0x45515C
                  radius: 5
                  shadow_width: 0
                  pressed:
                    bg_color: 0x31546B
                  widgets:
                    - label:
                        align: CENTER
                        text: "WŁĄCZ / WYŁĄCZ"
                        text_font: font_ui_14
                        text_align: CENTER
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                        - homeassistant.action:
                            action: light.toggle
                            data:
                              entity_id: light.salon_lampka
                        - script.execute: confirm_click
              - label:
                  id: lbl_salon_brightness
                  text: "Jasność"
                  x: 5
                  y: 34
                  text_font: font_ui_14
                  text_color: 0xCCCCCC
              - slider:
                  id: slider_salon_brightness
                  x: 20
                  y: 56
                  width: 30
                  height: 70
                  min_value: 1
                  max_value: 100
                  value: 50
                  on_release:
                    then:
                      - if:
                          condition:
                            lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                          then:
                            - homeassistant.action:
                                action: light.turn_on
                                data:
                                  entity_id: light.salon_lampka
                                data_template:
                                  brightness_pct: !lambda 'return std::to_string(lv_slider_get_value(id(slider_salon_brightness)));'
                            - script.execute: confirm_click
              - label:
                  id: lbl_salon_brightness_val
                  text: "--"
                  x: 15
                  y: 132
                  text_font: font_ui_14
                  text_color: 0xFFFFFF

              - label:
                  id: lbl_salon_colortemp
                  text: "Barwa"
                  x: 125
                  y: 34
                  text_font: font_ui_14
                  text_color: 0xCCCCCC
              - slider:
                  id: slider_salon_colortemp
                  x: 160
                  y: 56
                  width: 30
                  height: 70
                  min_value: 2000
                  max_value: 6500
                  value: 4000
                  on_release:
                    then:
                      - if:
                          condition:
                            lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                          then:
                            - homeassistant.action:
                                action: light.turn_on
                                data:
                                  entity_id: light.salon_lampka
                                data_template:
                                  color_temp_kelvin: !lambda 'return std::to_string(lv_slider_get_value(id(slider_salon_colortemp)));'
                            - script.execute: confirm_click
              - label:
                  id: lbl_salon_colortemp_val
                  text: "--"
                  x: 148
                  y: 132
                  text_font: font_ui_14
                  text_color: 0xFFFFFF

              # --- Gotowe kolory (zamiast dotykowej palety - prostsze
              # i pewniejsze w LVGL) ---
              - label:
                  text: "Kolor"
                  x: 5
                  y: 154
                  text_font: font_ui_14
                  text_color: 0xCCCCCC
              - button:
                  x: 0
                  y: 172
                  width: 55
                  height: 20
                  pad_all: 0
                  bg_color: 0xFF0000
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                          - homeassistant.action:
                              action: light.turn_on
                              data:
                                entity_id: light.salon_lampka
                              data_template:
                                rgb_color: "[255, 0, 0]"
                          - script.execute: confirm_click
              - button:
                  x: 59
                  y: 172
                  width: 55
                  height: 20
                  pad_all: 0
                  bg_color: 0x00FF00
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                          - homeassistant.action:
                              action: light.turn_on
                              data:
                                entity_id: light.salon_lampka
                              data_template:
                                rgb_color: "[0, 255, 0]"
                          - script.execute: confirm_click
              - button:
                  x: 118
                  y: 172
                  width: 55
                  height: 20
                  pad_all: 0
                  bg_color: 0x0000FF
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                          - homeassistant.action:
                              action: light.turn_on
                              data:
                                entity_id: light.salon_lampka
                              data_template:
                                rgb_color: "[0, 0, 255]"
                          - script.execute: confirm_click
              - button:
                  x: 177
                  y: 172
                  width: 55
                  height: 20
                  pad_all: 0
                  bg_color: 0xFFFFFF
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                          - homeassistant.action:
                              action: light.turn_on
                              data:
                                entity_id: light.salon_lampka
                              data_template:
                                rgb_color: "[255, 255, 255]"
                          - script.execute: confirm_click
