# JARVIS 2.0 — STRONY SALONU, LAMPY, TV I RADIA
# Moduł wydzielony mechanicznie z room-switcher-cyd (3).yaml.
# Na tym etapie zachowujemy istniejącą logikę i identyfikatory.

lvgl:
  pages:
    - id: page_salon
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_sypialnia
            animation: NONE
            time: 300ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_pulpit
            animation: NONE
            time: 300ms
      widgets:
        - label:
            text: "SALON"
            align: TOP_MID
            y: 30
            text_font: font_ui_24
            text_color: 0xFFFFFF
        - button:
            id: btn_salon_lampa
            x: 10
            y: 70
            width: 220
            height: 50
            pad_all: 0
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 5
            shadow_width: 0
            pressed:
              bg_color: 0x31546B
            widgets:
              - label:
                  x: 4
                  align: LEFT_MID
                  id: lbl_salon_glowna_icon
                  text: "\U000F0E4F"
                  text_font: icon_font_btn
                  text_color: 0xFF3333
              - label:
                  id: lbl_salon_glowna_text
                  text: "LAMPA: NIEDOSTĘPNA"
                  x: 32
                  y: 15
                  width: 180
                  height: 20
                  text_align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFF3333
            on_press:
              - globals.set:
                  id: btn_press_ms
                  value: !lambda 'return (esphome::millis)();'
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - if:
                        condition:
                          lambda: 'return ((esphome::millis)() - id(btn_press_ms)) > 500;'
                        then:
                          - globals.set:
                              id: lamp_selected
                              value: !lambda 'return std::string("salon");'
                                                    - lvgl.page.show:
                              id: page_lampa_wspolna
                              animation: NONE
                              time: 200ms
- script.execute: prepare_lamp_page
                          - script.execute: confirm_click
                        else:
                          - homeassistant.action:
                              action: light.toggle
                              data:
                                entity_id: light.salon_lampka
                          - script.execute: confirm_click
        - button:
            x: 10
            y: 130
            width: 220
            height: 50
            pad_all: 0
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 5
            shadow_width: 0
            pressed:
              bg_color: 0x31546B
            widgets:
              - label:
                  align: CENTER
                  text: "TELEWIZOR"
                  text_font: font_ui_14
                  text_align: CENTER
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                  - lvgl.page.show:
                      id: page_tv
                      animation: NONE
                      time: 200ms
                  - script.execute: confirm_click
        - button:
            x: 10
            y: 190
            width: 220
            height: 50
            pad_all: 0
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 5
            shadow_width: 0
            pressed:
              bg_color: 0x31546B
            widgets:
              - label:
                  align: CENTER
                  text: "RADIO"
                  text_font: font_ui_14
                  text_align: CENTER
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - lvgl.page.show:
                        id: page_radio
                        animation: NONE
                        time: 200ms
                    - script.execute: confirm_click

    # ------------------------------------------------------
    # Salon > Lampa - ekran sterowania (wlacz/wylacz + jasnosc).
    # PLACEHOLDER: aktualna zarowka Salonu jest zepsuta, encje
    # dopiszemy jak kupisz nowa. Wyjscie: swipe w KAZDA strone
    # wraca na Salon.
    # ------------------------------------------------------
