# JARVIS 2.0 — STRONA RADIA
# Wydzielona z modułu salonu; zachowano identyfikatory, sterowanie i pobieranie okładek.

lvgl:
  pages:
    - id: page_radio
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_salon
            animation: NONE
            time: 200ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_salon
            animation: NONE
            time: 200ms
      widgets:
        - label:
            text: "RADIO"
            x: 8
            y: 30
            text_font: font_ui_14
            text_color: 0xFFFFFF
        - label:
            id: lbl_radio_stacja
            text: "..."
            x: 78
            y: 30
            width: 154
            text_font: font_ui_14
            text_color: 0x42B6F5
            long_mode: DOT

        # Placeholder okładki na czas pierwszej próby układu.
        - obj:
            id: obj_radio_cover_placeholder
            x: 60
            y: 58
            width: 120
            height: 120
            bg_color: 0x151B22
            border_width: 1
            border_color: 0x35414D
            radius: 8
            scrollable: false
            widgets:
              - label:
                  id: lbl_radio_cover_placeholder
                  text: "\U000F0439"
                  align: CENTER
                  text_font: icon_font_radio
                  text_color: 0x526575
        # Obraz pobierany z lokalnego cache HA; ukryty do czasu sukcesu.
        - image:
            id: img_radio_cover_widget
            src: img_radio_cover
            x: 60
            y: 58
            width: 120
            height: 120
            hidden: true
        - label:
            id: lbl_radio_tytul
            text: "Oczekiwanie na utwór..."
            x: 8
            y: 185
            width: 224
            height: 22
            text_font: font_ui_14
            text_color: 0xFFFFFF
            long_mode: SCROLL_CIRCULAR

        - button:
            x: 14
            y: 218
            width: 58
            height: 42
            pad_all: 0
            bg_color: 0x202A33
            border_width: 1
            border_color: 0x35414D
            radius: 8
            pressed:
              bg_color: 0x31546B
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F0663"
                  text_font: icon_font_radio
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - homeassistant.action:
                        action: button.press
                        data:
                          entity_id: button.atlascube_9140_previous
                    - script.execute: confirm_click

        - button:
            id: btn_radio_playstop
            x: 91
            y: 214
            width: 58
            height: 50
            pad_all: 0
            bg_color: 0x176B9A
            border_width: 1
            border_color: 0x42B6F5
            radius: 10
            pressed:
              bg_color: 0x2389BD
            widgets:
              - label:
                  align: CENTER
                  id: lbl_radio_playstop_icon
                  text: "\U000F040C"
                  text_font: icon_font_radio
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - if:
                        condition:
                          lambda: 'return id(radio_is_playing);'
                        then:
                          - homeassistant.action:
                              action: button.press
                              data:
                                entity_id: button.atlascube_9140_stop
                        else:
                          - homeassistant.action:
                              action: button.press
                              data:
                                entity_id: button.atlascube_9140_play
                    - script.execute: confirm_click

        - button:
            x: 168
            y: 218
            width: 58
            height: 42
            pad_all: 0
            bg_color: 0x202A33
            border_width: 1
            border_color: 0x35414D
            radius: 8
            pressed:
              bg_color: 0x31546B
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F0661"
                  text_font: icon_font_radio
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - homeassistant.action:
                        action: button.press
                        data:
                          entity_id: button.atlascube_9140_next
                    - script.execute: confirm_click

        - label:
            id: lbl_radio_glosnosc
            text: "Głośność --"
            x: 8
            y: 270
            width: 224
            text_align: LEFT
            text_font: font_ui_12
            text_color: 0xFFFFFF
        - slider:
            id: slider_radio_glosnosc
            x: 8
            y: 290
            width: 224
            height: 12
            min_value: 0
            max_value: 100
            value: 50
            on_release:
              then:
                - if:
                    condition:
                      lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                    then:
                      - homeassistant.action:
                          action: number.set_value
                          data:
                            entity_id: number.salon_atlascube_radio_glosnosc
                          data_template:
                            value: !lambda 'return std::to_string(lv_slider_get_value(id(slider_radio_glosnosc)));'
                      - script.execute: confirm_click
                    else:
                      - if:
                          condition:
                            lambda: 'return id(radio_glosnosc_attr).has_state() && !std::isnan(id(radio_glosnosc_attr).state);'
                          then:
                            - lvgl.slider.update:
                                id: slider_radio_glosnosc
                                value: !lambda 'return (int) id(radio_glosnosc_attr).state;'

    # ------------------------------------------------------
