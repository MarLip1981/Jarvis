# JARVIS 2.0 — STRONA PULPITU
# Moduł wydzielony mechanicznie z room-switcher-cyd (3).yaml.
# Na tym etapie zachowujemy istniejącą logikę i identyfikatory.

lvgl:
  pages:
    - id: page_pulpit
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_salon
            animation: MOVE_LEFT
            time: 300ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_piec
            animation: MOVE_RIGHT
            time: 300ms
      widgets:
        - label:
            id: lbl_pulpit_day
            text: "---"
            align: TOP_MID
            y: 36
            text_font: montserrat_24
            text_color: 0xFFFFFF
        - label:
            id: lbl_pulpit_date
            text: "--.--.----"
            align: TOP_MID
            y: 64
            text_font: montserrat_14
            text_color: 0x888888
        - label:
            id: lbl_pulpit_climate
            text: "--.-C  --%  Zewn --.-C"
            align: TOP_MID
            y: 84
            text_font: montserrat_12
            text_color: 0x00AEEF
        - obj:
            x: 10
            y: 108
            width: 220
            height: 1
            bg_color: 0x333333
            bg_opa: COVER
            border_width: 0
            radius: 0
        - label:
            id: lbl_pulpit_lamps
            text: "Ilosc wlaczonych lamp: ..."
            x: 15
            y: 118
            text_font: montserrat_14
            text_color: 0xCCCCCC
        - label:
            id: lbl_piec_icon
            text: "\U000F0238"
            x: 15
            y: 141
            text_font: icon_font_btn
            text_color: 0x666666
        - label:
            id: lbl_pulpit_piec
            text: "Piec: ..."
            x: 42
            y: 145
            text_font: montserrat_14
            text_color: 0xFFFFFF
            recolor: true
        - label:
            id: lbl_drzwi_icon
            text: "\U000F081B"
            x: 15
            y: 166
            text_font: icon_font_btn
            text_color: 0x00FF00
        - label:
            id: lbl_pulpit_drzwi
            text: "Drzwi: ..."
            x: 42
            y: 170
            text_font: montserrat_14
            text_color: 0xFFFFFF
            recolor: true

        # --- Karta brama: stan tekstowy + 2 przyciski (otworz/zamknij,
        # furtka) wywolujace button.press w HA ---
        - label:
            id: lbl_brama_icon
            text: "\U000F0299"
            x: 15
            y: 188
            text_font: icon_font_btn
            text_color: 0x555555
        - label:
            id: lbl_pulpit_brama
            text: "Brama: n/a"
            x: 42
            y: 190
            text_font: montserrat_14
            text_color: 0x555555
        - button:
            x: 15
            y: 217
            width: 105
            height: 40
            bg_color: 0x2196F3
            pressed:
              bg_color: 0x00FF00
            widgets:
              - label:
                  align: CENTER
                  id: lbl_brama_btn_text
                  text: "Otworz/Zamknij"
                  text_font: montserrat_12
            on_press:
              - globals.set:
                  id: btn_press_ms
                  value: !lambda 'return (esphome::millis)();'
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && ((esphome::millis)() - id(btn_press_ms)) > 500;'
                  then:
                  - homeassistant.action:
                      action: button.press
                      data:
                        entity_id: button.brama_wjazdowa_otworz_zamknij_brame
                  - script.execute: confirm_click
        - button:
            x: 125
            y: 217
            width: 105
            height: 40
            bg_color: 0x2196F3
            pressed:
              bg_color: 0x00FF00
            widgets:
              - label:
                  text: "\U000F0A48"
                  x: 6
                  y: 8
                  text_font: icon_font_btn
              - label:
                  text: "Furtka"
                  align: CENTER
                  text_font: montserrat_12
            on_press:
              - globals.set:
                  id: btn_press_ms
                  value: !lambda 'return (esphome::millis)();'
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && ((esphome::millis)() - id(btn_press_ms)) > 500;'
                  then:
                  - homeassistant.action:
                      action: button.press
                      data:
                        entity_id: button.brama_wjazdowa_otworz_jako_furtke
                  - script.execute: confirm_click

    # ------------------------------------------------------
    # Salon
    # ------------------------------------------------------
