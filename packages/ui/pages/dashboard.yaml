# JARVIS 2.0 — STRONA PULPITU
# Moduł wydzielony mechanicznie z room-switcher-cyd (3).yaml.
# Na tym etapie zachowujemy istniejącą logikę i identyfikatory.

lvgl:
  pages:
    - id: page_pulpit
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_salon
            animation: MOVE_LEFT
            time: 300ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_piec
            animation: MOVE_RIGHT
            time: 300ms
      widgets:
        - label:
            id: lbl_pulpit_day
            text: "---"
            align: TOP_MID
            y: 36
            text_font: montserrat_24
            text_color: 0xFFFFFF
        - label:
            id: lbl_pulpit_date
            text: "--.--.----"
            align: TOP_MID
            y: 64
            text_font: montserrat_14
            text_color: 0x888888
        - label:
            id: lbl_pulpit_climate
            text: "--.-C  --%  Zewn --.-C"
            align: TOP_MID
            y: 84
            text_font: montserrat_12
            text_color: 0x00AEEF
        - obj:
            x: 10
            y: 108
            width: 220
            height: 1
            bg_color: 0x333333
            bg_opa: COVER
            border_width: 0
            radius: 0
        # Jednowierszowy pasek radia pod separatorem.
        # Tekst zachowuje oryginalne polskie znaki; font_radio_12 zawiera pelny zestaw glifow.
        - label:
            id: lbl_pulpit_radio
            text: "RADIO > --  * --"
            x: 15
            y: 112
            width: 210
            height: 18
            text_font: font_radio_12
            text_color: 0xAAAAAA
            long_mode: SCROLL_CIRCULAR
        - label:
            id: lbl_pulpit_lamps
            text: "Ilosc wlaczonych lamp: ..."
            x: 15
            y: 136
            text_font: montserrat_14
            text_color: 0xCCCCCC
        - label:
            id: lbl_piec_icon
            text: "\U000F0238"
            x: 15
            y: 159
            text_font: icon_font_btn
            text_color: 0x666666
        - label:
            id: lbl_pulpit_piec
            text: "Piec: ..."
            x: 42
            y: 163
            text_font: montserrat_14
            text_color: 0xFFFFFF
            recolor: true
        - label:
            id: lbl_drzwi_icon
            text: "\U000F081B"
            x: 15
            y: 184
            text_font: icon_font_btn
            text_color: 0x00FF00
        - label:
            id: lbl_pulpit_drzwi
            text: "Drzwi: ..."
            x: 42
            y: 188
            text_font: montserrat_14
            text_color: 0xFFFFFF
            recolor: true

        # Status bramy widoczny bez otwierania jej karty.
        - label:
            id: lbl_pulpit_brama_icon
            text: "\\U000F06D9"
            x: 15
            y: 210
            text_font: icon_font_btn
            text_color: 0x888888
        - label:
            id: lbl_pulpit_brama
            text: "Brama: ..."
            x: 42
            y: 214
            text_font: font_gate_14
            text_color: 0xFFFFFF
            recolor: true

        # Dwa niezalezne przyciski pilota. Sterowanie dopiero po przytrzymaniu.
        - button:
            id: btn_pulpit_brama
            x: 10
            y: 237
            width: 105
            height: 36
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 5
            shadow_width: 0
            widgets:
              - label:
                  text: "BRAMA"
                  align: CENTER
                  text_font: montserrat_14
                  text_color: 0xFFFFFF
            on_press:
              - globals.set:
                  id: btn_press_ms
                  value: !lambda 'return (esphome::millis)();'
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked) && ((esphome::millis)() - id(btn_press_ms)) >= 600 && id(brama_main_button_entity).has_state() && !id(brama_main_button_entity).state.empty();'
                  then:
                    - globals.set:
                        id: brama_page_active
                        value: "true"
                    - globals.set:
                        id: brama_waiting_for_motion
                        value: "true"
                    - globals.set:
                        id: brama_closed_since_ms
                        value: "0"
                    - homeassistant.action:
                        action: button.press
                        data_template:
                          entity_id: "{{ target_button }}"
                        variables:
                          target_button: !lambda 'return id(brama_main_button_entity).state;'
                    - lvgl.page.show:
                        id: page_brama
                        animation: MOVE_LEFT
                        time: 300ms
                    - script.execute: confirm_click
        - button:
            id: btn_pulpit_furtka
            x: 125
            y: 237
            width: 105
            height: 36
            bg_color: 0x18232B
            border_width: 1
            border_color: 0xB88632
            radius: 5
            shadow_width: 0
            widgets:
              - label:
                  text: "FURTKA"
                  align: CENTER
                  text_font: montserrat_14
                  text_color: 0xFFFFFF
            on_press:
              - globals.set:
                  id: btn_press_ms
                  value: !lambda 'return (esphome::millis)();'
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked) && ((esphome::millis)() - id(btn_press_ms)) >= 600 && id(brama_pedestrian_enabled).state && id(brama_pedestrian_button_entity).has_state() && !id(brama_pedestrian_button_entity).state.empty();'
                  then:
                    - globals.set:
                        id: brama_page_active
                        value: "true"
                    - globals.set:
                        id: brama_waiting_for_motion
                        value: "true"
                    - globals.set:
                        id: brama_closed_since_ms
                        value: "0"
                    - homeassistant.action:
                        action: button.press
                        data_template:
                          entity_id: "{{ target_button }}"
                        variables:
                          target_button: !lambda 'return id(brama_pedestrian_button_entity).state;'
                    - lvgl.page.show:
                        id: page_brama
                        animation: MOVE_LEFT
                        time: 300ms
                    - script.execute: confirm_click



    # ------------------------------------------------------
    # Salon
    # ------------------------------------------------------
