# JARVIS 2.0 - STRONA PULPITU
# Moduł wydzielony mechanicznie z room-switcher-cyd (3).yaml.
# Na tym etapie zachowujemy istniejącą logikę i identyfikatory.

lvgl:
  pages:
    - id: page_pulpit
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_salon
            animation: MOVE_LEFT
            time: 300ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_piec
            animation: MOVE_RIGHT
            time: 300ms
      widgets:
        - label:
            id: lbl_pulpit_day
            text: "---"
            align: TOP_MID
            y: 36
            text_font: font_ui_24
            text_color: 0xFFFFFF
        - label:
            id: lbl_pulpit_date
            text: "--.--.----"
            align: TOP_MID
            y: 64
            text_font: font_ui_14
            text_color: 0x888888
        - label:
            id: lbl_pulpit_climate
            text: "--.-°C  --%  Zewnątrz --.-°C"
            align: TOP_MID
            y: 84
            text_font: font_ui_12
            text_color: 0x00AEEF
        - obj:
            x: 10
            y: 108
            width: 220
            height: 1
            bg_color: 0x333333
            bg_opa: COVER
            border_width: 0
            radius: 0
        # Klikalny, jednowierszowy pasek radia. Tekst przewija sie wewnatrz przycisku.
        - button:
            id: btn_pulpit_radio
            x: 10
            y: 110
            width: 220
            height: 22
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            widgets:
              - label:
                  text: "\U000F0439"
                  x: 4
                  y: 1
                  text_font: icon_font_btn
                  text_color: 0x888888
              - label:
                  id: lbl_pulpit_radio
                  text: "RADIO > --  * --"
                  x: 28
                  y: 2
                  width: 187
                  height: 18
                  text_font: font_radio_12
                  text_color: 0xAAAAAA
                  long_mode: SCROLL_CIRCULAR
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - lvgl.page.show:
                        id: page_radio
                        animation: MOVE_LEFT
                        time: 250ms
                    - script.execute: confirm_click
        # Podsumowanie oswietlenia - dotkniecie otwiera liste aktualnie wlaczonych lamp.
        - button:
            id: btn_pulpit_lights
            x: 10
            y: 134
            width: 220
            height: 24
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            widgets:
              - label:
                  id: lbl_pulpit_lamps_icon
                  text: "\U000F0E50"
                  x: 5
                  y: 1
                  text_font: icon_font_btn
                  text_color: 0x888888
              - label:
                  text: "Światła"
                  x: 32
                  y: 3
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
              - label:
                  id: lbl_pulpit_lamps
                  text: "#888888 0#"
                  x: 112
                  y: 3
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
                  recolor: true
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - lvgl.page.show:
                        id: page_lampy
                        animation: MOVE_LEFT
                        time: 250ms
                    - script.execute: confirm_click
        - button:
            id: btn_pulpit_piec
            x: 10
            y: 158
            width: 220
            height: 24
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            widgets:
              - label:
                  id: lbl_piec_icon
                  text: "\U000F0238"
                  x: 5
                  y: 1
                  text_font: icon_font_btn
                  text_color: 0x888888
              - label:
                  id: lbl_pulpit_piec
                  text: "Piec: ..."
                  x: 32
                  y: 5
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
                  recolor: true
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - lvgl.page.show:
                        id: page_piec
                        animation: MOVE_LEFT
                        time: 250ms
                    - script.execute: confirm_click
        - label:
            id: lbl_drzwi_icon
            text: "\U000F081B"
            x: 15
            y: 184
            text_font: icon_font_btn
            text_color: 0x888888
        - label:
            id: lbl_pulpit_drzwi
            text: "Drzwi: ..."
            x: 42
            y: 188
            text_font: font_ui_14
            text_color: 0xFFFFFF
            recolor: true

        # Brama - bialy tytul, kolor zmienia tylko status.
        - label:
            id: lbl_pulpit_brama_icon
            text: "\U000F0299"
            x: 15
            y: 210
            text_font: icon_font_btn
            text_color: 0x888888
        - label:
            id: lbl_pulpit_brama_title
            text: "Brama"
            x: 42
            y: 214
            text_font: font_ui_14
            text_color: 0xFFFFFF
        - label:
            id: lbl_pulpit_brama_status
            text: "--"
            x: 105
            y: 214
            text_font: font_ui_14
            text_color: 0x888888

        # Dwa niezalezne przyciski pilota. Sterowanie dopiero po przytrzymaniu.
        - button:
            id: btn_pulpit_brama
            x: 10
            y: 237
            width: 105
            height: 36
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 5
            shadow_width: 0
            widgets:
              - label:
                  text: "BRAMA"
                  align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
            on_press:
              - globals.set:
                  id: btn_press_ms
                  value: !lambda 'return (esphome::millis)();'
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked) && ((esphome::millis)() - id(btn_press_ms)) >= 600 && id(brama_main_button_entity).has_state() && !id(brama_main_button_entity).state.empty();'
                  then:
                    - globals.set:
                        id: brama_page_active
                        value: "true"
                    - globals.set:
                        id: brama_waiting_for_motion
                        value: "true"
                    - globals.set:
                        id: brama_closed_since_ms
                        value: "0"
                    - homeassistant.action:
                        action: button.press
                        data_template:
                          entity_id: "{{ target_button }}"
                        variables:
                          target_button: !lambda 'return id(brama_main_button_entity).state;'
                    - lvgl.page.show:
                        id: page_brama
                        animation: MOVE_LEFT
                        time: 300ms
                    - script.execute: confirm_click
        - button:
            id: btn_pulpit_furtka
            x: 125
            y: 237
            width: 105
            height: 36
            bg_color: 0x18232B
            border_width: 1
            border_color: 0xB88632
            radius: 5
            shadow_width: 0
            widgets:
              - label:
                  text: "FURTKA"
                  align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
            on_press:
              - globals.set:
                  id: btn_press_ms
                  value: !lambda 'return (esphome::millis)();'
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked) && ((esphome::millis)() - id(btn_press_ms)) >= 600 && id(brama_pedestrian_enabled).state && id(brama_pedestrian_button_entity).has_state() && !id(brama_pedestrian_button_entity).state.empty();'
                  then:
                    - globals.set:
                        id: brama_page_active
                        value: "true"
                    - globals.set:
                        id: brama_waiting_for_motion
                        value: "true"
                    - globals.set:
                        id: brama_closed_since_ms
                        value: "0"
                    - homeassistant.action:
                        action: button.press
                        data_template:
                          entity_id: "{{ target_button }}"
                        variables:
                          target_button: !lambda 'return id(brama_pedestrian_button_entity).state;'
                    - lvgl.page.show:
                        id: page_brama
                        animation: MOVE_LEFT
                        time: 300ms
                    - script.execute: confirm_click



    # ------------------------------------------------------
    # Lista aktualnie wlaczonych lamp. Wybor lampy otwiera
    # odpowiadajaca jej strone pomieszczenia.
    # ------------------------------------------------------
    - id: page_lampy
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_pulpit
            animation: MOVE_RIGHT
            time: 250ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_pulpit
            animation: MOVE_RIGHT
            time: 250ms
      widgets:
        - label:
            text: "WŁĄCZONE ŚWIATŁA"
            align: TOP_MID
            y: 36
            text_font: font_ui_18
            text_color: 0xFFFFFF
        - button:
            id: btn_lampy_salon
            x: 10
            y: 82
            width: 220
            height: 44
            hidden: true
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x333333
            radius: 6
            shadow_width: 0
            widgets:
              - label:
                  text: "\U000F0335"
                  x: 12
                  y: 10
                  text_font: icon_font_btn
                  text_color: 0x00DD66
              - label:
                  text: "Salon - lampa"
                  x: 48
                  y: 13
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - lvgl.page.show:
                        id: page_salon
                        animation: MOVE_LEFT
                        time: 250ms
                    - script.execute: confirm_click
        - button:
            id: btn_lampy_sypialnia
            x: 10
            y: 136
            width: 220
            height: 44
            hidden: true
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x333333
            radius: 6
            shadow_width: 0
            widgets:
              - label:
                  text: "\U000F0335"
                  x: 12
                  y: 10
                  text_font: icon_font_btn
                  text_color: 0x00DD66
              - label:
                  text: "Sypialnia - lampa"
                  x: 48
                  y: 13
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - lvgl.page.show:
                        id: page_sypialnia
                        animation: MOVE_LEFT
                        time: 250ms
                    - script.execute: confirm_click
        - button:
            id: btn_lampy_erni
            x: 10
            y: 190
            width: 220
            height: 44
            hidden: true
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x333333
            radius: 6
            shadow_width: 0
            widgets:
              - label:
                  text: "\U000F0335"
                  x: 12
                  y: 10
                  text_font: icon_font_btn
                  text_color: 0x00DD66
              - label:
                  text: "Ernie - lampa"
                  x: 48
                  y: 13
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - lvgl.page.show:
                        id: page_erni
                        animation: MOVE_LEFT
                        time: 250ms
                    - script.execute: confirm_click
        - label:
            id: lbl_lampy_empty
            text: "Brak włączonych lamp"
            align: CENTER
            y: 145
            text_font: font_ui_14
            text_color: 0x888888
            hidden: true



