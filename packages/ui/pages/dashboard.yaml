# JARVIS 2.0 - STRONA PULPITU
# Moduł wydzielony mechanicznie z room-switcher-cyd (3).yaml.
# Na tym etapie zachowujemy istniejącą logikę i identyfikatory.

lvgl:
  pages:
    - id: page_pulpit
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_salon
            animation: NONE
            time: 300ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_zewnetrzne
            animation: NONE
            time: 300ms
      widgets:
        - label:
            id: lbl_pulpit_day
            text: "---"
            align: TOP_MID
            y: 24
            text_font: font_ui_24
            text_color: 0xFFFFFF
        - label:
            id: lbl_pulpit_date
            text: "--.--.----"
            align: TOP_MID
            y: 56
            text_font: font_ui_14
            text_color: 0x888888
        - label:
            id: lbl_pulpit_climate
            text: "--.-°C  --%  Zewnątrz --.-°C"
            align: TOP_MID
            y: 76
            text_font: font_ui_12
            text_color: 0x00AEEF
        - obj:
            x: 10
            y: 100
            width: 220
            height: 1
            bg_color: 0x333333
            bg_opa: COVER
            border_width: 0
            radius: 0
        # Klikalny, jednowierszowy pasek radia. Tekst przewija sie wewnatrz przycisku.
        - button:
            id: btn_pulpit_radio
            x: 4
            y: 102
            width: 220
            height: 22
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            widgets:
              - label:
                  x: 4
                  align: LEFT_MID
                  id: lbl_pulpit_radio_icon
                  text: "\U000F0439"
                  text_font: icon_font_btn
                  text_color: 0x888888
              - label:
                  id: lbl_pulpit_radio
                  text: "RADIO:   --  * --"
                  x: 32
                  align: LEFT_MID
                  width: 180
                  height: 20
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
                  long_mode: SCROLL_CIRCULAR
                  text_align: LEFT
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - lvgl.page.show:
                        id: page_radio
                        animation: NONE
                        time: 250ms
                    - script.execute: confirm_click
        # Podsumowanie oswietlenia - dotkniecie otwiera liste aktualnie wlaczonych lamp.
        - button:
            id: btn_pulpit_lights
            x: 4
            y: 128
            width: 220
            height: 24
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            widgets:
              - label:
                  id: lbl_pulpit_lamps_icon
                  text: "\U000F0E50"
                  x: 4
                  align: LEFT_MID
                  text_font: icon_font_btn
                  text_color: 0x888888
              - label:
                  text: "ŚWIATŁA:"
                  x: 32
                  align: LEFT_MID
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
                  text_align: LEFT
              - label:
                  id: lbl_pulpit_lamps
                  text: "#888888 0#"
                  x: 120
                  align: LEFT_MID
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
                  recolor: true
                  text_align: LEFT
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - lvgl.page.show:
                        id: page_lampy
                        animation: NONE
                        time: 250ms
                    - script.execute: confirm_click
        - button:
            id: btn_pulpit_piec
            x: 4
            y: 154
            width: 220
            height: 24
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            widgets:
              - label:
                  x: 4
                  align: LEFT_MID
                  id: lbl_piec_icon
                  text: "\U000F0238"
                  text_font: icon_font_btn
                  text_color: 0x888888
              - label:
                  height: 20
                  id: lbl_pulpit_piec
                  text: "PIEC:   ..."
                  x: 32
                  align: LEFT_MID
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
                  recolor: true
                  width: 180
                  text_align: LEFT
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - lvgl.page.show:
                        id: page_piec
                        animation: NONE
                        time: 250ms
                    - script.execute: confirm_click
        - label:
            id: lbl_drzwi_icon
            text: "\U000F081B"
            x: 4
            y: 180
            text_font: icon_font_btn
            text_color: 0x888888
        - label:
            id: lbl_pulpit_drzwi
            text: "Drzwi:   #888888 --#"
            x: 32
            y: 183
            text_font: font_ui_14
            text_color: 0xFFFFFF
            recolor: true

        # Klikalny wiersz statusu bramy — otwiera stronę, ale nie steruje napędem.
        - button:
            id: btn_pulpit_brama_status_row
            x: 4
            y: 206
            width: 220
            height: 24
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            widgets:
              - label:
                  id: lbl_pulpit_brama_icon
                  text: "\U000F0299"
                  x: 0
                  y: 2
                  text_font: icon_font_btn
                  text_color: 0x888888
              - label:
                  id: lbl_pulpit_brama_title
                  text: "Brama:"
                  x: 28
                  y: 5
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
              - label:
                  id: lbl_pulpit_brama_status
                  text: "--"
                  x: 96
                  y: 5
                  text_font: font_ui_14
                  text_color: 0x888888
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - globals.set:
                        id: brama_page_active
                        value: "true"
                    - globals.set:
                        id: brama_waiting_for_motion
                        value: "false"
                    - globals.set:
                        id: brama_closed_since_ms
                        value: "0"
                    - lvgl.page.show:
                        id: page_brama
                        animation: NONE
                        time: 300ms
                    - script.execute: confirm_click

        # Dwa niezalezne przyciski pilota. Sterowanie dopiero po przytrzymaniu.
        - button:
            id: btn_pulpit_brama
            x: 4
            y: 238
            width: 105
            height: 36
            pad_all: 0
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 5
            shadow_width: 0
            widgets:
              - label:
                  text: "BRAMA"
                  align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
                  text_align: CENTER
            on_press:
              - globals.set:
                  id: btn_press_ms
                  value: !lambda 'return (esphome::millis)();'
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked) && ((esphome::millis)() - id(btn_press_ms)) >= 600 && id(brama_main_button_entity).has_state() && !id(brama_main_button_entity).state.empty();'
                  then:
                    - globals.set:
                        id: brama_page_active
                        value: "true"
                    - globals.set:
                        id: brama_waiting_for_motion
                        value: "true"
                    - globals.set:
                        id: brama_closed_since_ms
                        value: "0"
                    - homeassistant.action:
                        action: button.press
                        data_template:
                          entity_id: "{{ target_button }}"
                        variables:
                          target_button: !lambda 'return id(brama_main_button_entity).state;'
                    - lvgl.page.show:
                        id: page_brama
                        animation: NONE
                        time: 300ms
                    - script.execute: confirm_click
        - button:
            id: btn_pulpit_furtka
            x: 125
            y: 238
            width: 105
            height: 36
            pad_all: 0
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 5
            shadow_width: 0
            widgets:
              - label:
                  text: "FURTKA"
                  align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
                  text_align: CENTER
            on_press:
              - globals.set:
                  id: btn_press_ms
                  value: !lambda 'return (esphome::millis)();'
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked) && ((esphome::millis)() - id(btn_press_ms)) >= 600 && id(brama_pedestrian_enabled).state && id(brama_pedestrian_button_entity).has_state() && !id(brama_pedestrian_button_entity).state.empty();'
                  then:
                    - globals.set:
                        id: brama_page_active
                        value: "true"
                    - globals.set:
                        id: brama_waiting_for_motion
                        value: "true"
                    - globals.set:
                        id: brama_closed_since_ms
                        value: "0"
                    - homeassistant.action:
                        action: button.press
                        data_template:
                          entity_id: "{{ target_button }}"
                        variables:
                          target_button: !lambda 'return id(brama_pedestrian_button_entity).state;'
                    - lvgl.page.show:
                        id: page_brama
                        animation: NONE
                        time: 300ms
                    - script.execute: confirm_click



        # Znacznik kompilacji — zmieniamy numer przy każdym kolejnym wgraniu testowym.
        - label:
            id: lbl_pulpit_build
            text: "TEST T056i IDF"
            align: BOTTOM_MID
            y: -4
            text_font: font_ui_12
            text_color: 0x555555

    # ------------------------------------------------------
    # Lista aktualnie wlaczonych lamp. Widoczne sa tylko te,
