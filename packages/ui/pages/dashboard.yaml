# JARVIS 2.0 - STRONA PULPITU
# Moduł wydzielony mechanicznie z room-switcher-cyd (3).yaml.
# Na tym etapie zachowujemy istniejącą logikę i identyfikatory.

lvgl:
  pages:
    - id: page_pulpit
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_salon
            animation: MOVE_LEFT
            time: 300ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_piec
            animation: MOVE_RIGHT
            time: 300ms
      widgets:
        - label:
            id: lbl_pulpit_day
            text: "---"
            align: TOP_MID
            y: 24
            text_font: font_ui_24
            text_color: 0xFFFFFF
        - label:
            id: lbl_pulpit_date
            text: "--.--.----"
            align: TOP_MID
            y: 56
            text_font: font_ui_14
            text_color: 0x888888
        - label:
            id: lbl_pulpit_climate
            text: "--.-°C  --%  Zewnątrz --.-°C"
            align: TOP_MID
            y: 76
            text_font: font_ui_12
            text_color: 0x00AEEF
        - obj:
            x: 10
            y: 100
            width: 220
            height: 1
            bg_color: 0x333333
            bg_opa: COVER
            border_width: 0
            radius: 0
        # Klikalny, jednowierszowy pasek radia. Tekst przewija sie wewnatrz przycisku.
        - button:
            id: btn_pulpit_radio
            x: 4
            y: 102
            width: 220
            height: 22
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            widgets:
              - label:
                  x: 4
                  align: LEFT_MID
                  id: lbl_pulpit_radio_icon
                  text: "\U000F0439"
                  text_font: icon_font_btn
                  text_color: 0x888888
              - label:
                  id: lbl_pulpit_radio
                  text: "RADIO:   --  * --"
                  x: 32
                  align: LEFT_MID
                  width: 180
                  height: 20
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
                  long_mode: SCROLL_CIRCULAR
                  text_align: LEFT
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - lvgl.page.show:
                        id: page_radio
                        animation: MOVE_LEFT
                        time: 250ms
                    - script.execute: confirm_click
        # Podsumowanie oswietlenia - dotkniecie otwiera liste aktualnie wlaczonych lamp.
        - button:
            id: btn_pulpit_lights
            x: 4
            y: 130
            width: 220
            height: 24
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            widgets:
              - label:
                  id: lbl_pulpit_lamps_icon
                  text: "\U000F0E50"
                  x: 4
                  align: LEFT_MID
                  text_font: icon_font_btn
                  text_color: 0x888888
              - label:
                  text: "ŚWIATŁA:"
                  x: 32
                  align: LEFT_MID
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
                  text_align: LEFT
              - label:
                  id: lbl_pulpit_lamps
                  text: "#888888 0#"
                  x: 120
                  align: LEFT_MID
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
                  recolor: true
                  text_align: LEFT
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - lvgl.page.show:
                        id: page_lampy
                        animation: MOVE_LEFT
                        time: 250ms
                    - script.execute: confirm_click
        - button:
            id: btn_pulpit_piec
            x: 4
            y: 158
            width: 220
            height: 24
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            widgets:
              - label:
                  x: 4
                  align: LEFT_MID
                  id: lbl_piec_icon
                  text: "\U000F0238"
                  text_font: icon_font_btn
                  text_color: 0x888888
              - label:
                  height: 20
                  id: lbl_pulpit_piec
                  text: "PIEC:   ..."
                  x: 32
                  align: LEFT_MID
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
                  recolor: true
                  width: 180
                  text_align: LEFT
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - lvgl.page.show:
                        id: page_piec
                        animation: MOVE_LEFT
                        time: 250ms
                    - script.execute: confirm_click
        - label:
            id: lbl_drzwi_icon
            text: "\U000F081B"
            x: 4
            y: 182
            text_font: icon_font_btn
            text_color: 0x888888
        - label:
            id: lbl_pulpit_drzwi
            text: "Drzwi:   ..."
            x: 32
            y: 185
            text_font: font_ui_14
            text_color: 0xFFFFFF
            recolor: true

        # Brama - bialy tytul, kolor zmienia tylko status.
        - button:
            id: btn_pulpit_brama_status
            x: 2
            y: 204
            width: 236
            height: 30
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            widgets:
              - label:
                  id: lbl_pulpit_brama_icon
                  text: "\U000F0299"
                  x: 2
                  align: LEFT_MID
                  text_font: icon_font_btn
                  text_color: 0x888888
              - label:
                  id: lbl_pulpit_brama_title
                  text: "Brama:"
                  x: 30
                  align: LEFT_MID
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
              - label:
                  id: lbl_pulpit_brama_status
                  text: "--"
                  x: 98
                  align: LEFT_MID
                  text_font: font_ui_14
                  text_color: 0x888888
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - globals.set:
                        id: brama_page_active
                        value: "true"
                    - lvgl.page.show:
                        id: page_brama
                        animation: MOVE_LEFT
                        time: 250ms
                    - script.execute: confirm_click

        # Dwa niezalezne przyciski pilota. Sterowanie dopiero po przytrzymaniu.
        - button:
            id: btn_pulpit_brama
            x: 4
            y: 238
            width: 105
            height: 36
            pad_all: 0
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 5
            shadow_width: 0
            widgets:
              - label:
                  text: "BRAMA"
                  align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
                  text_align: CENTER
            on_press:
              - globals.set:
                  id: btn_press_ms
                  value: !lambda 'return (esphome::millis)();'
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked) && ((esphome::millis)() - id(btn_press_ms)) >= 600 && id(brama_main_button_entity).has_state() && !id(brama_main_button_entity).state.empty();'
                  then:
                    - globals.set:
                        id: brama_page_active
                        value: "true"
                    - globals.set:
                        id: brama_waiting_for_motion
                        value: "true"
                    - globals.set:
                        id: brama_closed_since_ms
                        value: "0"
                    - homeassistant.action:
                        action: button.press
                        data_template:
                          entity_id: "{{ target_button }}"
                        variables:
                          target_button: !lambda 'return id(brama_main_button_entity).state;'
                    - lvgl.page.show:
                        id: page_brama
                        animation: MOVE_LEFT
                        time: 300ms
                    - script.execute: confirm_click
        - button:
            id: btn_pulpit_furtka
            x: 125
            y: 238
            width: 105
            height: 36
            pad_all: 0
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 5
            shadow_width: 0
            widgets:
              - label:
                  text: "FURTKA"
                  align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
                  text_align: CENTER
            on_press:
              - globals.set:
                  id: btn_press_ms
                  value: !lambda 'return (esphome::millis)();'
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked) && ((esphome::millis)() - id(btn_press_ms)) >= 600 && id(brama_pedestrian_enabled).state && id(brama_pedestrian_button_entity).has_state() && !id(brama_pedestrian_button_entity).state.empty();'
                  then:
                    - globals.set:
                        id: brama_page_active
                        value: "true"
                    - globals.set:
                        id: brama_waiting_for_motion
                        value: "true"
                    - globals.set:
                        id: brama_closed_since_ms
                        value: "0"
                    - homeassistant.action:
                        action: button.press
                        data_template:
                          entity_id: "{{ target_button }}"
                        variables:
                          target_button: !lambda 'return id(brama_pedestrian_button_entity).state;'
                    - lvgl.page.show:
                        id: page_brama
                        animation: MOVE_LEFT
                        time: 300ms
                    - script.execute: confirm_click


        # Bezpośredni dostęp do minutnika z pulpitu — niezależnie od zegara w pasku.
        - button:
            id: btn_pulpit_timer
            x: 10
            y: 282
            width: 220
            height: 30
            bg_color: 0x12303B
            border_width: 1
            border_color: 0x00AEEF
            radius: 5
            shadow_width: 0
            pad_all: 0
            widgets:
              - label:
                  text: "\\U000F0020  MINUTNIK"
                  align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - lvgl.page.show:
                        id: page_timer
                        animation: MOVE_LEFT
                        time: 250ms
                    - script.execute: timer_refresh
                    - script.execute: confirm_click



    # ------------------------------------------------------
    # Lista aktualnie wlaczonych lamp.
    # Minutnik — odliczanie działa także po opuszczeniu tej strony.
    - id: page_timer
      bg_color: 0x000000
      on_swipe_right:
        - lvgl.page.show:
            id: page_pulpit
            animation: MOVE_RIGHT
            time: 250ms
      on_swipe_left:
        - lvgl.page.show:
            id: page_pulpit
            animation: MOVE_RIGHT
            time: 250ms
      widgets:
        - label:
            text: "MINUTNIK"
            align: TOP_MID
            y: 38
            text_font: font_ui_18
            text_color: 0xFFFFFF
        - label:
            id: lbl_timer_countdown
            text: "05:00"
            align: TOP_MID
            y: 82
            text_font: font_ui_40
            text_color: 0x00AEEF
        - label:
            id: lbl_timer_status
            text: "Minutnik gotowy"
            align: TOP_MID
            y: 132
            text_font: font_ui_14
            text_color: 0x888888
        - button:
            x: 18
            y: 165
            width: 92
            height: 42
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 6
            widgets:
              - label:
                  text: "- 1 MIN"
                  align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(timer_running) && !id(timer_alarm_active) && id(timer_remaining_s) > 60;'
                  then:
                    - lambda: |-
                        id(timer_remaining_s) -= 60;
                        id(timer_selected_s) -= 60;
                    - script.execute: timer_refresh
        - button:
            x: 130
            y: 165
            width: 92
            height: 42
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 6
            widgets:
              - label:
                  text: "+ 1 MIN"
                  align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(timer_running) && !id(timer_alarm_active) && id(timer_remaining_s) < 5940;'
                  then:
                    - lambda: |-
                        id(timer_remaining_s) += 60;
                        id(timer_selected_s) += 60;
                    - script.execute: timer_refresh
        - button:
            id: btn_timer_start
            x: 18
            y: 222
            width: 92
            height: 42
            bg_color: 0x006B35
            border_width: 1
            border_color: 0x00AA55
            radius: 6
            widgets:
              - label:
                  text: "START"
                  align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked) && !id(timer_running) && !id(timer_alarm_active);'
                  then:
                    - globals.set:
                        id: timer_end_ms
                        value: !lambda 'return (esphome::millis)() + id(timer_remaining_s) * 1000UL;'
                    - globals.set:
                        id: timer_running
                        value: "true"
                    - globals.set:
                        id: timer_last_beep_s
                        value: "0"
                    - globals.set:
                        id: timer_auto_page_opened
                        value: "false"
                    - script.execute: timer_refresh
                    - script.execute: confirm_click
        - button:
            id: btn_timer_pause
            x: 130
            y: 222
            width: 92
            height: 42
            hidden: true
            bg_color: 0x7A4B00
            border_width: 1
            border_color: 0xCC8800
            radius: 6
            widgets:
              - label:
                  text: "PAUZA"
                  align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked) && id(timer_running);'
                  then:
                    - globals.set:
                        id: timer_remaining_s
                        value: !lambda |-
                          const uint32_t now = (esphome::millis)();
                          return id(timer_end_ms) > now ? (id(timer_end_ms) - now + 999) / 1000 : 0;
                    - globals.set:
                        id: timer_running
                        value: "false"
                    - script.execute: timer_refresh
        - button:
            x: 18
            y: 274
            width: 92
            height: 36
            bg_color: 0x303030
            border_width: 1
            border_color: 0x555555
            radius: 6
            widgets:
              - label:
                  text: "RESET"
                  align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - globals.set:
                        id: timer_running
                        value: "false"
                    - globals.set:
                        id: timer_alarm_active
                        value: "false"
                    - globals.set:
                        id: timer_last_beep_s
                        value: "0"
                    - globals.set:
                        id: timer_auto_page_opened
                        value: "false"
                    - rtttl.stop
                    - globals.set:
                        id: timer_remaining_s
                        value: !lambda "return id(timer_selected_s);"
                    - script.execute: timer_refresh
        - button:
            id: btn_timer_stop_alarm
            x: 130
            y: 274
            width: 92
            height: 36
            hidden: true
            bg_color: 0x990000
            border_width: 1
            border_color: 0xFF3333
            radius: 6
            widgets:
              - label:
                  text: "WYCISZ"
                  align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - script.execute: timer_stop_alarm

    # Wybor lampy otwiera
    # odpowiadajaca jej strone pomieszczenia.
    # ------------------------------------------------------
    - id: page_lampy
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_pulpit
            animation: MOVE_RIGHT
            time: 250ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_pulpit
            animation: MOVE_RIGHT
            time: 250ms
      widgets:
        - label:
            text: "WŁĄCZONE ŚWIATŁA"
            align: TOP_MID
            y: 36
            text_font: font_ui_18
            text_color: 0xFFFFFF
        - button:
            id: btn_lampy_salon
            x: 10
            y: 82
            width: 220
            height: 44
            pad_all: 0
            hidden: true
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x333333
            radius: 6
            shadow_width: 0
            widgets:
              - label:
                  x: 4
                  align: LEFT_MID
                  text: "\U000F0335"
                  text_font: icon_font_btn
                  text_color: 0x00DD66
              - label:
                  height: 20
                  text: "SALON - LAMPA"
                  x: 32
                  y: 12
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
                  width: 180
                  text_align: CENTER
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - lvgl.page.show:
                        id: page_salon
                        animation: MOVE_LEFT
                        time: 250ms
                    - script.execute: confirm_click
        - button:
            id: btn_lampy_sypialnia
            x: 10
            y: 136
            width: 220
            height: 44
            pad_all: 0
            hidden: true
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x333333
            radius: 6
            shadow_width: 0
            widgets:
              - label:
                  x: 4
                  align: LEFT_MID
                  text: "\U000F0335"
                  text_font: icon_font_btn
                  text_color: 0x00DD66
              - label:
                  height: 20
                  text: "SYPIALNIA - LAMPA"
                  x: 32
                  y: 12
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
                  width: 180
                  text_align: CENTER
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - lvgl.page.show:
                        id: page_sypialnia
                        animation: MOVE_LEFT
                        time: 250ms
                    - script.execute: confirm_click
        - button:
            id: btn_lampy_erni
            x: 10
            y: 190
            width: 220
            height: 44
            pad_all: 0
            hidden: true
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x333333
            radius: 6
            shadow_width: 0
            widgets:
              - label:
                  x: 4
                  align: LEFT_MID
                  text: "\U000F0335"
                  text_font: icon_font_btn
                  text_color: 0x00DD66
              - label:
                  height: 20
                  text: "ERNIE - LAMPA"
                  x: 32
                  y: 12
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
                  width: 180
                  text_align: CENTER
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - lvgl.page.show:
                        id: page_erni
                        animation: MOVE_LEFT
                        time: 250ms
                    - script.execute: confirm_click
        - label:
            id: lbl_lampy_empty
            text: "Brak włączonych lamp"
            align: CENTER
            y: 145
            text_font: font_ui_14
            text_color: 0x888888
            hidden: true



    # ------------------------------------------------------
    # Salon
    # ------------------------------------------------------
