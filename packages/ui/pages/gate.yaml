                  bg_color: 0x536A74
                  border_width: 1
                  border_color: 0x344953
                  radius: 1
              # Slupki bramy — ich kolor zmienia sie wraz z oswietleniem P4.
              - obj:
                  id: gate_pillar_left
                  x: 26
                  y: 18
                  width: 13
                  height: 91
                  bg_color: 0x59636A
                  border_width: 1
                  border_color: 0xAAB2B7
