# JARVIS 2.0 — PODGLAD BRAMY
# Stan i konfiguracja pochodza z integracji BFT w Home Assistant.
# Skrzydlo jest rysowane i animowane lokalnie przez ESP32.

lvgl:
  pages:
    - id: page_brama
      bg_color: 0x000000
      on_swipe_right:
        - globals.set:
            id: brama_page_active
            value: "false"
        - lvgl.page.show:
            id: page_pulpit
            animation: NONE
            time: 300ms
      widgets:
        - label:
            text: "Brama"
            align: TOP_MID
            y: 24
            text_font: font_ui_24
            text_color: 0xFFFFFF

        # Scena bramy BFT – ogrodzenie, pelne skrzydlo, murki i naped.
        # Identyfikatory animacji oraz sterowania pozostaja bez zmian.
