            x: 12
            y: 174
            text_font: font_ui_12
            text_color: 0xFFFFFF
        - label:
            id: lbl_brama_status_value
            text: "oczekiwanie na HA"
            x: 61
            y: 168
            width: 167
            text_align: CENTER
            text_font: font_ui_18
            text_color: 0x888888
            recolor: true
        - label:
            id: lbl_brama_position
            text: "Pozycja: --%"
            align: TOP_MID
            y: 228
            text_font: font_ui_12
            text_color: 0x00AEEF
            hidden: true
        - label:
            id: lbl_brama_lock_caption
            text: "Blokada zamknięcia"
            x: 12
            y: 198
            width: 216
            text_align: LEFT
            text_font: font_ui_12
            text_color: 0xFFFFFF
