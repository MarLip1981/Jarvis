            x: 12
            y: 70
            width: 216
            height: 132
            bg_color: 0x101A20
            border_width: 1
            border_color: 0x344953
            radius: 9
            pad_all: 0
            scrollable: false
            widgets:
              # Podjazd i dolna prowadnica.
              - obj:
                  x: 3
                  y: 109
                  width: 210
                  height: 2
                  bg_color: 0x82939A
                  border_width: 0
                  radius: 0
              - obj:
                  x: 3
                  y: 116
                  width: 210
                  height: 1
                  bg_color: 0x344953
                  bg_opa: 70%
                  border_width: 0
                  radius: 0
              # Fragment muru po lewej stronie wjazdu.
