# JARVIS 2.0 — PODGLAD BRAMY
# Stan i konfiguracja pochodza z integracji BFT w Home Assistant.
# Skrzydlo jest rysowane i animowane lokalnie przez ESP32.

lvgl:
  pages:
    - id: page_brama
      bg_color: 0x000000
      on_swipe_right:
        - globals.set:
            id: brama_page_active
            value: "false"
        - lvgl.page.show:
            id: page_pulpit
            animation: MOVE_RIGHT
            time: 300ms
      widgets:
        - label:
            text: "BRAMA"
            align: TOP_MID
            y: 30
            text_font: font_ui_24
            text_color: 0xFFFFFF

        # Scena: podjazd, prowadnica, slupki i ruchome skrzydlo.
        - obj:
            x: 12
            y: 70
            width: 216
            height: 132
            bg_color: 0x080D11
            border_width: 1
            border_color: 0x26343D
            radius: 5
            pad_all: 0
            scrollable: false
            widgets:
              - obj:
                  x: 0
                  y: 108
                  width: 216
                  height: 3
                  bg_color: 0x78838A
                  border_width: 0
                  radius: 0
              - obj:
                  id: gate_pillar_left
                  x: 26
                  y: 18
                  width: 13
                  height: 91
                  bg_color: 0x59636A
                  border_width: 1
                  border_color: 0xAAB2B7
                  radius: 1
              - obj:
                  id: gate_pillar_right
                  x: 178
                  y: 18
                  width: 13
                  height: 91
                  bg_color: 0x59636A
                  border_width: 1
                  border_color: 0xAAB2B7
                  radius: 1
              - obj:
                  x: 43
                  y: 102
                  width: 15
                  height: 7
                  bg_color: 0x9AA3A8
                  border_width: 0
                  radius: 1
              - obj:
                  x: 165
                  y: 102
                  width: 15
                  height: 7
                  bg_color: 0x9AA3A8
                  border_width: 0
                  radius: 1
              # Sygnalizator BFT — swieci przy otwartej bramie i podczas ruchu.
              - obj:
                  id: gate_beacon
                  x: 23
                  y: 9
                  width: 13
                  height: 8
                  bg_color: 0xFF8A00
                  bg_opa: TRANSP
                  border_width: 1
                  border_color: 0xFFD080
                  radius: 3
              # Uproszczony naped BFT DEIMOS w scenie.
              - obj:
                  x: 181
                  y: 82
                  width: 25
                  height: 26
                  bg_color: 0x26323A
                  border_width: 1
                  border_color: 0xAAB2B7
                  radius: 2
                  widgets:
                    - label:
                        text: "BFT"
                        align: CENTER
                        text_font: font_ui_12
                        text_color: 0xFFFFFF
              - label:
                  id: lbl_brama_warning_icon
                  text: "\U000F0027"
                  x: 151
                  y: 5
                  text_font: icon_font_btn
                  text_color: 0xFFCC00
                  hidden: true
              - label:
                  id: lbl_brama_p4
                  text: "P4"
                  x: 193
                  y: 5
                  text_font: font_ui_12
                  text_color: 0x777777
              - obj:
                  id: gate_leaf
                  x: 44
                  y: 28
                  width: 136
                  height: 78
                  bg_color: 0x202A30
                  border_width: 2
                  border_color: 0x9AA5AB
                  radius: 1
                  pad_all: 0
                  scrollable: false
                  widgets:
                    - obj:
                        x: 5
                        y: 7
                        width: 122
                        height: 5
                        bg_color: 0x8C989F
                        border_width: 0
                        radius: 0
                    - obj:
                        x: 5
                        y: 17
                        width: 122
                        height: 5
                        bg_color: 0x8C989F
                        border_width: 0
                        radius: 0
                    - obj:
                        x: 5
                        y: 27
                        width: 122
                        height: 5
                        bg_color: 0x8C989F
                        border_width: 0
                        radius: 0
                    - obj:
                        x: 5
                        y: 37
                        width: 122
                        height: 5
                        bg_color: 0x8C989F
                        border_width: 0
                        radius: 0
                    - obj:
                        x: 5
                        y: 47
                        width: 122
                        height: 5
                        bg_color: 0x8C989F
                        border_width: 0
                        radius: 0
                    - obj:
                        x: 5
                        y: 57
                        width: 122
                        height: 5
                        bg_color: 0x8C989F
                        border_width: 0
                        radius: 0
                    - obj:
                        x: 5
                        y: 67
                        width: 122
                        height: 5
                        bg_color: 0x8C989F
                        border_width: 0
                        radius: 0

        - label:
            id: lbl_brama_status
            text: "Stan: oczekiwanie na HA"
            align: TOP_MID
            y: 208
            text_font: font_gate_14
            text_color: 0x888888
            recolor: true
        - label:
            id: lbl_brama_position
            text: "Pozycja: --%"
            align: TOP_MID
            y: 228
            text_font: font_ui_12
            text_color: 0x00AEEF
        # Sterowanie brama i trybem furtki bezposrednio z karty.
        - button:
            id: btn_brama_karta_main
            x: 12
            y: 290
            width: 104
            height: 26
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 5
            shadow_width: 0
            widgets:
              - label:
                  id: lbl_brama_main_button
                  text: "OTWÓRZ"
                  align: CENTER
                  text_font: font_ui_12
                  text_color: 0xFFFFFF
            on_press:
              - globals.set:
                  id: btn_press_ms
                  value: !lambda 'return (esphome::millis)();'
            on_click:
              # Jarvis: 0.6-1.49 s = zwykly klik HA; >=1.5 s = P3.
              # Krotkie muśnięcie, wybudzenie i przeciaganie nie steruja brama.
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked) && ((esphome::millis)() - id(btn_press_ms)) >= 1500 && id(brama_manual_lock_entity).has_state() && !id(brama_manual_lock_entity).state.empty();'
                  then:
                    - homeassistant.action:
                        action: switch.toggle
                        data_template:
                          entity_id: "{{ target_switch }}"
                        variables:
                          target_switch: !lambda 'return id(brama_manual_lock_entity).state;'
                    - script.execute: confirm_click
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked) && ((esphome::millis)() - id(btn_press_ms)) >= 600 && ((esphome::millis)() - id(btn_press_ms)) < 1500 && id(brama_main_button_entity).has_state() && !id(brama_main_button_entity).state.empty();'
                  then:
                    - homeassistant.action:
                        action: button.press
                        data_template:
                          entity_id: "{{ target_button }}"
                        variables:
                          target_button: !lambda 'return id(brama_main_button_entity).state;'
                    - script.execute: confirm_click
        - button:
            id: btn_brama_karta_pedestrian
            x: 124
            y: 270
            width: 104
            height: 38
            bg_color: 0x18232B
            border_width: 1
            border_color: 0xB88632
            radius: 5
            shadow_width: 0
            widgets:
              - label:
                  id: lbl_brama_aux_button
                  text: "FURTKA"
                  align: CENTER
                  text_font: font_ui_12
                  text_color: 0xFFFFFF
            on_press:
              - globals.set:
                  id: btn_press_ms
                  value: !lambda 'return (esphome::millis)();'
            on_click:
              # Przy aktywnej furtce: 0.6-1.49 s otwiera furtke, >=1.5 s przelacza P4.
              # Gdy furtka jest wylaczona, przycisk staje sie sterowaniem P4.
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked) && ((esphome::millis)() - id(btn_press_ms)) >= 1500 && id(brama_pedestrian_enabled).state && id(brama_lighting_enabled).has_state() && id(brama_lighting_enabled).state == "true" && id(brama_entrance_lighting_entity).has_state() && !id(brama_entrance_lighting_entity).state.empty();'
                  then:
                    - homeassistant.action:
                        action: switch.toggle
                        data_template:
                          entity_id: "{{ target_switch }}"
                        variables:
                          target_switch: !lambda 'return id(brama_entrance_lighting_entity).state;'
                    - script.execute: confirm_click
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked) && ((esphome::millis)() - id(btn_press_ms)) >= 600 && ((esphome::millis)() - id(btn_press_ms)) < 1500 && id(brama_pedestrian_enabled).state && id(brama_pedestrian_button_entity).has_state() && !id(brama_pedestrian_button_entity).state.empty();'
                  then:
                    - homeassistant.action:
                        action: button.press
                        data_template:
                          entity_id: "{{ target_button }}"
                        variables:
                          target_button: !lambda |-
                            if (id(brama_ha_status).has_state() && id(brama_ha_status).state == "Otwarta")
                              return id(brama_main_button_entity).state;
                            return id(brama_pedestrian_button_entity).state;
                    - script.execute: confirm_click
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked) && ((esphome::millis)() - id(btn_press_ms)) >= 600 && !id(brama_pedestrian_enabled).state && id(brama_lighting_enabled).has_state() && id(brama_lighting_enabled).state == "true" && id(brama_entrance_lighting_entity).has_state() && !id(brama_entrance_lighting_entity).state.empty();'
                  then:
                    - homeassistant.action:
                        action: switch.toggle
                        data_template:
                          entity_id: "{{ target_switch }}"
                        variables:
                          target_switch: !lambda 'return id(brama_entrance_lighting_entity).state;'
                    - script.execute: confirm_click
        - label:
            id: lbl_brama_warning
            text: "UWAGA: FOTOKOMÓRKA"
            align: TOP_MID
            y: 244
            text_font: font_ui_12
            text_color: 0xFFCC00
            hidden: true
        - label:
            id: lbl_brama_gate_event
            text: "Brama: brak danych"
            align: TOP_MID
            y: 260
            text_font: font_ui_12
            text_color: 0xAAB2B7
        - label:
            id: lbl_brama_wicket_event
            text: "Furtka: brak danych"
            align: TOP_MID
            y: 273
            text_font: font_ui_12
            text_color: 0xAAB2B7
