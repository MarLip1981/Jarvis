                        width: 6
                        height: 57
                        bg_color: 0x8FA2AA
                        border_width: 1
                        border_color: 0x425760
                        radius: 0
                    - obj:
                        x: 55
                        y: 9
                        width: 6
                        height: 57
                        bg_color: 0x8FA2AA
                        border_width: 1
                        border_color: 0x425760
                        radius: 0
                    - obj:
                        x: 65
                        y: 9
