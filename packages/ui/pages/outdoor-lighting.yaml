# JARVIS 2.0 — STRONA OŚWIETLENIA ZEWNĘTRZNEGO
# Wydzielona z heating.yaml bez zmiany identyfikatora ani zachowania strony.

lvgl:
  pages:
    # ------------------------------------------------------
    # Oswietlenie zewnetrzne
    # ------------------------------------------------------
    - id: page_zewnetrzne
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_pulpit
            animation: NONE
            time: 300ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_piec
            animation: NONE
            time: 300ms
      widgets:
        - label:
            text: "OŚWIETLENIE"
            align: TOP_MID
            y: 25
            text_font: font_ui_24
            text_color: 0xFFFFFF
        - label:
            text: "ZEWNĘTRZNE"
            align: TOP_MID
            y: 55
            text_font: font_ui_18
            text_color: 0xAAAAAA
        - button:
            id: btn_zewnetrzne_adresowka
            x: 10
            y: 112
            width: 220
            height: 48
            pad_all: 4
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 6
            shadow_width: 0
            widgets:
              - label:
                  text: "ADRESÓWKA"
                  align: CENTER
                  text_font: font_ui_18
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - lvgl.page.show:
                        id: page_adresowka
                        animation: NONE
                        time: 250ms
                    - script.execute: confirm_click

    # ------------------------------------------------------
    # Adresowka — ekran docelowy. Sterowanie lampą dołączymy
    # później przez wspólny schemat strony lamp.
    # ------------------------------------------------------
    - id: page_adresowka
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_zewnetrzne
            animation: NONE
            time: 250ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_zewnetrzne
            animation: NONE
            time: 250ms
      widgets:
        - label:
            text: "ADRESÓWKA"
            align: TOP_MID
            y: 36
            text_font: font_ui_24
            text_color: 0xFFFFFF
