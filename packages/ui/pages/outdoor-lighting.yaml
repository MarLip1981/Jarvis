# JARVIS 2.0 — STRONA OŚWIETLENIA ZEWNĘTRZNEGO
# Wydzielona z heating.yaml bez zmiany identyfikatora ani zachowania strony.

lvgl:
  pages:
    - id: page_zewnetrzne
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_pulpit
            animation: NONE
            time: 300ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_piec
            animation: NONE
            time: 300ms
      widgets:
        - label:
            text: "OŚWIETLENIE"
            align: TOP_MID
            y: 25
            text_font: font_ui_24
            text_color: 0xFFFFFF
        - label:
            text: "ZEWNĘTRZNE"
            align: TOP_MID
            y: 55
            text_font: font_ui_18
            text_color: 0xAAAAAA
        - button:
            id: btn_zewnetrzne_adresowka
            x: 10
            y: 88
            width: 220
            height: 48
            pad_all: 4
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 6
            shadow_width: 0
            widgets:
              - label:
                  x: 4
                  align: LEFT_MID
                  id: lbl_zew_adresowka_icon
                  text: "\U000F0E4F"
                  text_font: icon_font_btn
                  text_color: 0xFF3333
              - label:
                  text: "ADRESÓWKA"
                  x: 32
                  y: 15
                  width: 180
                  height: 20
                  text_align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - globals.set:
                        id: lamp_selected
                        value: !lambda 'return std::string("adresowka");'
                    - lvgl.page.show:
                        id: page_lampa_wspolna
                        animation: NONE
                        time: 200ms
                    - script.execute: prepare_lamp_page
                    - script.execute: confirm_click
        - button:
            id: btn_zewnetrzne_wejscie_schodki
            x: 10
            y: 146
            width: 220
            height: 48
            pad_all: 4
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 6
            shadow_width: 0
            widgets:
              - label:
                  x: 4
                  align: LEFT_MID
                  id: lbl_zew_wejscie_icon
                  text: "\U000F0E4F"
                  text_font: icon_font_btn
                  text_color: 0xFF3333
              - label:
                  text: "WEJŚCIE / SCHODKI"
                  x: 32
                  y: 15
                  width: 180
                  height: 20
                  text_align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - globals.set:
                        id: lamp_selected
                        value: !lambda 'return std::string("wejscie_schodki");'
                    - lvgl.slider.update:
                        id: slider_lampa_brightness
                        value: 50
                    - lvgl.label.update:
                        id: lbl_lampa_brightness_val
                        text: "50%"
                    - lvgl.page.show:
                        id: page_lampa_wspolna
                        animation: NONE
                        time: 200ms
                    - script.execute: prepare_lamp_page
                    - script.execute: confirm_click
        - button:
            id: btn_zewnetrzne_wjazd
            x: 10
            y: 204
            width: 220
            height: 48
            pad_all: 4
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 6
            shadow_width: 0
            widgets:
              - label:
                  x: 4
                  align: LEFT_MID
                  id: lbl_zew_wjazd_icon
                  text: "\U000F0E4F"
                  text_font: icon_font_btn
                  text_color: 0xFF3333
              - label:
                  text: "WJAZD"
                  x: 32
                  y: 15
                  width: 180
                  height: 20
                  text_align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - globals.set:
                        id: lamp_selected
                        value: !lambda 'return std::string("outdoor_wjazd");'
                    - lvgl.page.show:
                        id: page_lampa_wspolna
                        animation: NONE
                        time: 200ms
                    - script.execute: prepare_lamp_page
                    - script.execute: confirm_click
        - button:
            id: btn_zewnetrzne_podworko
            x: 10
            y: 262
            width: 220
            height: 48
            pad_all: 4
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 6
            shadow_width: 0
            widgets:
              - label:
                  x: 4
                  align: LEFT_MID
                  id: lbl_zew_podworko_icon
                  text: "\U000F0E4F"
                  text_font: icon_font_btn
                  text_color: 0xFF3333
              - label:
                  text: "PODWÓRKO"
                  x: 32
                  y: 15
                  width: 180
                  height: 20
                  text_align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - globals.set:
                        id: lamp_selected
                        value: !lambda 'return std::string("outdoor_podworko");'
                    - lvgl.page.show:
                        id: page_lampa_wspolna
                        animation: NONE
                        time: 200ms
                    - script.execute: prepare_lamp_page
                    - script.execute: confirm_click
