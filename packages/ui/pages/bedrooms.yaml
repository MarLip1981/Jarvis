# JARVIS 2.0 — STRONY SYPIALNI I ERNIEGO
# Moduł wydzielony mechanicznie z room-switcher-cyd (3).yaml.
# Na tym etapie zachowujemy istniejącą logikę i identyfikatory.

lvgl:
  pages:
    - id: page_sypialnia
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_erni
            animation: MOVE_LEFT
            time: 300ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_salon
            animation: MOVE_RIGHT
            time: 300ms
      widgets:
        - label:
            text: "SYPIALNIA"
            align: TOP_MID
            y: 30
            text_font: font_ui_24
            text_color: 0xFFFFFF
        - button:
            x: 12
            y: 90
            width: 216
            height: 50
            pad_all: 0
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 5
            shadow_width: 0
            pressed:
              bg_color: 0x31546B
            widgets:
              - label:
                  align: LEFT_MID
                  id: lbl_sypialnia_lampa_icon
                  text: "\U000F0E4F"
                  text_font: icon_font_btn
                  text_color: 0xFF3333
              - label:
                  id: lbl_sypialnia_lampa
                  text: "LAMPA: NIEDOSTĘPNA"
                  x: 32
                  y: 0
                  width: 176
                  height: 50
                  text_align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFF3333
            on_press:
              - globals.set:
                  id: btn_press_ms
                  value: !lambda 'return (esphome::millis)();'
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - if:
                        condition:
                          lambda: 'return ((esphome::millis)() - id(btn_press_ms)) > 500;'
                        then:
                          - lvgl.page.show:
                              id: page_sypialnia_lampa
                              animation: FADE_IN
                              time: 200ms
                          - script.execute: confirm_click
                        else:
                          - switch.toggle: sypialnia_lampa
                          - script.execute: confirm_click

    # ------------------------------------------------------
    # Sypialnia > Lampa - sceny (przytrzymanie przycisku na
    # glownej stronie Sypialni). Wyjscie: swipe w KAZDA strone
    # wraca na Sypialnia.
    # ------------------------------------------------------
    - id: page_sypialnia_lampa
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_sypialnia
            animation: FADE_IN
            time: 200ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_sypialnia
            animation: FADE_IN
            time: 200ms
      widgets:
        - label:
            text: "SYPIALNIA - SCENY"
            align: TOP_MID
            y: 30
            text_font: font_ui_18
            text_color: 0xFFFFFF
        - label:
            id: lbl_sypialnia_lamp_state_icon
            text: "\U000F0E4F"
            align: TOP_MID
            y: 54
            text_font: icon_font_lamp_state
            text_color: 0xFF3333
        - label:
            id: lbl_sypialnia_lamp_state
            text: "Lampa: niedostępna"
            align: TOP_MID
            y: 98
            text_font: font_ui_14
            text_color: 0xFF3333
        - obj:
            x: 2
            y: 118
            width: 236
            height: 184
            bg_opa: TRANSP
            border_width: 2
            border_color: 0x333333
            radius: 8
            pad_all: 2
            scrollable: false
            widgets:
              - button:
                  x: 0
                  y: 0
                  width: 232
                  height: 28
                  pad_all: 0
                  bg_color: 0x18232B
                  border_width: 1
                  border_color: 0x45515C
                  radius: 5
                  shadow_width: 0
                  pressed:
                    bg_color: 0x31546B
                  widgets:
                    - label:
                        align: CENTER
                        text: "WŁĄCZ / WYŁĄCZ"
                        text_font: font_ui_14
                        text_align: CENTER
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                        - switch.toggle: sypialnia_lampa
                        - script.execute: confirm_click
              - label:
                  id: lbl_scena_studio
                  text: "..."
                  x: 0
                  y: 34
                  text_font: font_ui_14
                  text_color: 0xFFFFFF

              # --- Siatka 6 przyciskow scen 2x3. Podswietlenie
              # aktualnie wybranej sceny bierze sie WYLACZNIE ze stanu
              # w HA (state_scena_wybor -> patrz text_sensor nizej) -
              # dzieki temu zawsze jest zgodne z prawda, tak jak na
              # dashboardzie, niezaleznie od tego skad przyszla zmiana ---
              - button:
                  id: btn_scene_auto
                  x: 0
                  y: 52
                  width: 112
                  height: 32
                  pad_all: 0
                  bg_color: 0x18232B
                  border_width: 1
                  border_color: 0x45515C
                  radius: 5
                  shadow_width: 0
                  widgets:
                    - label:
                        align: CENTER
                        text: "AUTO"
                        text_font: font_ui_14
                        text_align: CENTER
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                          - homeassistant.action:
                              action: input_select.select_option
                              data:
                                entity_id: input_select.animacja_swiatla_studio
                                option: "AUTO"
                          - script.execute: confirm_click
              - button:
                  id: btn_scene_bialy
                  x: 116
                  y: 52
                  width: 112
                  height: 32
                  pad_all: 0
                  bg_color: 0x18232B
                  border_width: 1
                  border_color: 0x45515C
                  radius: 5
                  shadow_width: 0
                  widgets:
                    - label:
                        align: CENTER
                        text: "BIAŁY"
                        text_font: font_ui_14
                        text_align: CENTER
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                          - homeassistant.action:
                              action: input_select.select_option
                              data:
                                entity_id: input_select.animacja_swiatla_studio
                                option: "Bialy"
                          - script.execute: confirm_click
              - button:
                  id: btn_scene_wschod
                  x: 0
                  y: 88
                  width: 112
                  height: 32
                  pad_all: 0
                  bg_color: 0x18232B
                  border_width: 1
                  border_color: 0x45515C
                  radius: 5
                  shadow_width: 0
                  widgets:
                    - label:
                        align: CENTER
                        text: "WSCHÓD"
                        text_font: font_ui_14
                        text_align: CENTER
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                          - homeassistant.action:
                              action: input_select.select_option
                              data:
                                entity_id: input_select.animacja_swiatla_studio
                                option: "Wschod"
                          - script.execute: confirm_click
              - button:
                  id: btn_scene_zachod
                  x: 116
                  y: 88
                  width: 112
                  height: 32
                  pad_all: 0
                  bg_color: 0x18232B
                  border_width: 1
                  border_color: 0x45515C
                  radius: 5
                  shadow_width: 0
                  widgets:
                    - label:
                        align: CENTER
                        text: "ZACHÓD"
                        text_font: font_ui_14
                        text_align: CENTER
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                          - homeassistant.action:
                              action: input_select.select_option
                              data:
                                entity_id: input_select.animacja_swiatla_studio
                                option: "Zachod"
                          - script.execute: confirm_click
              - button:
                  id: btn_scene_tecza
                  x: 0
                  y: 124
                  width: 112
                  height: 32
                  pad_all: 0
                  bg_color: 0x18232B
                  border_width: 1
                  border_color: 0x45515C
                  radius: 5
                  shadow_width: 0
                  widgets:
                    - label:
                        align: CENTER
                        text: "TĘCZA"
                        text_font: font_ui_14
                        text_align: CENTER
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                          - homeassistant.action:
                              action: input_select.select_option
                              data:
                                entity_id: input_select.animacja_swiatla_studio
                                option: "Tecza"
                          - script.execute: confirm_click
              - button:
                  id: btn_scene_ognisko
                  x: 116
                  y: 124
                  width: 112
                  height: 32
                  pad_all: 0
                  bg_color: 0x18232B
                  border_width: 1
                  border_color: 0x45515C
                  radius: 5
                  shadow_width: 0
                  widgets:
                    - label:
                        align: CENTER
                        text: "OGNISKO"
                        text_font: font_ui_14
                        text_align: CENTER
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                          - homeassistant.action:
                              action: input_select.select_option
                              data:
                                entity_id: input_select.animacja_swiatla_studio
                                option: "Ognisko"
                          - script.execute: confirm_click

    # ------------------------------------------------------
    # Erni
    # ------------------------------------------------------
    - id: page_erni
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_pulpit
            animation: MOVE_LEFT
            time: 300ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_sypialnia
            animation: MOVE_RIGHT
            time: 300ms
      widgets:
        - label:
            text: "ERNI"
            align: TOP_MID
            y: 30
            text_font: font_ui_24
            text_color: 0xFFFFFF
        - button:
            x: 12
            y: 90
            width: 216
            height: 50
            pad_all: 0
            bg_color: 0x18232B
            border_width: 1
            border_color: 0x45515C
            radius: 5
            shadow_width: 0
            pressed:
              bg_color: 0x31546B
            widgets:
              - label:
                  align: LEFT_MID
                  id: lbl_erni_lampa_icon
                  text: "\U000F0E4F"
                  text_font: icon_font_btn
                  text_color: 0xFF3333
              - label:
                  id: lbl_erni_lampa
                  text: "LAMPA: NIEDOSTĘPNA"
                  x: 32
                  y: 0
                  width: 176
                  height: 50
                  text_align: CENTER
                  text_font: font_ui_14
                  text_color: 0xFF3333
            on_press:
              - globals.set:
                  id: btn_press_ms
                  value: !lambda 'return (esphome::millis)();'
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                  then:
                    - if:
                        condition:
                          lambda: 'return ((esphome::millis)() - id(btn_press_ms)) > 500;'
                        then:
                          - lvgl.page.show:
                              id: page_erni_lampa
                              animation: FADE_IN
                              time: 200ms
                          - script.execute: confirm_click
                        else:
                          - switch.toggle: erni_lampa
                          - script.execute: confirm_click

    # ------------------------------------------------------
    # Erni > Lampa - jasnosc i barwa (przytrzymanie przycisku na
    # glownej stronie Erni). Wyjscie: swipe w KAZDA strone
    # wraca na Erni.
    # ------------------------------------------------------
    - id: page_erni_lampa
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show:
            id: page_erni
            animation: FADE_IN
            time: 200ms
      on_swipe_right:
        - lvgl.page.show:
            id: page_erni
            animation: FADE_IN
            time: 200ms
      widgets:
        - label:
            text: "ERNI - LAMPA"
            align: TOP_MID
            y: 30
            text_font: font_ui_18
            text_color: 0xFFFFFF
        - label:
            id: lbl_erni_lamp_state_icon
            text: "\U000F0E4F"
            align: TOP_MID
            y: 54
            text_font: icon_font_lamp_state
            text_color: 0xFF3333
        - label:
            id: lbl_erni_lamp_state
            text: "Lampa: niedostępna"
            align: TOP_MID
            y: 98
            text_font: font_ui_14
            text_color: 0xFF3333
        - obj:
            x: 2
            y: 118
            width: 236
            height: 196
            bg_opa: TRANSP
            border_width: 2
            border_color: 0x333333
            radius: 8
            pad_all: 2
            scrollable: false
            widgets:
              - button:
                  x: 0
                  y: 0
                  width: 232
                  height: 28
                  pad_all: 0
                  bg_color: 0x18232B
                  border_width: 1
                  border_color: 0x45515C
                  radius: 5
                  shadow_width: 0
                  pressed:
                    bg_color: 0x31546B
                  widgets:
                    - label:
                        align: CENTER
                        text: "WŁĄCZ / WYŁĄCZ"
                        text_font: font_ui_14
                        text_align: CENTER
                  on_click:
                    - if:
                        condition:
                          lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                        then:
                        - switch.toggle: erni_lampa
                        - script.execute: confirm_click
              - label:
                  id: lbl_erni_brightness
                  text: "Jasność"
                  x: 5
                  y: 34
                  text_font: font_ui_14
                  text_color: 0xCCCCCC
              - slider:
                  id: slider_erni_brightness
                  x: 20
                  y: 56
                  width: 30
                  height: 100
                  min_value: 1
                  max_value: 100
                  value: 50
                  on_release:
                    then:
                      - if:
                          condition:
                            lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                          then:
                            - homeassistant.action:
                                action: light.turn_on
                                data:
                                  entity_id: light.sypialnia
                                data_template:
                                  brightness_pct: !lambda 'return std::to_string(lv_slider_get_value(id(slider_erni_brightness)));'
                            - script.execute: confirm_click

              - label:
                  id: lbl_erni_colortemp
                  text: "Barwa"
                  x: 125
                  y: 34
                  text_font: font_ui_14
                  text_color: 0xCCCCCC
              - slider:
                  id: slider_erni_colortemp
                  x: 160
                  y: 56
                  width: 30
                  height: 100
                  min_value: 2000
                  max_value: 6500
                  value: 4000
                  on_release:
                    then:
                      - if:
                          condition:
                            lambda: 'return !id(screen_was_asleep) && !id(touch_gesture_blocked);'
                          then:
                            - homeassistant.action:
                                action: light.turn_on
                                data:
                                  entity_id: light.sypialnia
                                data_template:
                                  color_temp_kelvin: !lambda 'return std::to_string(lv_slider_get_value(id(slider_erni_colortemp)));'
                            - script.execute: confirm_click

              - label:
                  id: lbl_erni_brightness_val
                  text: "--"
                  align: TOP_LEFT
                  x: 15
                  y: 160
                  text_font: font_ui_14
                  text_color: 0xFFFFFF
              - label:
                  id: lbl_erni_colortemp_val
                  text: "--"
                  align: TOP_LEFT
                  x: 148
                  y: 160
                  text_font: font_ui_14
                  text_color: 0xFFFFFF

    # ------------------------------------------------------
